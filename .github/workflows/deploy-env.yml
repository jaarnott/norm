name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      REGION: australia-southeast1
      # Images are always built and stored in the testing project's Artifact Registry
      REGISTRY: australia-southeast1-docker.pkg.dev/norm-testing/norm

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # A migration that FAILS must fail the deploy. This step used to end in
      # `|| echo "Migration job not found — skipping"`, which swallowed every
      # failure, not just a missing job. Production migrations then failed
      # silently for three days after the database was moved during the August
      # cost cuts (the job's DATABASE_URL_DIRECT still pointed at the stopped
      # instance) — three revisions went unapplied while every deploy reported
      # green, and the code that needed those tables shipped without them.
      #
      # So: a missing job is still tolerated (not every environment has one),
      # but only after asking whether it exists. Anything else stops the line.
      - name: Run database migrations
        run: |
          set -euo pipefail
          if ! gcloud run jobs describe norm-migrate-${{ inputs.environment }} \
                 --region "$REGION" --project ${{ vars.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "No norm-migrate-${{ inputs.environment }} job — skipping migrations."
            exit 0
          fi
          gcloud run jobs execute norm-migrate-${{ inputs.environment }} \
            --region "$REGION" \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --wait

      # --timeout is set on EVERY deploy, not left to drift. It is the
      # backstop for a chat turn, which streams inside one request: the
      # platform default of 300s was severing 12.4% of them (13 of 105 in the
      # fortnight to 1 Oct 2026), and because cpu-throttling is false the
      # worker carried on afterwards — so the cut hid long turns rather than
      # bounding them. The real limit is TURN_BUDGET_SECONDS (900) in
      # apps/api/app/agents/tool_loop.py, which ends a turn with a report;
      # this only has to be high enough never to fire first.
      #
      # It lives here because nothing else applies it. infra/terraform
      # declares api_timeout_seconds = 1500, but production Terraform is not
      # applied by this pipeline — which is exactly how the live service sat
      # at 300 for months while the repo said 1800. Keep the two in step.
      - name: Deploy API to Cloud Run
        run: |
          gcloud run services update norm-api-${{ inputs.environment }} \
            --image $REGISTRY/norm-api:${{ inputs.image_tag }} \
            --timeout=1500 \
            --region $REGION \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --quiet

      # The sensei's ~2-minute analysis runs in a SEPARATE Cloud Run job
      # (norm-sensei-<env>), on the same norm-api image. A Cloud Run job PINS its
      # image digest at update time — a `:latest` reference does NOT re-resolve
      # per execution — so a job left un-updated runs stale code indefinitely.
      # Nothing here updated it, and it ran weeks-old code while the API moved on:
      # the 29 Aug auto-spec fixes shipped to the API, but the study kept running
      # the old image and left invoices stuck on "Norm is studying…". Point it at
      # the image just deployed. A missing job is tolerated (not every env has one).
      - name: Update sensei job image
        run: |
          set -euo pipefail
          if ! gcloud run jobs describe norm-sensei-${{ inputs.environment }} \
                 --region "$REGION" --project ${{ vars.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "No norm-sensei-${{ inputs.environment }} job — skipping."
            exit 0
          fi
          gcloud run jobs update norm-sensei-${{ inputs.environment }} \
            --image $REGISTRY/norm-api:${{ inputs.image_tag }} \
            --region "$REGION" \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run services update norm-web-${{ inputs.environment }} \
            --image $REGISTRY/norm-web:${{ inputs.image_tag }} \
            --region $REGION \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --quiet

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe norm-api-${{ inputs.environment }} \
            --region $REGION \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --format "value(status.url)")

          echo "Testing API at $API_URL"
          for i in 1 2 3 4 5 6; do
            if curl -sf "$API_URL/health" > /dev/null 2>&1; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts"
          exit 1

      - name: Report deploy status
        if: always()
        run: |
          API_URL=$(gcloud run services describe norm-api-${{ inputs.environment }} \
            --region $REGION \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --format "value(status.url)" 2>/dev/null || echo "")

          if [ -n "$API_URL" ]; then
            curl -sS -X POST "$API_URL/api/admin/deploy-webhook" \
              -H "Content-Type: application/json" \
              -d '{
                "environment": "${{ inputs.environment }}",
                "image_tag": "${{ inputs.image_tag }}",
                "git_sha": "${{ github.sha }}",
                "status": "${{ job.status }}",
                "commit_message": "${{ github.event.head_commit.message || 'manual deploy' }}",
                "logs_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "triggered_by": "github-actions"
              }' || echo "Deploy webhook failed (non-fatal)"
          fi
