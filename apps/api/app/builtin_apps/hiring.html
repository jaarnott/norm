      }
      draw();
    }).catch(fail);
  }

  // ---- Interviews ----------------------------------------------------------
  var ivState = { when: 'upcoming', from: '', to: '', job: '', venue: '', who: '', status: 'scheduled', open: {} };
  var ivData = null;
  function showInterviews() {
    newJobLeads(true);
    loading();
    var s = ivState, args = { when: s.when };
    if (s.when === 'range') {
      args.from = s.from ? new Date(s.from + 'T00:00:00').toISOString() : null;
      args.to = s.to ? new Date(s.to + 'T23:59:59').toISOString() : null;
    }
    run('interviews', args).then(function (d) { ivData = d; drawInterviews(); }).catch(fail);
  }
  // Job, venue, interviewer and status filter what's loaded — no round trip.
  function drawInterviews() {
    var s = ivState, d = ivData || {};
    (function () {
      var venues = d.venues || [];
      var unconnected = venues.filter(function (v) { return !(v.mailbox && v.mailbox.connected); });
      var rows = (d.rows || []).filter(function (r) {
        if (s.job && (r.job || {}).id !== s.job) return false;
        if (s.venue && (r.job || {}).venue_id !== s.venue) return false;
        if (s.who && (r.interviewer_ids || []).indexOf(s.who) < 0) return false;
        if (s.status && r.status !== s.status) return false;
        return true;
      });
      var sel = function (id, label, opts, val) {
        return '<select class="n-select" id="' + id + '" aria-label="' + label + '">' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
      };
      var toolbar = '<div class="toolbar">' +
        sel('if-when', 'When', [['upcoming', 'Upcoming'], ['past', 'Past'], ['range', 'Date range']], s.when) +
        (s.when === 'range' ? '<input type="date" class="n-input" id="if-from" aria-label="From" value="' + esc(s.from) + '"><input type="date" class="n-input" id="if-to" aria-label="To" value="' + esc(s.to) + '">' : '') +
        sel('if-job', 'Job', [['', 'All jobs']].concat((d.jobs || []).map(function (j) { return [j.id, j.title || 'Untitled']; })), s.job) +
        sel('if-venue', 'Venue', [['', 'All venues']].concat(venues.map(function (v) { return [v.id, v.name]; })), s.venue) +
        sel('if-who', 'Interviewer', [['', 'All interviewers']].concat((d.people || []).map(function (p) { return [p.id, p.name]; })), s.who) +
        sel('if-status', 'Status', [['scheduled', 'Scheduled'], ['completed', 'Completed'], ['cancelled', 'Cancelled'], ['', 'Any status']], s.status) + '</div>';
      var hint = venues.length && unconnected.length === venues.length ?
        '<div class="banner" role="note">' + icon('info', 14) + '<span>Invites go out from the job venue’s own mailbox. None is connected yet — connect one in Settings → Venues (“Venue mailbox”) and interviews will send calendar invites.</span></div>' : '';
      var table = rows.length ? '<table class="n-table list ivs"><thead><tr><th scope="col" class="sel"><span class="sr">Expand</span></th><th scope="col">When</th><th scope="col">Interview</th><th scope="col">Job</th><th scope="col">Interviewers</th><th scope="col">Status</th><th scope="col" class="tools"><span class="sr">Actions</span></th></tr></thead><tbody>' +
        rows.map(function (r) {
          var group = !!r.group_id, open = !!s.open[r.key], members = r.members || [];
          var label = group ? esc(r.title || 'Group interview') + ' · ' + members.length + ' candidate' + (members.length === 1 ? '' : 's') : esc((members[0] || {}).candidate_name || 'Candidate');
          var live = r.status === 'scheduled';
          var head = '<tr><td class="sel">' + (group ? iconBtn(open ? 'chevdown' : 'right', (open ? 'Hide' : 'Show') + ' candidates', 'data-toggle="' + esc(r.key) + '" aria-expanded="' + open + '"', 'toggle') : '') + '</td>' +
            '<td class="when">' + esc(when(r.scheduled_at)) + '</td>' +
            '<td class="lead"><div' + (group ? '' : ' class="open" data-openiv="' + esc((members[0] || {}).application_id || '') + '"') + '><div class="name">' + label + '</div>' +
              '<div class="meta">' + esc(joinMeta([typeLabel(r.interview_type), r.duration_minutes ? r.duration_minutes + ' min' : '', r.location || '', r.calendar ? 'invite sent' : ''])) + '</div>' +
              '<div class="meta m-only">' + esc(joinMeta([(r.job || {}).title || '', (r.interviewer_names || []).join(', ')])) + '</div></div></td>' +
            '<td class="note">' + esc((r.job || {}).title || '—') + (r.venue_name ? '<div class="meta">' + esc(r.venue_name) + '</div>' : '') + '</td>' +
            '<td class="note">' + esc((r.interviewer_names || []).join(', ') || '—') + '</td>' +
            '<td class="status">' + badge(cap(r.status), r.status === 'cancelled' ? 'error' : (r.status === 'completed' ? 'ok' : 'info')) + '</td>' +
            '<td class="tools"><div class="btns">' + (group && live ? btn('Edit', 'quiet', 'data-gedit="' + esc(r.group_id) + '" data-gjob="' + esc((r.job || {}).id || '') + '"', { sm: true }) +
              btn('Cancel', 'quiet', 'data-gcancel="' + esc(r.group_id) + '"', { sm: true }) : '') + '</div></td></tr>';
          var kids = group && open ? members.map(function (m) {
            return '<tr class="member"><td class="sel"></td><td class="when"></td><td class="lead"><div class="open" data-openiv="' + esc(m.application_id) + '"><div class="name">' + esc(m.candidate_name) + '</div></div></td>' +
              '<td class="note"></td><td class="note"></td><td class="status"></td>' +
              '<td class="tools"><div class="btns">' + (live ? btn('Remove', 'quiet', 'data-mremove="' + esc(m.interview_id) + '"', { sm: true }) : '') + '</div></td></tr>';
          }).join('') + (members.length ? '' : '<tr class="member"><td></td><td></td><td class="lead"><span class="hint">No candidates left in this group.</span></td><td></td><td></td><td></td><td></td></tr>') : '';
          return head + kids;
        }).join('') + '</tbody></table>'
        : state('empty', 'No interviews here', s.when === 'upcoming' ? 'Schedule one from a candidate, or tick several on the Candidates tab for a group interview.' : '');
      body.innerHTML = toolbar + hint + table;

      var set = function (k, v) { s[k] = v; showInterviews(); };
      document.getElementById('if-when').addEventListener('change', function () { set('when', this.value); });
      var f = document.getElementById('if-from'); if (f) f.addEventListener('change', function () { set('from', this.value); });
      var t = document.getElementById('if-to'); if (t) t.addEventListener('change', function () { set('to', this.value); });
      // These filter what's loaded — no round trip.
      ['job', 'venue', 'who', 'status'].forEach(function (k) {
        document.getElementById('if-' + k).addEventListener('change', function () { s[k] = this.value; drawInterviews(); });
      });
      bind('[data-toggle]', function (el) { var k = el.getAttribute('data-toggle'); if (s.open[k]) delete s.open[k]; else s.open[k] = true; drawInterviews(); });
      bind('[data-openiv]', function (el) {
        var id = el.getAttribute('data-openiv'); if (!id) return;
        showCandidate(id, null, { backLabel: 'Interviews', back: function () { selectTab('ivs'); showInterviews(); } });
      });
      bind('[data-gedit]', function (el) {
        groupModal({ mode: 'edit', jobId: el.getAttribute('data-gjob'), groupId: el.getAttribute('data-gedit') }, function () { showInterviews(); });
      });
      bind('[data-gcancel]', function (el) {
        if (!confirm('Cancel this group interview for everyone? The interviewers are told through the calendar.')) return;
        run('cancel_group', { group_id: el.getAttribute('data-gcancel') }).then(function (r) { showInterviews(); notice(r.message || 'Group interview cancelled'); }).catch(fail);
      });
      bind('[data-mremove]', function (el) {
        if (!confirm('Take this candidate out of the group interview?')) return;
        run('remove_group_member', { interview_id: el.getAttribute('data-mremove') }).then(function (r) { showInterviews(); notice(r.message || 'Removed — invite updated'); }).catch(fail);
      });
    })();
  }

  // ---- Settings: email + venue mailboxes -------------------------------------
  function showSettings() {
    newJobLeads(true);
    loading();
    run('settings').then(function (d) {
      var venues = d.venues || [];
      var log = (d.log || []).map(function (e) {
        return '<tr><td class="lead"><div class="name">' + esc(e.subject || '(no subject)') + '</div><div class="meta">' + esc((e.to || []).join(', ')) + '</div></td>' +
          '<td class="note">' + esc(cap(e.kind || 'message')) + '</td>' +
          '<td class="status">' + badge(cap(e.status || ''), e.status === 'sent' ? 'ok' : (e.status === 'failed' ? 'error' : '')) + (e.is_test ? badge('Test') : '') + '</td>' +
          '<td class="note">' + esc((e.at || '').slice(0, 16).replace('T', ' ')) + '</td>' +
          '<td class="tools"><div class="btns">' + btn('View', 'quiet', 'data-mview="' + esc(e.id) + '"', { sm: true }) + '</div></td></tr>';
      }).join('');
      body.innerHTML =
        '<section class="card"><div class="card-head"><h2 class="card-title grow">Email</h2>' + badge(d.email_enabled ? 'On' : 'Off', d.email_enabled ? 'ok' : '') + '</div>' +
          '<div class="card-body"><div class="hint">Candidate invitations and the emails you send from the Candidates tab. ' +
            (d.email_enabled ? 'Email is on.' : 'Email is off — Orbit is still the live system, so nothing is sent from here yet.') + '</div></div>' +
          (d.can_manage ? '<div class="card-foot">' + (d.email_enabled ? btn('Turn email off', 'secondary', 'id="em-off"') : btn('Turn email on', 'secondary', 'id="em-on"')) +
            '<span class="hint">Only org managers can change this.</span></div>' : '') + '</section>' +
        '<section class="card"><div class="card-head"><h2 class="card-title">Venue mailboxes</h2></div>' +
          '<div class="card-body"><div class="hint">Interview invites go out from the job venue’s own mailbox, with a candidate pack attached. Connect one under Settings → Venues → “Venue mailbox”.</div></div>' +
          (venues.length ? '<table class="n-table list"><tbody>' + venues.map(function (v) {
            var m = v.mailbox || {};
            return '<tr><td class="lead"><div class="name">' + esc(v.name) + '</div>' + (m.email ? '<div class="meta">' + esc(m.email) + '</div>' : '') + '</td>' +
              '<td class="tools">' + (m.connected ? (m.needs_reconnect ? badge('Reconnect needed', 'warn') : badge('Connected', 'ok')) : badge('Not connected')) + '</td></tr>';
          }).join('') + '</tbody></table>' : '<div class="card-note none">No venues.</div>') + '</section>' +
        '<section class="card"><div class="card-head"><h2 class="card-title">Email log</h2></div>' +
          (log ? '<table class="n-table list"><tbody>' + log + '</tbody></table>' : '<div class="card-note none">Nothing has been sent from Norm Hiring.</div>') + '</section>';
      var on = document.getElementById('em-on'), off = document.getElementById('em-off');
      var toggle = function (v) {
        if (v && !confirm('Turn on email for Norm Hiring? Candidates will start getting invitations from Norm — while Orbit is live they could get two.')) return;
        run('set_email_enabled', { enabled: v }).then(showSettings).catch(fail);
      };
      if (on) on.addEventListener('click', function () { toggle(true); });
      if (off) off.addEventListener('click', function () { toggle(false); });
      bind('[data-mview]', function (el) {
        run('email_preview', { log_id: el.getAttribute('data-mview') }).then(function (r) {
          modal('<h2 class="modal-title">Email</h2><iframe class="mail-frame" sandbox title="Email preview"></iframe>' +
            '<div class="modal-foot">' + btn('Close', 'secondary', 'id="mv-close"') + '</div>');
          modalHost.querySelector('.panel').classList.add('wide');
          modalHost.querySelector('iframe').srcdoc = r.html || '';
          document.getElementById('mv-close').addEventListener('click', closeModal);
        }).catch(fail);
      });
    }).catch(fail);
  }

  // ---- Talent pool -------------------------------------------------------
  function showPool() {
    newJobLeads(true);
    loading();
    run('talent_pool').then(function (d) {
      var rows = d.candidates || [];
      if (!rows.length) { body.innerHTML = state('empty', 'Nobody in the talent pool yet', 'Tick <b>Talent pool</b> on a candidate to add them.'); return; }
      body.innerHTML = '<table class="n-table list pool"><thead><tr>' +
          '<th scope="col">Candidate</th><th scope="col">Note</th><th scope="col" class="tools"><span class="sr">Actions</span></th>' +
        '</tr></thead><tbody>' +
        rows.map(function (c) {
          return '<tr><td class="lead"><div class="name">' + esc(c.name) + '</div>' +
              (c.email ? '<div class="meta">' + esc(c.email) + '</div>' : '') +
              (c.talent_pool_note ? '<div class="meta m-only">' + esc(c.talent_pool_note) + '</div>' : '') + '</td>' +
            '<td class="note">' + esc(c.talent_pool_note || '') + '</td>' +
            '<td class="tools"><div class="btns">' + btn('Remove', 'secondary', 'data-tpremove="' + esc(c.id) + '"', { sm: true }) + '</div></td></tr>';
        }).join('') + '</tbody></table>';
      bind('[data-tpremove]', function (el) { run('set_talent_pool', { candidate_id: el.getAttribute('data-tpremove'), in_talent_pool: false }).then(showPool).catch(fail); });
    }).catch(fail);
  }

  function render() {
    closeModal();
    if (view === 'pool') showPool();
    else if (view === 'cands') showCandidates(null);
    else if (view === 'ivs') showInterviews();
    else if (view === 'settings') showSettings();
    else showJobs();
  }

  // While Orbit is the live system, say when this copy was last refreshed
  // from it — only when something here actually came from Orbit.
  function showBanner() {
    run('sync_status').then(function (r) {
      var el = document.getElementById('banner');
      if (!r || !r.refreshed_at) { el.innerHTML = ''; return; }
      var d = new Date(r.refreshed_at);
      var day = isNaN(d.getTime()) ? String(r.refreshed_at).slice(0, 10) : d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      el.innerHTML = icon('info', 14) + '<span>Data refreshed from Orbit on ' + esc(day) +
        ' — Orbit is still the live system; changes made here are overwritten by the next refresh.</span>';
    }).catch(function () { /* the banner is a courtesy, never an error */ });
  }

  document.getElementById('newjob').addEventListener('click', newJob);
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      view = t.getAttribute('data-view');
      document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x === t)); });
      render();
    });
  });

  function selectTab(v) {
    view = v;
    document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x.getAttribute('data-view') === v)); });
  }

  // Where Norm asked us to open — this component's inputs (view, job,
  // candidate; ids or names). They ride every init, so only the FIRST one
  // acts on them: a venue switch must not yank the user back.
  var started = false;
  function start(c) {
    var ins = c.inputs || {};
    if (ins.view === 'talent_pool' || ins.view === 'pool') selectTab('pool');
    else if (ins.view === 'openings' || ins.view === 'jobs') selectTab('jobs');
    else if (ins.view === 'candidates') selectTab('cands');
    else if (ins.view === 'interviews') selectTab('ivs');
    else if (ins.view === 'settings') selectTab('settings');
    if (!ins.job && !ins.candidate) return false;
    loading();
    run('locate', { job: ins.job || null, candidate: ins.candidate || null }).then(function (r) {
      if (r.application_id) showCandidate(r.application_id, r.job_id);
      else if (r.job_id) showPipeline(r.job_id);
      else render();
    }).catch(fail);
    return true;
  }

  norm.onReady(function (c) {
    ctx = c;
    var v = (c.venues || []).find(function (x) { return x.id === c.venueId; });
    document.getElementById('scope').textContent = 'Openings across the group' + (v ? ' · hiring into ' + v.name : '');
    if (!started) { started = true; showBanner(); if (start(c)) return; }
    render();
  });
})();
</script>
