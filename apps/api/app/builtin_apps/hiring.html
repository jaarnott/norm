<style>
  /* Norm Hiring. The host (AppRunner) hands every app Norm's tokens
     (--norm-*), the element defaults (Figtree, 14px body, the page gutter as
     body padding) and the opt-in .n-* classes. This sheet only lays the app
     out on top of them: no palette of its own, no outer frame. */
  .wrap { min-width: 0; }

  /* The host draws the app's title above the frame, so ours shows only when
     there is no host to do it. The scope line (which venue hiring goes into)
     stays — the host's header doesn't say it. */
  .head h1 { margin: 0; font-size: var(--norm-fs-xl); font-weight: 700; letter-spacing: -0.01em; }
  .head .scope { margin-top: 2px; font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  html[data-norm-variant] .head h1 { display: none; }
  html[data-norm-variant] .head { margin-bottom: 4px; }
  html[data-norm-variant] .head .scope { margin-top: 0; }
  html:not([data-norm-variant]) .bar { margin-top: 16px; }

  /* Tabs on the left, the one primary action on the right, one rule under both. */
  .bar { display: flex; align-items: flex-end; gap: 16px; box-shadow: inset 0 -1px 0 var(--norm-line); }
  .bar .n-tabs { flex: 1 1 auto; min-width: 0; box-shadow: none; }
  .bar > .n-btn { flex: 0 0 auto; align-self: center; margin-bottom: 8px; }
  .n-btn svg { flex: 0 0 auto; }
  .n-btn--primary svg { stroke-width: 2; }
  #body-wrap { padding-top: 16px; }

  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .meta { font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .hint { font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .lbl { font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); }
  .none { padding: 4px 0; font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .link { color: var(--norm-accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .btns { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

  /* Loading, empty and error: the same three states as every Norm page. */
  .state { padding: 40px 16px; text-align: center; color: var(--norm-muted); }
  .state .spin { display: block; margin: 0 auto 8px; color: var(--norm-icon); animation: spin 1s linear infinite; }
  .state-title { color: var(--norm-text-soft); font-weight: 500; }
  .state-detail { margin-top: 4px; font-size: var(--norm-fs-sm); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .state .spin { animation: none; } }
  .alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--norm-radius);
           background: var(--norm-error-bg); color: var(--norm-error); }
  .alert svg { flex: 0 0 auto; margin-top: 2px; }
  .alert-title { font-weight: 600; }
  .alert-detail { margin-top: 2px; font-size: var(--norm-fs-sm); overflow-wrap: anywhere; }

  .back { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; border: none; background: none;
          font: inherit; font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); cursor: pointer; }
  .back:hover { color: var(--norm-text); }

  /* Icon-only buttons: 32px target, 40px on touch. */
  .ibtn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 32px; height: 32px;
          padding: 0; border: none; border-radius: var(--norm-radius); background: transparent; color: var(--norm-icon); cursor: pointer; }
  .ibtn:hover { background: var(--norm-surface-alt); color: var(--norm-text); }
  .ibtn.danger:hover { background: var(--norm-error-bg); color: var(--norm-error); }
  .ibtn:disabled { opacity: .35; cursor: default; background: transparent; }
  .ibtn-gap { display: inline-block; flex: 0 0 auto; width: 32px; height: 32px; }
  @media (pointer: coarse) { .ibtn, .ibtn-gap { width: 40px; height: 40px; } }

  /* Cards: white on the cream page. */
  .card { margin-top: 12px; overflow: hidden; background: var(--norm-bg); border: 1px solid var(--norm-line); border-radius: var(--norm-radius-lg); }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 16px; }
  .card-title { margin: 0; font-size: var(--norm-fs-md); font-weight: 600; }
  .card-body { padding: 0 16px 16px; }
  .card-body.top { padding-top: 16px; }
  .card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--norm-line-soft); }
  .card-note { padding: 10px 16px 14px; }
  .card > .n-table th:first-child, .card > .n-table td:first-child { padding-left: 16px; }
  .card > .n-table th:last-child, .card > .n-table td:last-child { padding-right: 16px; }
  .card > .n-table tr:last-child > td { border-bottom: none; }
  .view-title { margin: 0; font-size: var(--norm-fs-lg); font-weight: 600; line-height: 1.3; }
  .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Lists (openings, talent pool): a table on the page; cards on a phone. */
  .list .lead { min-width: 180px; overflow-wrap: anywhere; }
  .list .open { cursor: pointer; }
  @media (hover: hover) { .list .open:hover .name { text-decoration: underline; text-underline-offset: 2px; } }
  .list .m-only { display: none; }
  .list .status { white-space: nowrap; }
  .list .status .n-badge + .n-badge { margin-left: 4px; }
  .list .note { color: var(--norm-text-soft); }
  .list th.tools, .list td.tools { width: 1%; text-align: right; white-space: nowrap; }
  .jobs th.num { width: 96px; }
  @media (max-width: 640px) {
    .list thead { display: none; }
    .list, .list tbody, .list td { display: block; }
    .list tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; margin-bottom: 8px;
               padding: 12px 16px; background: var(--norm-bg); border: 1px solid var(--norm-line); border-radius: var(--norm-radius-lg); }
    .list td { padding: 0; border: none; }
    .list tbody tr:hover > td { background: none; }
    .list td.num, .list td.note { display: none; }
    .list .m-only { display: block; }
    .list .lead { min-width: 0; }
    .list td.tools { width: auto; }
    .jobs td.tools { grid-column: 1 / -1; margin-top: 6px; }
    .pool td.tools { align-self: center; }
  }

  /* Forms: sentence-case labels above Norm fields. */
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; max-width: 760px; }
  .fld { min-width: 0; }
  .fld.wide { grid-column: 1 / -1; }
  .fld .n-input, .fld .n-select { width: 100%; }
  .fld .n-input.narrow, .ctl .n-input.narrow { width: 104px; }
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl .n-select { width: auto; }
  .fld .hint { margin-top: 4px; }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--norm-text); cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--norm-accent); }
  .check .hint { font-size: var(--norm-fs-sm); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack > .check { align-self: flex-start; }
  .saved { font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-ok); }
  .stages th:first-child { width: 320px; }
  .stages .n-input { width: 100%; max-width: 280px; }
  .tools .btns { gap: 2px; }
  .fields .badges .n-badge + .n-badge { margin-left: 4px; }
  @media (max-width: 640px) {
    .form { grid-template-columns: minmax(0, 1fr); }
    .ctl .n-select { flex: 1 1 100%; }
    .ctl .n-input.narrow { flex: 1 1 0; width: auto; min-width: 0; }
    .card > .n-table.stages thead, .card > .n-table.fields thead { display: none; }
    .card > .n-table.stages, .card > .n-table.fields, .stages tbody, .fields tbody { display: block; }
    .stages tr, .fields tr { display: grid; align-items: center; gap: 6px 10px; padding: 10px 16px; border-bottom: 1px solid var(--norm-line); }
    .stages tr:last-child, .fields tr:last-child { border-bottom: none; }
    .card > .n-table.stages td, .card > .n-table.fields td { display: block; padding: 0; border: none; }
    .stages tbody tr:hover > td, .fields tbody tr:hover > td { background: none; }
    .stages tr { grid-template-columns: minmax(0, 1fr) auto; }
    .stages td:first-child { grid-column: 1 / -1; }
    .stages .n-input { max-width: none; }
    .fields tr { grid-template-columns: auto minmax(0, 1fr) auto; }
    .fields td:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
    .fields td:nth-child(2) { grid-column: 1; grid-row: 2; }
    .fields td:nth-child(3) { grid-column: 2; grid-row: 2; }
    .fields td:nth-child(4) { grid-column: 3; grid-row: 1 / 3; }
  }

  /* Pipeline board: one column per stage on the warm fill, white cards in it. */
  .jobhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px; }
  .jobhead .grow { min-width: 200px; }
  .board-hint { margin: 12px 0; }
  .board { display: flex; gap: 12px; overflow-x: auto; margin: 0 calc(-1 * var(--norm-gutter)); padding: 0 var(--norm-gutter) 8px;
           scrollbar-width: thin; scrollbar-color: var(--norm-line-strong) transparent; }
  .col { display: flex; flex-direction: column; flex: 0 0 240px; min-width: 240px; padding: 10px 8px 8px;
         background: var(--norm-surface-alt); border-radius: var(--norm-radius-lg); }
  .colhead { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 4px 8px; font-size: var(--norm-fs-xs); font-weight: 600; color: var(--norm-text-soft); }
  .colhead .colname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .colhead .count { margin-left: auto; font-weight: 500; color: var(--norm-muted); font-variant-numeric: tabular-nums; }
  .drop { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 64px; border-radius: var(--norm-radius); }
  .drop.over { background: var(--norm-accent-soft); outline: 2px dashed var(--norm-brand-soft); outline-offset: -2px; }
  .col-empty { padding: 14px 8px; border: 1px dashed var(--norm-line-strong); border-radius: var(--norm-radius);
               text-align: center; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .cand { padding: 10px 12px; background: var(--norm-bg); border: 1px solid var(--norm-line); border-radius: var(--norm-radius); cursor: grab; }
  .cand:hover { border-color: var(--norm-line-strong); }
  .cand:active { cursor: grabbing; }
  .cand-top { display: flex; align-items: center; gap: 8px; }
  .cand .who { flex: 1; min-width: 0; font-size: var(--norm-fs-base); font-weight: 600; overflow-wrap: anywhere; }
  .cand .meta { margin-top: 2px; }
  .cand .n-badge { margin-top: 6px; }

  /* Ratings: tan line stars, filled up to the rating. */
  .stars { display: inline-flex; align-items: center; gap: 2px; }
  .star { color: var(--norm-brand-soft); fill: none; }
  .star.on { color: var(--norm-accent); fill: var(--norm-brand-soft); }
  .star-btn { display: inline-flex; padding: 3px; border: none; border-radius: var(--norm-radius-sm); background: none; cursor: pointer; }
  .star-btn:hover { background: var(--norm-surface-alt); }
  @media (pointer: coarse) { .star-btn { padding: 6px; } }
  .stars-mini { flex: 0 0 auto; display: inline-flex; gap: 1px; }

  /* Candidate */
  .cand-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .rating-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .grp { display: inline-flex; align-items: center; gap: 8px; }
  .actions .n-select { max-width: 220px; }
  .kv { display: flex; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--norm-line-soft); }
  .kv:last-child { border-bottom: none; }
  .kv b { flex: 0 0 180px; font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); }
  .kv span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .feed { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--norm-line-soft); }
  .feed:last-child { border-bottom: none; }
  .feed > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .feed .meta { flex: 0 0 auto; }
  .note-box { margin-top: 12px; }
  .note-box textarea { width: 100%; }
  .note-box .n-btn { margin-top: 8px; }
  @media (max-width: 640px) {
    .kv { flex-direction: column; gap: 2px; }
    .kv b { flex: none; }
    .feed { flex-wrap: wrap; gap: 2px 12px; }
  }

  /* Modals: a white panel over a dimmed page, buttons on the right. A dialog
     taller than its frame (a conversation's split pane) scrolls, and its
     buttons stay in reach at the foot of the view. */
  .modal { --pad-b: 48px; position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
           padding: 48px 16px var(--pad-b); overflow-y: auto; background: rgba(26, 26, 26, .35); }
  .modal .panel { width: 100%; max-width: 520px; padding: 20px 24px; overflow: clip; background: var(--norm-bg);
                  border-radius: var(--norm-radius-lg); box-shadow: 0 12px 40px rgba(26, 26, 26, .18); }
  .modal-title { margin: 0 0 16px; font-size: var(--norm-fs-lg); font-weight: 600; overflow-wrap: anywhere; }
  .modal-foot { position: sticky; bottom: calc(-1 * var(--pad-b)); display: flex; justify-content: flex-end; gap: 8px;
                margin: 8px -24px -20px; padding: 12px 24px 20px; background: var(--norm-bg); }
  .modal.scrolls .modal-foot { box-shadow: 0 -1px 0 var(--norm-line); }
  .modal textarea { width: 100%; }
  @media (max-height: 600px) { .modal { --pad-b: 16px; padding-top: 16px; } }
  @media (max-width: 640px) {
    .modal { --pad-b: 16px; padding: 16px 16px var(--pad-b); }
    .modal .panel { padding: 18px 16px; }
    .modal-foot { margin: 8px -16px -18px; padding: 12px 16px 18px; }
  }
  .modal .panel.wide { max-width: 760px; }
  .modal-sub { margin: -10px 0 14px; font-size: var(--norm-fs-sm); color: var(--norm-muted); }

  /* While Orbit is the live system: one quiet line, never in the way. */
  .banner { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0 0; padding: 8px 12px; border-radius: var(--norm-radius);
            background: var(--norm-surface-alt); font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }
  .banner svg { flex: 0 0 auto; margin-top: 2px; color: var(--norm-icon); }
  .banner:empty { display: none; }

  /* What just happened (a send, an invite) — stays until the next screen. */
  .notice { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; padding: 10px 12px; border-radius: var(--norm-radius);
            font-size: var(--norm-fs-sm); background: var(--norm-ok-bg); color: var(--norm-text); }
  .notice.warn { background: var(--norm-warn-bg); }
  .notice > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .notice .ibtn { width: 24px; height: 24px; margin: -2px -4px -2px 0; }

  /* Filters above a list. */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .n-select { width: auto; max-width: 260px; }
  .toolbar .n-input.search { flex: 1 1 200px; min-width: 160px; }
  .toolbar .n-input[type="date"] { width: auto; }
  .count-line { margin: -4px 0 8px; font-size: var(--norm-fs-xs); color: var(--norm-muted); }

  /* The selection bar: what to do with the ticked candidates. */
  .selbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; padding: 8px 12px;
            border-radius: var(--norm-radius); background: var(--norm-accent-soft); }
  .selbar .lead-count { font-weight: 600; margin-right: 4px; }
  .selbar .n-select { width: auto; max-width: 200px; }
  .list th.sel, .list td.sel { width: 1%; padding-right: 0; }
  .list td.sel input, .list th.sel input { width: 16px; height: 16px; margin: 0; accent-color: var(--norm-accent); }
  .list tr.picked > td { background: var(--norm-accent-soft); }
  @media (max-width: 640px) {
    .cands tr { grid-template-columns: auto minmax(0, 1fr) auto; }
    .cands td.sel { grid-row: 1 / 3; align-self: center; }
    .cands td.stage-col { display: block; grid-column: 2 / 4; }
  }

  /* Chips + a searchable list: the interviewer picker and selected candidates. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px;
          background: var(--norm-surface-alt); font-size: var(--norm-fs-sm); }
  .chip button { display: inline-flex; padding: 2px; border: none; border-radius: 999px; background: none; color: var(--norm-icon); cursor: pointer; }
  .chip button:hover { background: var(--norm-line); color: var(--norm-text); }
  .picker { position: relative; display: flex; flex-direction: column; gap: 8px; }
  .picker .n-input { width: 100%; }
  .picker-list { position: absolute; z-index: 5; top: 100%; left: 0; right: 0; margin-top: 4px; max-height: 220px; overflow-y: auto;
                 background: var(--norm-bg); border: 1px solid var(--norm-line-strong); border-radius: var(--norm-radius); box-shadow: 0 6px 20px rgba(26,26,26,.12); }
  .picker-list button { display: block; width: 100%; padding: 8px 12px; border: none; background: none; text-align: left; font: inherit; cursor: pointer; }
  .picker-list button:hover, .picker-list button.on { background: var(--norm-surface-alt); }
  .picker-list .none { padding: 8px 12px; }

  /* Previous / next through the list a candidate was opened from. */
  .navrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .navrow .grow { min-width: 0; }
  .pos { font-size: var(--norm-fs-sm); color: var(--norm-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Interviews */
  .ivs .toggle { width: 28px; height: 28px; }
  .ivs tr.member > td { background: var(--norm-surface-alt); }
  .ivs tr.member td.lead { padding-left: 44px; }
  .ivs .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .feed .acts { flex: 0 0 auto; display: inline-flex; gap: 4px; }
  @media (max-width: 640px) {
    .ivs tr.member td.lead { padding-left: 0; }
    .ivs td.when { grid-column: 1 / -1; }
  }

  /* The email composer: a small rich-text area and the first recipient's copy. */
  .editor { min-height: 160px; max-height: 360px; overflow-y: auto; padding: 8px 10px; border: 1px solid var(--norm-field, var(--norm-line-strong));
            border-radius: var(--norm-radius); background: var(--norm-bg); line-height: 1.5; }
  .editor:focus { outline: 2px solid var(--norm-focus); outline-offset: 1px; }
  .editor p { margin: 0 0 8px; }
  .preview { padding: 12px 14px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); background: var(--norm-surface-alt); }
  .preview .subj { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--norm-line); font-weight: 600; }
  .preview p { margin: 0 0 8px; }
  .replace { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--norm-radius); background: var(--norm-warn-bg); font-size: var(--norm-fs-sm); }
  .replace > span { flex: 1 1 220px; }
  .warn-line { font-size: var(--norm-fs-sm); color: var(--norm-warn); }
  .mail-frame { width: 100%; height: 420px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); background: #fff; }
</style>

<div class="wrap">
  <div class="head"><h1>Hiring</h1><div class="scope" id="scope">—</div></div>
  <div class="banner" id="banner" role="note"></div>
  <div class="bar">
    <div class="n-tabs" role="tablist" aria-label="Hiring">
      <button type="button" class="n-tab tab" role="tab" data-view="jobs" aria-selected="true">Openings</button>
      <button type="button" class="n-tab tab" role="tab" data-view="cands" aria-selected="false">Candidates</button>
      <button type="button" class="n-tab tab" role="tab" data-view="ivs" aria-selected="false">Interviews</button>
      <button type="button" class="n-tab tab" role="tab" data-view="pool" aria-selected="false">Talent pool</button>
      <button type="button" class="n-tab tab" role="tab" data-view="settings" aria-selected="false">Settings</button>
    </div>
    <button type="button" class="n-btn n-btn--primary" id="newjob"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New job</button>
  </div>
  <div id="body-wrap"><div id="notice" aria-live="polite"></div><div id="body"><div class="state" role="status">Loading…</div></div></div>
</div>
<div id="modal"></div>

<script>
(function () {
  var ctx = null, view = 'jobs';
  var body = document.getElementById('body');
  var modalHost = document.getElementById('modal');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  // Descriptions are stored as HTML but edited as plain text — convert both
  // ways so a manager types prose, not markup.
  function htmlToText(html) {
    if (!html) return '';
    return String(html)
      .replace(/<\/(p|div|h[1-6]|li)>/gi, '\n')
      .replace(/<br\s*\/?>(?=.)/gi, '\n')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
      .replace(/\n{3,}/g, '\n\n').trim();
  }
  function textToHtml(text) {
    text = String(text == null ? '' : text).trim();
    if (!text) return null;
    return text.split(/\n{2,}/).map(function (para) {

            fld('j-paytype', 'Pay', '<div class="ctl"><select class="n-select" id="j-paytype">' +
              ['', 'hourly', 'salary'].map(function (t) { return '<option value="' + t + '"' + (j.pay_type === t ? ' selected' : '') + '>' + (t ? cap(t) : 'Not shown') + '</option>'; }).join('') + '</select>' +
              '<input type="number" class="n-input narrow" id="j-paymin" placeholder="Min" aria-label="Minimum pay" value="' + esc(j.pay_min == null ? '' : j.pay_min) + '">' +
              '<span class="hint">to</span><input type="number" class="n-input narrow" id="j-paymax" placeholder="Max" aria-label="Maximum pay" value="' + esc(j.pay_max == null ? '' : j.pay_max) + '"></div>', 'wide') +
            fld('j-desc', 'Description', '<textarea class="n-input" id="j-desc" rows="4" placeholder="What the role is about">' + esc(htmlToText(j.description_html)) + '</textarea>', 'wide') +
            fld('j-req', 'Requirements', '<textarea class="n-input" id="j-req" rows="4" placeholder="What you are looking for">' + esc(htmlToText(j.requirements_html)) + '</textarea>', 'wide') +
          '</div></div>' +
          '<div class="card-foot">' + btn('Save', 'primary', 'id="j-save"') + '<span class="saved" id="j-saved" role="status"></span></div>' +
        '</section>' +
        '<section class="card"><div class="card-head"><h2 class="card-title grow">Pipeline stages</h2>' + btn('Add stage', 'secondary', 'id="addstage"', { sm: true, icon: 'plus' }) + '</div>' +
          '<table class="n-table stages"><thead><tr><th scope="col">Stage</th><th scope="col">Type</th><th scope="col" class="tools"><span class="sr">Actions</span></th></tr></thead>' +
          '<tbody>' + stageRows + '</tbody></table>' +
          '<div class="card-note hint">The type drives status — a candidate on a “hired” stage is hired, whatever the stage is named.</div></section>' +
        '<section class="card"><div class="card-head"><h2 class="card-title grow">Application form</h2>' + btn('Add field', 'secondary', 'id="addfield"', { sm: true, icon: 'plus' }) + '</div>' +
          '<table class="n-table fields"><thead><tr><th scope="col">Field</th><th scope="col">Type</th><th scope="col"><span class="sr">Rules</span></th><th scope="col" class="tools"><span class="sr">Actions</span></th></tr></thead>' +
          '<tbody>' + fieldRows + '</tbody></table></section>';

      var reload = function () { showJobEditor(jobId); };
      document.getElementById('back').addEventListener('click', showJobs);
      document.getElementById('j-save').addEventListener('click', function () {
        var pmin = document.getElementById('j-paymin').value, pmax = document.getElementById('j-paymax').value;
        run('update_job', { job_id: jobId, fields: {
          title: document.getElementById('j-title').value, department: document.getElementById('j-dept').value || null,
          employment_type: document.getElementById('j-emp').value, positions_to_fill: Number(document.getElementById('j-pos').value) || 1,
          pay_type: document.getElementById('j-paytype').value || null,
          pay_min: pmin === '' ? null : Number(pmin), pay_max: pmax === '' ? null : Number(pmax),
          description_html: textToHtml(document.getElementById('j-desc').value),
          requirements_html: textToHtml(document.getElementById('j-req').value),
        }}).then(function () { var el = document.getElementById('j-saved'); el.textContent = 'Saved'; setTimeout(function () { el.textContent = ''; }, 1500); }).catch(fail);
      });
      function status(fields) { run('set_job_status', Object.assign({ job_id: jobId }, fields)).then(reload).catch(fail); }
      var pub = document.getElementById('j-pub'); if (pub) pub.addEventListener('click', function () { status({ is_published: true }); });
      var unpub = document.getElementById('j-unpub'); if (unpub) unpub.addEventListener('click', function () { status({ is_published: false }); });
      var close = document.getElementById('j-close'); if (close) close.addEventListener('click', function () { status({ status: 'closed' }); });
      // Reopen: approved but unpublished, so it doesn't reappear on the
      // careers page until someone publishes it again (Orbit's rule).
      var reopen = document.getElementById('j-reopen'); if (reopen) reopen.addEventListener('click', function () {
        run('reopen_job', { job_id: jobId }).then(function () { reload(); notice('Reopened — publish it when you’re ready to take applications.'); }).catch(fail);
      });
      document.getElementById('j-dup').addEventListener('click', function () {
        run('duplicate_job', { job_id: jobId }).then(function (r) {
          showJobEditor(r.job.id);
          notice('Copied “' + (j.title || 'job') + '” — its pipeline, application form and hiring team came with it. The copy is a draft.');
        }).catch(fail);
      });
      document.getElementById('addstage').addEventListener('click', function () { run('add_stage', { job_id: jobId }).then(reload).catch(fail); });
      document.getElementById('addfield').addEventListener('click', function () { addFieldModal(jobId, reload); });

      body.querySelectorAll('[data-sname]').forEach(function (el) { el.addEventListener('change', function () { run('update_stage', { stage_id: el.getAttribute('data-sname'), fields: { name: el.value } }).catch(fail); }); });
      body.querySelectorAll('[data-stype]').forEach(function (el) { el.addEventListener('change', function () { run('update_stage', { stage_id: el.getAttribute('data-stype'), fields: { stage_type: el.value } }).then(reload).catch(fail); }); });
      bind('[data-sdel]', function (el) { run('delete_stage', { stage_id: el.getAttribute('data-sdel') }).then(reload).catch(fail); });
      bind('[data-fdel]', function (el) { run('delete_field', { field_id: el.getAttribute('data-fdel') }).then(reload).catch(fail); });
      bind('[data-fedit]', function (el) { editFieldModal(fieldsById[el.getAttribute('data-fedit')], reload); });
      var stageIds = (d.stages || []).map(function (s) { return s.id; });
      function moveStage(id, up) { var o = stageIds.slice(), i = o.indexOf(id); if (i < 0) return; var j = up ? i - 1 : i + 1; if (j < 0 || j >= o.length) return; var t = o[i]; o[i] = o[j]; o[j] = t; run('reorder_stages', { ids: o }).then(reload).catch(fail); }
      bind('[data-sup]', function (el) { moveStage(el.getAttribute('data-sup'), true); });
      bind('[data-sdn]', function (el) { moveStage(el.getAttribute('data-sdn'), false); });
    }).catch(fail);
  }

  var FIELD_TYPES = ['text', 'textarea', 'email', 'phone', 'select', 'file'];
  function csv(id) { return document.getElementById(id).value.split(',').map(function (x) { return x.trim(); }).filter(Boolean); }

  function addFieldModal(jobId, reload) {
    modal('<h2 class="modal-title">Add application field</h2>' +
      '<div class="stack">' +
        fld('af-label', 'Label', '<input type="text" class="n-input" id="af-label">') +
        fld('af-key', 'Key', '<input type="text" class="n-input" id="af-key" placeholder="lowercase_no_spaces">') +
        fld('af-type', 'Type', '<select class="n-select" id="af-type">' +
          FIELD_TYPES.map(function (t) { return '<option value="' + t + '">' + cap(t) + '</option>'; }).join('') + '</select>') +
        fld('af-opts', 'Options', '<input type="text" class="n-input" id="af-opts" placeholder="Comma-separated (for select)">') +
        check('af-req', 'Required', false) +
        check('af-ko', 'Knockout', false, 'auto-reject on a value below') +
        fld('af-kov', 'Knockout values', '<input type="text" class="n-input" id="af-kov" placeholder="Comma-separated, e.g. No">') +
      '</div>' +
      modalFoot('af-cancel', 'af-add', 'Add'));
    document.getElementById('af-cancel').addEventListener('click', closeModal);
    document.getElementById('af-add').addEventListener('click', function () {
      var label = document.getElementById('af-label').value;
      if (!label.trim()) return;
      var key = document.getElementById('af-key').value.trim() || label.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      run('add_field', { job_id: jobId, label: label, field_key: key,
        field_type: document.getElementById('af-type').value, is_required: document.getElementById('af-req').checked,
        options: csv('af-opts'), knockout_enabled: document.getElementById('af-ko').checked, knockout_values: csv('af-kov') })
        .then(function () { closeModal(); reload(); }).catch(fail);
    });
  }

  function editFieldModal(f, reload) {
    if (!f) return;
    modal('<h2 class="modal-title">Edit field — ' + esc(f.label) + '</h2>' +
      '<div class="stack">' +
        fld('ef-label', 'Label', '<input type="text" class="n-input" id="ef-label" value="' + esc(f.label || '') + '">') +
        fld('ef-type', 'Type', '<select class="n-select" id="ef-type">' +
          FIELD_TYPES.map(function (t) { return '<option value="' + t + '"' + (f.field_type === t ? ' selected' : '') + '>' + cap(t) + '</option>'; }).join('') + '</select>') +
        fld('ef-opts', 'Options', '<input type="text" class="n-input" id="ef-opts" placeholder="Comma-separated (for select)" value="' + esc((f.options || []).join(', ')) + '">') +
        check('ef-req', 'Required', f.is_required) +
        check('ef-en', 'Enabled', f.is_enabled !== false) +
        check('ef-ko', 'Knockout', f.knockout_enabled, 'auto-reject on a value below') +
        fld('ef-kov', 'Knockout values', '<input type="text" class="n-input" id="ef-kov" placeholder="Comma-separated, e.g. No" value="' + esc((f.knockout_values || []).join(', ')) + '">') +
      '</div>' +
      modalFoot('ef-cancel', 'ef-save', 'Save'));
    document.getElementById('ef-cancel').addEventListener('click', closeModal);
    document.getElementById('ef-save').addEventListener('click', function () {
      run('update_field', { field_id: f.id, fields: {
        label: document.getElementById('ef-label').value,
        field_type: document.getElementById('ef-type').value,
        is_required: document.getElementById('ef-req').checked,
        is_enabled: document.getElementById('ef-en').checked,
        options: csv('ef-opts'),
        knockout_enabled: document.getElementById('ef-ko').checked,
        knockout_values: csv('ef-kov'),
      }}).then(function () { closeModal(); reload(); }).catch(fail);
    });
  }

  // ---- Pipeline ----------------------------------------------------------
  function showPipeline(jobId) {
    newJobLeads(false);
    loading();
    run('pipeline', { job_id: jobId }).then(function (d) {
      var stages = d.stages || [];
      var cols = stages.map(function (s) {
        var st = s.stage_type;
        var cards = (s.applications || []).map(function (a) {
          var rating = '';
          if (a.rating) {
            for (var i = 0; i < a.rating; i++) rating += starIcon(true, 12);
            rating = '<span class="stars-mini" role="img" aria-label="Rated ' + esc(a.rating) + ' of 5">' + rating + '</span>';
          }
          return '<div class="cand" draggable="true" data-app="' + esc(a.id) + '">' +
            '<div class="cand-top"><span class="who">' + esc(a.candidate_name) + '</span>' + rating + '</div>' +
            '<div class="meta">' + esc(joinMeta([cap(a.source || 'manual'), a.applied_at ? agoLabel(a.applied_at) : ''])) + '</div>' +
            (a.knockout_flag ? badge('Knockout', 'warn') : '') + '</div>';
        }).join('');
        // A hired/rejected stage carries its type; say so unless its name already does.
        var typed = st && st !== 'active' && String(s.name || '').trim().toLowerCase() !== st;
        return '<div class="col"><div class="colhead"><span class="colname">' + esc(s.name) + '</span>' +
            (typed ? badge(cap(st), st === 'hired' ? 'ok' : 'error') : '') +
            '<span class="count">' + (s.applications || []).length + '</span></div>' +
          '<div class="drop" data-stage="' + esc(s.id) + '">' + (cards || '<div class="col-empty">No candidates</div>') + '</div></div>';
      }).join('');
      var jobMeta = joinMeta([d.job.department || '', d.job.positions_to_fill ? d.job.positions_filled + '/' + d.job.positions_to_fill + ' filled' : '']);
      body.innerHTML = backLink('back', 'All openings') +
        '<section class="card"><div class="jobhead"><div class="grow"><h2 class="view-title">' + esc(d.job.title) + '</h2>' +
          (jobMeta ? '<div class="meta">' + esc(jobMeta) + '</div>' : '') + '</div>' +
          '<div class="btns">' + btn('List view', 'quiet', 'id="listjob"', { sm: true }) + btn('Edit job', 'secondary', 'id="editjob"', { sm: true }) +
            btn('Add candidate', 'primary', 'id="addcand"', { sm: true, icon: 'plus' }) + '</div></div></section>' +
        '<div class="hint board-hint">Drag a card between columns to move someone, or click it to open. The stage type (hired or rejected) drives their status. To act on several at once, use the list view.</div>' +
        '<div class="board">' + cols + '</div>';
      document.getElementById('back').addEventListener('click', showJobs);
      document.getElementById('editjob').addEventListener('click', function () { showJobEditor(jobId); });
      document.getElementById('listjob').addEventListener('click', function () { selectTab('cands'); showCandidates(jobId); });
      document.getElementById('addcand').addEventListener('click', function () { addCandidateModal(jobId); });
      // Previous / next walk the board in its own order: stage by stage.
      var order = [];
      stages.forEach(function (s) { (s.applications || []).forEach(function (a) { order.push(a.id); }); });
      bind('[data-app]', function (el) { showCandidate(el.getAttribute('data-app'), jobId, { ids: order }); });

      // Drag a candidate card onto a stage's drop zone to move them.
      var dragId = null;
      body.querySelectorAll('.cand[draggable]').forEach(function (el) {
        el.addEventListener('dragstart', function (ev) { dragId = el.getAttribute('data-app'); if (ev.dataTransfer) ev.dataTransfer.effectAllowed = 'move'; el.style.opacity = '.4'; });
        el.addEventListener('dragend', function () { el.style.opacity = ''; });
      });
      body.querySelectorAll('.drop').forEach(function (zone) {
        zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
        zone.addEventListener('drop', function (ev) {
          ev.preventDefault(); zone.classList.remove('over');
          var stageId = zone.getAttribute('data-stage');
          if (dragId) run('move', { application_id: dragId, stage_id: stageId }).then(function () { showPipeline(jobId); }).catch(fail);
        });
      });
    }).catch(fail);
  }

  function addCandidateModal(jobId) {
    modal('<h2 class="modal-title">Add a candidate</h2>' +
      '<div class="stack">' +
        '<div class="form">' +
          fld('ac-first', 'First name', '<input type="text" class="n-input" id="ac-first">') +
          fld('ac-last', 'Last name', '<input type="text" class="n-input" id="ac-last">') +
        '</div>' +
        fld('ac-email', 'Email', '<input type="email" class="n-input" id="ac-email">') +
        fld('ac-phone', 'Phone', '<input type="text" class="n-input" id="ac-phone">') +
        fld('ac-source', 'Source', '<select class="n-select" id="ac-source">' +
          ['manual', 'referral', 'seek', 'walk_in'].map(function (t) { return '<option value="' + t + '">' + cap(t) + '</option>'; }).join('') + '</select>') +
      '</div>' +
      modalFoot('ac-cancel', 'ac-add', 'Add to pipeline'));
    document.getElementById('ac-cancel').addEventListener('click', closeModal);
    document.getElementById('ac-add').addEventListener('click', function () {
      run('add_candidate', { job_id: jobId, venue_id: ctx && ctx.venueId,
        first_name: document.getElementById('ac-first').value, last_name: document.getElementById('ac-last').value,
        email: document.getElementById('ac-email').value, phone: document.getElementById('ac-phone').value,
        source: document.getElementById('ac-source').value })
        .then(function () { closeModal(); showPipeline(jobId); }).catch(fail);
    });
  }

  // ---- Candidate ---------------------------------------------------------
  // `nav` = { ids: [...] } — the list this candidate was opened from, in its
  // order, for previous / next; `nav.back` returns to it.
  function showCandidate(applicationId, jobId, nav) {
    nav = nav || {};
    newJobLeads(false);
    loading();
    run('candidate', { application_id: applicationId }).then(function (d) {
      var a = d.application, c = d.candidate;
      jobId = jobId || a.job_id;
      var ids = nav.ids || [], at = ids.indexOf(applicationId);
      var options = (d.stages || []).map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === a.stage_id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
      var answers = (d.answers || []).map(function (x) { return '<div class="kv"><b>' + esc(x.label || x.field_key) + '</b><span>' + esc(x.value) + '</span></div>'; }).join('') || '<div class="none">No application answers.</div>';
      var notes = (d.notes || []).map(function (n) { return '<div class="feed"><span>' + esc(n.body) + '</span>' + (n.author ? '<span class="meta">' + esc(n.author) + '</span>' : '') + '</div>'; }).join('') || '<div class="none">No notes yet.</div>';
      var feed = (d.activity || []).map(function (x) { return '<div class="feed"><span>' + esc(x.summary) + '</span><span class="meta">' + esc(joinMeta([x.actor && x.actor !== 'Orbit' ? x.actor : '', (x.at || '').slice(0, 16).replace('T', ' ')])) + '</span></div>'; }).join('') || '<div class="none">Nothing yet.</div>';
      var interviews = (d.interviews || []).map(function (iv) {
        var live = iv.status !== 'cancelled';
        return '<div class="feed"><span>' + (iv.group_id ? badge(iv.group_title || 'Group interview', 'info') + ' ' : '') +
          esc(typeLabel(iv.interview_type)) + ' · ' + esc(when(iv.scheduled_at)) +
          (iv.duration_minutes ? ' · ' + esc(iv.duration_minutes) + ' min' : '') +
          (iv.location ? ' · ' + esc(iv.location) : '') +
          (iv.meeting_url ? ' · <a class="link" href="' + esc(iv.meeting_url) + '" target="_blank" rel="noopener noreferrer">Meeting link</a>' : '') +
          ((iv.interviewer_names || []).length ? '<br><span class="meta">With ' + esc(iv.interviewer_names.join(', ')) + '</span>' : '') +
          (iv.google_event_id && live ? ' <span class="meta">· invite sent</span>' : '') + '</span>' +
          (live ? '' : badge('Cancelled', 'error')) +
          (live ? '<span class="acts">' + (iv.group_id ? '' : btn('Edit', 'quiet', 'data-ivedit="' + esc(iv.id) + '"', { sm: true })) +
            btn(iv.group_id ? 'Leave group' : 'Cancel', 'quiet', 'data-ivcancel="' + esc(iv.id) + '"', { sm: true }) + '</span>' : '') + '</div>';
      }).join('') || '<div class="none">No interviews.</div>';
      var emails = (d.emails || []).map(function (e) {
        return '<div class="feed"><span>' + esc(e.subject || '(no subject)') + '</span><span class="meta">' + esc(joinMeta([cap(e.status || ''), (e.created_at || '').slice(0, 16).replace('T', ' ')])) + '</span></div>';
      }).join('') || '<div class="none">No emails yet.</div>';
      var stars = ''; for (var i = 1; i <= 5; i++) stars += '<button type="button" class="star-btn" data-star="' + i + '" aria-label="Rate ' + i + ' of 5" title="Rate ' + i + ' of 5">' + starIcon(a.rating >= i, 18) + '</button>';
      var section = function (title, inner) { return '<section class="card"><div class="card-head"><h2 class="card-title">' + title + '</h2></div><div class="card-body">' + inner + '</div></section>'; };
      var navBar = ids.length > 1 && at >= 0 ?
        '<span class="btns">' + iconBtn('left', 'Previous candidate', 'id="prevc"' + (at === 0 ? ' disabled' : '')) +
          '<span class="pos">' + (at + 1) + ' of ' + ids.length + '</span>' +
          iconBtn('right', 'Next candidate', 'id="nextc"' + (at === ids.length - 1 ? ' disabled' : '')) + '</span>' : '';

      body.innerHTML = '<div class="navrow"><span class="grow">' + backLink('back', nav.backLabel || 'Pipeline') + '</span>' + navBar + '</div>' +
        '<section class="card">' +
          '<div class="card-body top">' +
            '<div class="cand-head"><div class="grow"><div class="title-row"><h2 class="view-title">' + esc(c.name) + '</h2>' + statusPill(a.status) + '</div>' +
              '<div class="meta">' + esc(joinMeta([d.job && d.job.title || '', c.email || '', c.phone || ''])) + '</div></div>' +
              check('tp', 'Talent pool', c.in_talent_pool) + '</div>' +
            '<div class="rating-row"><span class="lbl">Rating</span><span class="stars" id="stars" role="group" aria-label="Rating">' + stars + '</span></div>' +
          '</div>' +
          '<div class="card-foot actions">' +
            '<span class="grp"><select class="n-select" id="stage" aria-label="Stage">' + options + '</select>' + btn('Move', 'secondary', 'id="move"') + '</span>' +
            btn('Schedule interview', 'secondary', 'id="interview"') +
            btn('Email', 'secondary', 'id="mailone"') +
            (a.status === 'rejected' ? '' : btn('Not progressing', 'danger', 'id="reject"')) +
          '</div>' +
          (a.status === 'hired' ? '' :
            '<div class="card-foot actions"><label class="lbl" for="hire-role">Hire as</label>' +
              '<span class="grp"><select class="n-select" id="hire-role"><option value="team_member">Team member</option><option value="manager">Manager</option><option value="head_office">Head office</option></select>' +
              '<input type="date" class="n-input" id="hire-start" title="Start date" aria-label="Start date"></span>' +
              btn('Hire', 'primary', 'id="hire"') + '</div>') +
          (a.person_id ? '<div class="card-foot"><span class="hint">On the team — Training can enrol them</span></div>' : '') +
        '</section>' +
        section('Application', answers) +
        section('Interviews', interviews) +
        section('Notes', '<div>' + notes + '</div><div class="note-box"><textarea class="n-input" id="note" rows="2" placeholder="Add a note…" aria-label="Add a note"></textarea>' +
          btn('Add note', 'secondary', 'id="addnote"', { sm: true }) + '</div>') +
        section('Emails', emails) +
        section('Activity', feed);

      var reload = function () { showCandidate(applicationId, jobId, nav); };
      var after = function (r) { reload(); report(r); };
      document.getElementById('back').addEventListener('click', function () { if (nav.back) nav.back(); else showPipeline(jobId); });
      var prev = document.getElementById('prevc'); if (prev) prev.addEventListener('click', function () { if (at > 0) showCandidate(ids[at - 1], null, nav); });
      var next = document.getElementById('nextc'); if (next) next.addEventListener('click', function () { if (at < ids.length - 1) showCandidate(ids[at + 1], null, nav); });
      document.getElementById('move').addEventListener('click', function () { run('move', { application_id: applicationId, stage_id: document.getElementById('stage').value }).then(reload).catch(fail); });
      document.getElementById('addnote').addEventListener('click', function () { var b = document.getElementById('note').value; if (b.trim()) run('note', { application_id: applicationId, body: b }).then(reload).catch(fail); });
      document.getElementById('tp').addEventListener('change', function () { run('set_talent_pool', { candidate_id: c.id, in_talent_pool: this.checked }).catch(fail); });
      document.getElementById('interview').addEventListener('click', function () { interviewModal({ applicationId: applicationId, jobId: jobId }, after); });
      document.getElementById('mailone').addEventListener('click', function () { emailModal([applicationId], reload); });
      bind('[data-ivedit]', function (el) { interviewModal({ applicationId: applicationId, jobId: jobId, interviewId: el.getAttribute('data-ivedit') }, after); });
      bind('[data-ivcancel]', function (el) {
        if (!confirm('Cancel this interview? Anyone invited from the venue calendar is told.')) return;
        run('cancel_interview', { interview_id: el.getAttribute('data-ivcancel') }).then(after).catch(fail);
      });
      var rej = document.getElementById('reject'); if (rej) rej.addEventListener('click', function () { rejectModal([applicationId], function () { reload(); }); });
      var hire = document.getElementById('hire'); if (hire) hire.addEventListener('click', function () {
        run('hire', { application_id: applicationId, venue_id: ctx && ctx.venueId,
          role: document.getElementById('hire-role').value, start_date: document.getElementById('hire-start').value || null }).then(reload).catch(fail);
      });
      document.getElementById('stars').querySelectorAll('[data-star]').forEach(function (el) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function () { run('set_rating', { application_id: applicationId, rating: Number(el.getAttribute('data-star')) }).then(reload).catch(fail); });
      });
    }).catch(fail);
  }

  // Not progressing — one candidate or a batch. A reason is required: it is
  // what the activity log says when someone asks why later.
  function rejectModal(applicationIds, done) {
    var many = applicationIds.length > 1;
    modal('<h2 class="modal-title">Not progressing' + (many ? ' — ' + applicationIds.length + ' candidates' : '') + '</h2>' +
      fld('rej-reason', 'Reason', '<textarea class="n-input" id="rej-reason" rows="3" placeholder="Recorded in each candidate’s activity"></textarea>') +
      modalFoot('rej-cancel', 'rej-do', 'Confirm', 'danger'));
    var go = document.getElementById('rej-do'), box = document.getElementById('rej-reason');
    var sync = function () { go.disabled = !box.value.trim(); };

    go.addEventListener('click', function () {
      go.disabled = true;

        closeModal(); done(r);

          fld('iv-inst', 'Notes', '<textarea class="n-input" id="iv-inst" rows="2" placeholder="For the candidate and the panel">' + esc(iv.instructions || '') + '</textarea>') +

  // Group interviews: one event for everyone, each candidate keeping their
  // own interview. mode: 'new' (from selected candidates), 'add' (pick an
  // upcoming group for the job), 'edit' (from the Interviews tab).
  function groupModal(o, done) {
    run('interview_form', { job_id: o.jobId, group_id: o.groupId || null }).then(function (f) {
      var mode = o.mode, picked = o.groupId || '';
      var people = f.people || [];
      // Editing shows who is in the group; new / add show who is being added.
      var list = mode === 'edit' ? (f.members || []).slice() : (o.candidates || []).slice();
      var g = f.group || {};
      var chosen = (g.interviewer_ids || []).slice();
      function draw() {
        var showForm = mode !== 'add' || !!picked;
        var title = mode === 'new' ? 'Schedule group interview' : mode === 'add' ? 'Add to group interview' : 'Edit group interview';
        modal('<h2 class="modal-title">' + title + '</h2>' +

          '<div class="stack">' +
            (mode === 'add' ? fld('gi-pick', 'Group interview', '<select class="n-select" id="gi-pick"><option value="">' +
              ((f.groups || []).length ? 'Choose a group interview…' : 'No upcoming group interviews for this job') + '</option>' +
              (f.groups || []).map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === picked ? ' selected' : '') + '>' + esc(when(x.scheduled_at)) + ' · ' + x.member_count + ' candidate' + (x.member_count === 1 ? '' : 's') + '</option>'; }).join('') + '</select>') : '') +
            (list.length ? '<div class="fld"><span class="n-label">' + (mode === 'edit' ? 'Candidates' : 'Adding') + '</span><div class="chips" id="gi-cands">' +
              list.map(function (c, i) { return '<span class="chip">' + esc(c.name) + (mode === 'edit' ? '' : '<button type="button" data-uncand="' + i + '" aria-label="Don’t add ' + esc(c.name) + '">' + icon('x', 12) + '</button>') + '</span>'; }).join('') + '</div></div>' : '') +
            (showForm ?
              fld('gi-title', 'Title', '<input type="text" class="n-input" id="gi-title" placeholder="Optional — e.g. Saturday bar team group" value="' + esc(g.title || '') + '">') +
              '<div class="form">' +
                fld('gi-type', 'Type', '<select class="n-select" id="gi-type">' + typeOptions(g.interview_type || 'in_person') + '</select>') +
                fld('gi-dur', 'Duration (min)', '<input type="number" class="n-input narrow" id="gi-dur" min="5" value="' + esc(g.duration_minutes || 60) + '">') +
                fld('gi-when', 'When', '<input type="datetime-local" class="n-input" id="gi-when" value="' + esc(localInput(g.scheduled_at)) + '">', 'wide') +
              '</div>' +
              fld('gi-loc', 'Location', '<input type="text" class="n-input" id="gi-loc" placeholder="Venue / room" value="' + esc(g.location || '') + '">') +
              pickerHtml('gi-panel', 'Interviewers') +
              fld('gi-card', 'Scorecard', '<select class="n-select" id="gi-card"><option value="">None</option>' +
                (f.templates || []).map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === g.scorecard_template_id ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '</select>') +
              fld('gi-inst', 'Notes', '<textarea class="n-input" id="gi-inst" rows="2" placeholder="For the candidates and the panel">' + esc(g.instructions || '') + '</textarea>') +
              check('gi-invite', 'Email each candidate an invitation', g.invite_candidate !== false, 'when they join, or the time moves')

        document.getElementById('gi-cancel').addEventListener('click', closeModal);

            notice(who + (r.message || 'Saved'), r.calendar && r.calendar.ok === false ? 'warn' : 'ok');

  // ---- Bulk email --------------------------------------------------------
  // One personalised copy per candidate. The first recipient's copy is the
  // preview; picking a template over an edited email asks first.
  function emailModal(applicationIds, done) {
    run('email_compose', { application_ids: applicationIds }).then(function (d) {
      var templates = d.templates || [], recips = d.recipients || [];
      var withEmail = recips.filter(function (r) { return r.email; });
      var noEmail = recips.length - withEmail.length;
      var tid = '', base = { subject: '', body: '' }, pending = null;
      var batch = uid();
      modal('<h2 class="modal-title">Email ' + recips.length + ' candidate' + (recips.length === 1 ? '' : 's') + '</h2>' +
        (!d.enabled ? '<p class="modal-sub">Email is switched off for Norm Hiring, so a send won’t go anywhere yet — you can still send yourself a test.</p>' : '') +
        '<div class="stack">' +
          (noEmail ? '<div class="warn-line">' + noEmail + ' selected candidate' + (noEmail === 1 ? ' has' : 's have') + ' no email address and will be skipped.</div>' : '') +
          fld('em-tpl', 'Template', '<select class="n-select" id="em-tpl"><option value="">Start from a template (optional)…</option>' +
            templates.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') + '</select>') +
          '<div id="em-replace"></div>' +
          fld('em-subj', 'Subject', '<input type="text" class="n-input" id="em-subj" placeholder="Subject…">') +
          '<div class="fld"><span class="n-label" id="em-body-lbl">Message</span><div class="editor" id="em-body" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="em-body-lbl"></div>' +
            '<div class="hint">Merge fields like {{candidate_first_name}}, {{job_title}}, {{venue_name}} and {{hiring_manager}} are filled in for each candidate.</div></div>' +
          '<div id="em-preview"></div>' +
        '</div>' +
        '<div class="modal-foot">' + btn('Cancel', 'secondary', 'id="em-cancel"') + btn('Send me a test', 'secondary', 'id="em-test"') +
          btn('Send to ' + withEmail.length, 'primary', 'id="em-send"', { icon: 'mail' }) + '</div>', 'wide');
      modalHost.querySelector('.panel').classList.add('wide');
      var subj = document.getElementById('em-subj'), bodyEl = document.getElementById('em-body'), tpl = document.getElementById('em-tpl');
      var sendBtn = document.getElementById('em-send'), testBtn = document.getElementById('em-test');
      function current() { return { subject: subj.value, body: cleanHtml(bodyEl.innerHTML) }; }
      function refresh() {
        var c = current(), first = withEmail[0];
        var ready = c.subject.trim() && bodyEl.textContent.trim();
        sendBtn.disabled = !ready || !withEmail.length;
        testBtn.disabled = !ready || !withEmail.length;
        document.getElementById('em-preview').innerHTML = first && ready ?
          '<div class="fld"><span class="n-label">Preview — ' + esc(first.name) + ' (' + esc(first.email) + ')</span><div class="preview"><div class="subj">' +
            esc(fillMerge(c.subject, first.values, false)) + '</div><div>' + cleanHtml(fillMerge(c.body, first.values, true)) + '</div></div>' +
            (withEmail.length > 1 ? '<div class="hint">Each of the ' + withEmail.length + ' recipients gets their own copy.</div>' : '') + '</div>' : '';
      }
      function apply(id) {
        var t = templates.filter(function (x) { return x.id === id; })[0];
        tid = id;
        if (t) { subj.value = t.subject || ''; bodyEl.innerHTML = cleanHtml(t.body_html || ''); base = current(); }
        tpl.value = id;
        document.getElementById('em-replace').innerHTML = '';
        refresh();
      }
      tpl.addEventListener('change', function () {
        var id = tpl.value;
        if (!id || id === tid) return;
        var c = current();
        var dirty = (c.subject.trim() || bodyEl.textContent.trim()) && (c.subject !== base.subject || c.body !== base.body);
        if (!dirty) { apply(id); return; }
        pending = id; tpl.value = tid;
        var host = document.getElementById('em-replace');
        host.innerHTML = '<div class="replace" role="alert"><span><b>Replace this email?</b> You’ve changed it since it was loaded — the template’s wording would replace your subject and message.</span>' +
          btn('Keep my version', 'secondary', 'id="em-keep"', { sm: true }) + btn('Use template', 'primary', 'id="em-use"', { sm: true }) + '</div>';
        document.getElementById('em-keep').addEventListener('click', function () { pending = null; host.innerHTML = ''; });
        document.getElementById('em-use').addEventListener('click', function () { var p = pending; pending = null; apply(p); });
      });
      subj.addEventListener('input', refresh);
      bodyEl.addEventListener('input', refresh);
      document.getElementById('em-cancel').addEventListener('click', closeModal);
      function send(mode) {
        var c = current();
        sendBtn.disabled = testBtn.disabled = true;
        var extra = { application_ids: applicationIds, subject: c.subject, body_html: c.body, template_id: tid || null, batch_id: batch };
        if (mode) extra._email_mode = mode;
        run('bulk_email', extra).then(function (r) {
          if (mode === 'test') { notice(r.message || 'Test sent'); refresh(); return; }
          closeModal(); if (done) done(r);
          notice(r.message || 'Done', (r.statuses || []).some(function (s) { return s === 'failed' || s === 'disabled'; }) ? 'warn' : 'ok');
        }).catch(function (e) { closeModal(); fail(e); });
      }
      sendBtn.addEventListener('click', function () { send(null); });
      testBtn.addEventListener('click', function () { send('test'); });
      refresh();
    }).catch(fail);
  }

  // ---- Candidates (all, or one job's) --------------------------------------
  // Ticking candidates — or all of the filtered list — opens the bulk actions.
  var picked = {};
  function showCandidates(jobId, keepPicks) {
    newJobLeads(true);
    if (!keepPicks) picked = {};
    loading();
    run('candidates', { job_id: jobId || null }).then(function (d) {
      var rows = d.applications || [], stages = d.stages || [], q = '';
      function filtered() {
        var s = q.trim().toLowerCase();
        return rows.filter(function (a) { return !s || (String(a.candidate_name) + ' ' + String(a.candidate_email || '')).toLowerCase().indexOf(s) >= 0; });
      }
      function chosenIds() { return filtered().filter(function (a) { return picked[a.id]; }).map(function (a) { return a.id; }); }
      function draw() {
        var list = filtered(), sel = chosenIds(), all = list.length > 0 && sel.length === list.length;
        var toolbar = '<div class="toolbar">' +
          '<select class="n-select" id="cf-job" aria-label="Job opening"><option value="">All job openings</option>' +
            (d.jobs || []).map(function (j) { return '<option value="' + esc(j.id) + '"' + (j.id === jobId ? ' selected' : '') + '>' + esc(j.title) + (j.status && j.status !== 'open' ? ' (' + esc(cap(j.status)) + ')' : '') + '</option>'; }).join('') + '</select>' +
          '<input type="search" class="n-input search" id="cf-q" placeholder="Search candidates…" aria-label="Search candidates" value="' + esc(q) + '">' +
          (jobId ? btn('Pipeline', 'quiet', 'id="cf-board"', { sm: true }) : '') + '</div>';
        var bar = sel.length ? '<div class="selbar" role="region" aria-label="Bulk actions"><span class="lead-count">' + sel.length + ' selected</span>' +
          (jobId && stages.length ? '<span class="grp"><select class="n-select" id="b-stage" aria-label="Move to stage"><option value="">Move to stage…</option>' +
            stages.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select></span>' : '') +
          (jobId ? btn('Schedule group interview', 'secondary', 'id="b-group"', { sm: true, icon: 'cal' }) + btn('Add to group interview', 'secondary', 'id="b-addgroup"', { sm: true }) : '') +
          btn('Email', 'secondary', 'id="b-mail"', { sm: true, icon: 'mail' }) +
          btn('Not progressing', 'secondary', 'id="b-reject"', { sm: true }) +
          btn('Add to talent pool', 'secondary', 'id="b-pool"', { sm: true }) +
          btn('Clear', 'quiet', 'id="b-clear"', { sm: true }) +
          (!jobId ? '<span class="hint">Choose a job to move stages or schedule a group interview.</span>' : '') + '</div>' : '';
        var table = list.length ? '<table class="n-table list cands"><thead><tr>' +
            '<th scope="col" class="sel"><input type="checkbox" id="c-all" aria-label="Select all ' + list.length + ' candidates"' + (all ? ' checked' : '') + '></th>' +
            '<th scope="col">Candidate</th>' + (jobId ? '' : '<th scope="col">Role</th>') + '<th scope="col">Stage</th><th scope="col">Rating</th><th scope="col">Source</th><th scope="col">Applied</th>' +
          '</tr></thead><tbody>' + list.map(function (a) {
            var on = !!picked[a.id];
            return '<tr' + (on ? ' class="picked"' : '') + '><td class="sel"><input type="checkbox" data-pick="' + esc(a.id) + '" aria-label="Select ' + esc(a.candidate_name) + '"' + (on ? ' checked' : '') + '></td>' +
              '<td class="lead"><div class="open" data-open="' + esc(a.id) + '"><div class="name">' + esc(a.candidate_name) + (a.knockout_flag ? ' ' + badge('Knockout', 'warn') : '') + '</div>' +
                '<div class="meta">' + esc(a.candidate_email || 'No email') + '</div>' +
                (jobId ? '' : '<div class="meta m-only">' + esc(a.job_title || '') + '</div>') + '</div></td>' +
              (jobId ? '' : '<td class="note">' + esc(a.job_title || '—') + '</td>') +
              '<td class="note stage-col">' + (a.status === 'active' ? esc(a.stage_name || '—') : statusPill(a.status)) + '</td>' +
              '<td class="num">' + (a.rating ? esc(a.rating) + '/5' : '—') + '</td>' +
              '<td class="note">' + esc(cap(a.source || 'manual')) + '</td>' +
              '<td class="note">' + esc(a.applied_at ? agoLabel(a.applied_at) : '') + '</td></tr>';
          }).join('') + '</tbody></table>'
          : state('empty', rows.length ? 'Nobody matches that search' : 'No candidates yet', rows.length ? '' : 'Candidates appear here as they apply or are added to a job.');
        body.innerHTML = toolbar + bar + (list.length ? '<div class="count-line">' + list.length + ' candidate' + (list.length === 1 ? '' : 's') + '</div>' : '') + table;

        document.getElementById('cf-job').addEventListener('change', function () { showCandidates(this.value || null); });

        qs.addEventListener('input', function () { q = qs.value; var pos = qs.selectionStart; draw(); var n = document.getElementById('cf-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* search inputs */ } });
        var board = document.getElementById('cf-board'); if (board) board.addEventListener('click', function () { selectTab('jobs'); showPipeline(jobId); });
        var allBox = document.getElementById('c-all');

        bind('[data-open]', function (el) {
          showCandidate(el.getAttribute('data-open'), jobId, { ids: order, backLabel: 'Candidates', back: function () { selectTab('cands'); showCandidates(jobId, true); } });

        if (!sel.length) return;
        var reload = function () { picked = {}; showCandidates(jobId, true); };

        if (st) st.addEventListener('change', function () {
          if (!st.value) return;
          var name = st.options[st.selectedIndex].text;
          run('bulk_move', { application_ids: sel, stage_id: st.value }).then(function (r) { reload(); bulkDone(r, 'Moved to ' + name); }).catch(fail);

        var named = function () { return list.filter(function (a) { return picked[a.id]; }).map(function (a) { return { application_id: a.id, name: a.candidate_name }; }); };
        var grp = document.getElementById('b-group'); if (grp) grp.addEventListener('click', function () { groupModal({ mode: 'new', jobId: jobId, candidates: named() }, function () { picked = {}; showCandidates(jobId, true); }); });
        var add = document.getElementById('b-addgroup'); if (add) add.addEventListener('click', function () { groupModal({ mode: 'add', jobId: jobId, candidates: named() }, function () { picked = {}; showCandidates(jobId, true); }); });
        document.getElementById('b-mail').addEventListener('click', function () { emailModal(sel, function () { picked = {}; showCandidates(jobId, true); }); });
        document.getElementById('b-reject').addEventListener('click', function () { rejectModal(sel, function () { picked = {}; showCandidates(jobId, true); }); });
        document.getElementById('b-pool').addEventListener('click', function () {
          run('bulk_talent_pool', { application_ids: sel }).then(function (r) { reload(); bulkDone(r, 'Added to talent pool'); }).catch(fail);
        });
