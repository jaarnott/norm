<style>
  /* Norm Performance.
     Styled by its host (AppRunner → hostStyles.ts): the --norm-* tokens, the
     element defaults and the opt-in .n-* classes (buttons, badges, tables,
     tabs, fields, cards) all come from there, and the body carries the page
     gutter — so nothing here frames, centres or pads the app. The screens
     moved here from Norm Training unchanged, and so did their styles. */

  /* Our own title shows only outside Norm: the host draws the app's title.
     The scope line (which venue, which version) stays — the host doesn't say it. */
  .app-head { margin: 12px 0 8px; }
  .app-head h1 { margin: 0; font-size: var(--norm-fs-xl); font-weight: 700; letter-spacing: -0.01em; }
  html[data-norm-variant] .app-head h1 { display: none; }
  html[data-norm-variant] .app-head { margin: 0 0 4px; }

  /* Tabs on the left, one rule under them. */
  .bar { display: flex; align-items: flex-end; gap: 16px; box-shadow: inset 0 -1px 0 var(--norm-line); }
  .bar .n-tabs { flex: 0 1 auto; min-width: 0; gap: 24px; box-shadow: none; }
  .bar .n-tab { padding: 10px 2px; }
  .n-tab:focus-visible { outline-offset: -2px; }
  .n-tab[hidden] { display: none; }
  #body { padding-top: 16px; }

  /* ---- Small parts ---- */
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .sub, .hint, .none { font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .none { padding: 4px 0; }
  .inst { display: block; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .nowrap { white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .err { margin-top: 8px; font-size: var(--norm-fs-sm); color: var(--norm-error); }
  .err:empty { display: none; }
  .saved { font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-ok); }
  .i { display: inline-block; flex: 0 0 auto; vertical-align: middle; }
  .link { padding: 0; border: none; background: none; font: inherit; color: var(--norm-accent); text-align: left; cursor: pointer; }
  .link:hover { color: var(--norm-accent-strong); text-decoration: underline; text-underline-offset: 2px; }
  .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 2px 0; border: none; background: none;
          font: inherit; font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); cursor: pointer; }
  .back:hover { color: var(--norm-text); }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
          border: none; border-radius: var(--norm-radius); background: transparent; color: var(--norm-icon); cursor: pointer; }
  .ibtn:hover { background: var(--norm-surface-alt); color: var(--norm-text); }
  .ibtn--danger:hover { background: var(--norm-error-bg); color: var(--norm-error); }
  @media (pointer: coarse) { .ibtn { width: 36px; height: 36px; } }
  .fld-sm { height: 30px; font-size: var(--norm-fs-sm); }
  @media (pointer: coarse) { .fld-sm { height: 40px; } }
  input[type=checkbox] { flex: 0 0 auto; width: 16px; height: 16px; margin: 0; accent-color: var(--norm-accent); cursor: pointer; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft);
           white-space: nowrap; cursor: pointer; }

  /* ---- Loading, empty, error ---- */
  .state { padding: 40px 16px; text-align: center; color: var(--norm-muted); }
  .state-title { font-weight: 500; color: var(--norm-text-soft); }
  .state-detail { margin-top: 4px; font-size: var(--norm-fs-sm); }
  .spin { display: flex; width: 18px; height: 18px; margin: 0 auto 8px; color: var(--norm-icon); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--norm-radius);
           background: var(--norm-error-bg); color: var(--norm-error); }
  .alert .i { margin-top: 2px; }
  .alert-title { font-weight: 600; }
  .alert-detail { margin-top: 2px; font-size: var(--norm-fs-sm); }

  /* ---- Frameworks: a table on the page, cards on a phone ---- */
  .ltable .c-main { width: 100%; max-width: 0; }
  .prog { display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
  .prog-text { min-width: 0; }
  .prog .meta { font-size: var(--norm-fs-xs); color: var(--norm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-only { display: none; }
  @media (max-width: 640px) {
    .ltable thead { display: none; }
    .ltable, .ltable tbody { display: block; }
    .ltable tbody tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px 12px;
                       margin-bottom: 10px; padding: 12px 14px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius-lg);
                       background: var(--norm-bg); }
    .ltable tbody td { display: block; padding: 0; border: none; background: none; }
    /* A tap leaves :hover on a card; the table's row hover must not paint it. */
    .ltable.n-table tbody tr:hover > td { background: none; }
    .ltable .c-main { grid-column: 1 / 3; grid-row: 1; width: auto; max-width: none; }
    .ltable .c-act { grid-column: 3; grid-row: 1; }
    .ltable .c-desk { display: none; }
    .ltable .c-status { grid-column: 1; grid-row: 2; }
    .ltable .m-only { display: block; }
  }

  /* ---- Detail views: sections as cards ---- */
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .title { margin: 0; font-size: var(--norm-fs-lg); font-weight: 600; }
  .panel { margin-top: 16px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--norm-line); }
  .panel-head h2 { margin: 0; font-size: var(--norm-fs-md); font-weight: 600; }
  .panel-body { padding: 12px 16px; }
  .panel-body.form { max-width: 760px; }
  .tbl { overflow-x: auto; }
  /* On a narrow screen the table scrolls sideways rather than crushing its first column. */
  .tbl .n-table td:first-child { min-width: 120px; }
  .n-card .n-table tbody tr:last-child > td { border-bottom: none; }
  .n-card .n-table th:first-child, .n-card .n-table td:first-child { padding-left: 16px; }
  .n-card .n-table th:last-child, .n-card .n-table td:last-child { padding-right: 16px; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .lbl { font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); }
  .intro { margin: 0 0 12px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }
  .foot-note { margin-top: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }

  /* Form rows: a label column, then the control. */
  .field { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .panel-body > .field:first-child { margin-top: 0; }
  .panel-body > .field:last-child { margin-bottom: 0; }
  .field > label, .field > .lbl { flex: 0 0 120px; font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); }
  .field > label.inline { flex: 0 0 auto; margin-left: 12px; }
  .field .n-input, .field .n-select { min-width: 0; }
  .stack { margin-top: 12px; }
  .stack .n-input { display: block; width: 100%; }
  @media (max-width: 640px) {
    .field { flex-wrap: wrap; row-gap: 6px; }
    .field > label, .field > .lbl { flex-basis: 100%; }
    .field--inline > label, .field > label.inline { flex-basis: auto; margin-left: 0; }
  }

  /* The capability framework editor: categories → capabilities → levels. */
  .tree { max-width: 880px; }
  .cap-head, .cat-head { display: flex; align-items: center; gap: 8px; }
  .addrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .addrow .n-input { flex: 0 1 240px; min-width: 0; }

  /* ---- Dialogs ---- */
  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
           padding: 40px 16px; overflow-y: auto; background: rgba(26, 26, 26, 0.35); }
  .dlg { width: 100%; max-width: 640px; padding: 20px; border-radius: var(--norm-radius-lg); background: var(--norm-bg);
         box-shadow: 0 12px 40px rgba(26, 26, 26, 0.18); }
  .dlg--sm { max-width: 440px; }
  .dlg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .dlg-title { margin: 0; font-size: var(--norm-fs-md); font-weight: 600; }
  .dlg-msg { margin: 8px 0 0; color: var(--norm-text-soft); }
  .dlg-intro { margin: -6px 0 12px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }
  .dlg-label { margin-top: 14px; }
  .dlg-input { display: block; width: 100%; }
  .dlg-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  /* A long editor keeps Save in reach: the footer sticks to the foot of the view. */
  .dlg-foot--bar { position: sticky; bottom: -40px; z-index: 2; margin: 20px -20px -20px; padding: 12px 20px;
                   border-top: 1px solid var(--norm-line); border-radius: 0 0 var(--norm-radius-lg) var(--norm-radius-lg);
                   background: var(--norm-bg); }
  .dlg iframe, .dlg video { display: block; max-width: 100%; border: 0; border-radius: var(--norm-radius); }
  .pick { max-height: 240px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .pick label { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--norm-line-soft); cursor: pointer; }
  .pick label:last-child { border-bottom: none; }
  .pick label:hover { background: var(--norm-surface-alt); }
  .pick .none { padding: 8px 10px; }
  .preview { max-height: 220px; overflow: auto; padding: 10px 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius);
             background: var(--norm-surface); }
  .cat { padding: 12px 0; border-top: 1px solid var(--norm-line-soft); }
  .cat:first-child { padding-top: 4px; border-top: none; }
  .caps { margin: 4px 0 0 12px; }
  .cap { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--norm-line); }
  .lvl-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .lvl-tag { flex: 0 0 84px; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .lvl-row .n-input { flex: 1; min-width: 0; }
  /* Inputs sharing a row with buttons may shrink, so nothing is pushed off a phone screen. */
  .cat-head .n-input, .cap-head .n-input { min-width: 0; }

  /* ---- Orbit refresh banner: slim, never in the way ---- */
  .sync { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 8px; padding: 6px 10px; border-radius: var(--norm-radius);
          background: var(--norm-surface-alt); font-size: var(--norm-fs-xs); color: var(--norm-text-soft); }
  .sync .i { margin-top: 1px; color: var(--norm-icon); }
  .sync[hidden] { display: none; }
  .tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px;
               border-radius: 999px; background: var(--norm-warn-bg); color: var(--norm-warn); font-size: var(--norm-fs-xs); font-weight: 600; }
  .tab-count[hidden] { display: none; }
  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 60; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px;
           border-radius: var(--norm-radius); background: var(--norm-text); color: var(--norm-bg); font-size: var(--norm-fs-sm);
           box-shadow: 0 6px 20px rgba(26, 26, 26, 0.2); }
  .toast[hidden] { display: none; }

  tr.click { cursor: pointer; }
  .overdue { color: var(--norm-error); font-weight: 500; }
  .muted-row td { color: var(--norm-muted); }
  .warnline { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; font-size: var(--norm-fs-xs); color: var(--norm-warn); }
  .warnline .i { margin-top: 1px; }
  .banner { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--norm-line); border-left: 3px solid var(--norm-accent);
            border-radius: var(--norm-radius); background: var(--norm-bg); font-size: var(--norm-fs-sm); }
  .banner .name { margin-bottom: 2px; }
  .banner--row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .search { flex: 0 1 260px; min-width: 0; }

  /* ---- A performance review ---- */
  .rv-meta { margin-top: 4px; font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .rv-steps { margin-top: 16px; }
  .rv-steps .n-tab { display: inline-flex; align-items: center; gap: 4px; }
  .rv-steps .n-tab .i { color: var(--norm-ok); }
  .capcat + .capcat { margin-top: 16px; }
  .capcat-name { margin-bottom: 8px; font-weight: 600; font-size: var(--norm-fs-sm); }
  .capbox { margin-top: 8px; padding: 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .lvl-grid { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 4px 12px; align-items: start; }
  .lvl-grid.cols-2 { grid-template-columns: minmax(0, 1fr) 56px 56px; }
  .lvl-grid.cols-0 { grid-template-columns: minmax(0, 1fr); }
  .lvl-col { font-size: var(--norm-fs-xs); font-weight: 600; color: var(--norm-muted); text-align: center; text-transform: uppercase; letter-spacing: 0.02em; }
  .lvl-line { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--norm-line-soft); }
  .lvl-name { font-size: var(--norm-fs-xs); font-weight: 600; }
  .lvl-desc { font-size: var(--norm-fs-xs); color: var(--norm-muted); white-space: pre-wrap; }
  .lvl-cell { display: flex; justify-content: center; padding-top: 2px; }
  .radio { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; padding: 0; border: 2px solid var(--norm-line-strong);
           border-radius: 50%; background: var(--norm-bg); cursor: pointer; }
  .radio:hover:not(:disabled) { border-color: var(--norm-accent); }
  .radio.on { border-color: var(--norm-accent); background: var(--norm-accent); box-shadow: inset 0 0 0 3px var(--norm-bg); }
  .radio:disabled { cursor: default; opacity: 0.65; }
  @media (pointer: coarse) { .radio { width: 26px; height: 26px; } }
  .sums { display: grid; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--norm-line); }
  @media (min-width: 900px) { .sums.two { grid-template-columns: 1fr 1fr; } }
  .sum { padding: 14px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .sum-list { margin-top: 10px; }
  .sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--norm-line-soft); font-size: var(--norm-fs-sm); }
  .sum-row:last-child { border-bottom: none; }
  .sum-lvl { flex: 0 0 auto; font-weight: 500; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .count { padding: 6px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); text-align: center; }
  .count-n { font-size: var(--norm-fs-lg); font-weight: 600; }
  .sum-overall { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--norm-line-soft); }
  .overall-btns { display: grid; gap: 6px; margin-top: 6px; }
  @media (min-width: 640px) { .overall-btns { grid-template-columns: repeat(3, 1fr); } }
  .overall-btns .n-btn { height: auto; min-height: 32px; white-space: normal; }

  .acols { display: grid; gap: 20px; }
  @media (min-width: 900px) { .acols.two { grid-template-columns: 1fr 1fr; } }
  .acol-head { padding-bottom: 10px; border-bottom: 1px solid var(--norm-line); }
  .acol-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--norm-accent-strong); }
  .acol-sub { margin-top: 2px; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .draft-note { margin-top: 8px; padding: 6px 10px; border-radius: var(--norm-radius); background: var(--norm-warn-bg); color: var(--norm-warn); font-size: var(--norm-fs-xs); }
  .pending { display: flex; align-items: center; justify-content: center; min-height: 160px; padding: 24px; border: 1px dashed var(--norm-line);
             border-radius: var(--norm-radius); text-align: center; font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .qa { margin-top: 16px; }
  .qa-label { margin-bottom: 6px; font-size: var(--norm-fs-sm); font-weight: 600; }
  .qa textarea, .qa select { display: block; width: 100%; }
  .qa textarea { min-height: 76px; }
  .answer { font-size: var(--norm-fs-sm); color: var(--norm-text); white-space: pre-wrap; }
  .answer--none { font-style: italic; color: var(--norm-muted); }
  .private { margin-top: 16px; padding: 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); background: var(--norm-surface-alt); }
  .private .qa:first-of-type { margin-top: 10px; }
  .private-title { font-size: var(--norm-fs-sm); font-weight: 600; color: var(--norm-accent-strong); }
  .answer-line { margin-top: 6px; font-size: var(--norm-fs-sm); }
  .ratings { display: grid; gap: 2px; }
  .rating { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--norm-line-soft);
            cursor: pointer; }
  .rating:first-child { border-top: none; }
  .rating-name { font-size: var(--norm-fs-xs); font-weight: 600; }
  .rating-desc { font-size: var(--norm-fs-xs); color: var(--norm-muted); white-space: pre-wrap; }
  .rating-read .rating-name { font-size: var(--norm-fs-sm); color: var(--norm-accent-strong); }
  .unlock { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--norm-line-soft); font-size: var(--norm-fs-sm); }
  .goal { padding: 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .goal + .goal { margin-top: 8px; }
  .outcome { margin-top: 8px; }
  .outcome-title { margin-bottom: 4px; font-size: var(--norm-fs-xs); font-weight: 600; color: var(--norm-muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .outcome-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .goal-edit { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .goal-edit .n-input { flex: 1; min-width: 0; }
  .goal-list { margin: 6px 0 0; padding-left: 20px; font-size: var(--norm-fs-sm); }
  .goal-list li + li { margin-top: 4px; }
  .rv-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .rv-foot-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .tiles { display: grid; gap: 12px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile-box { padding: 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .tile-label { margin-bottom: 4px; font-size: var(--norm-fs-xs); color: var(--norm-muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .tile-value { font-weight: 600; }
  .tile-big { font-size: var(--norm-fs-lg); font-weight: 600; }
  .pay-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .cmp { padding: 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .cmp + .cmp { margin-top: 8px; }
  .cmp-q { margin-bottom: 8px; font-size: var(--norm-fs-sm); font-weight: 600; }
  .cmp-sides { display: grid; gap: 12px; }
  @media (min-width: 760px) { .cmp-sides { grid-template-columns: 1fr 1fr; } .cmp-sides > :last-child { padding-left: 12px; border-left: 1px solid var(--norm-line); } }
  .side-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: var(--norm-fs-xs); font-weight: 600; color: var(--norm-muted);
               text-transform: uppercase; letter-spacing: 0.02em; }
  .cmp-cap { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--norm-line-soft);
             font-size: var(--norm-fs-sm); }
  .cmp-cap:first-child { border-top: none; }
  .cmp-cap .who { display: block; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .cmp-cap > span:not(:first-child) { text-align: right; }
  .cmp-cap .differs { color: var(--norm-warn); }
  .cmp-list { border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .mail { margin-top: 10px; font-size: var(--norm-fs-sm); }
  .mail summary { color: var(--norm-text-soft); cursor: pointer; }
  .mailframe { display: block; width: 100%; height: 420px; margin-top: 8px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); background: #fff; }

  /* ---- Review cycles ---- */
  .cycle { padding: 14px 16px; }
  .cycle + .cycle { margin-top: 10px; }
  .cycle-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cycle-stats { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .people-list { margin: 4px 0 0; padding-left: 18px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }

<div class="wrap">

<script>
(function () {
  var ctx = null, view = 'my_team', state = {};
  var body = document.getElementById('body');
  var modalHost = document.getElementById('modal');

  // ---- Icons -------------------------------------------------------------
  // Lucide line icons (lucide.dev, ISC licence), inlined because the sandbox
  // can load nothing.
  var UI_ICONS = {
    'plus': '<path d="M5 12h14"/><path d="M12 5v14"/>',

    'arrow-left': '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',

    'arrow-down': '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',

    'check': '<path d="M20 6 9 17l-5-5"/>',
    'file-text': '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
    'circle-play': '<path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/><circle cx="12" cy="12" r="10"/>',
    'list-checks': '<path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/>',
    'upload': '<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
    'printer': '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
    'paperclip': '<path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/>',
    'loader-circle': '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
    'triangle-alert': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    'circle-check': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    'info': '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    'user-check': '<path d="m16 11 2 2 4-4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
    'compass': '<path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/>',
    'lock-open': '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
    'arrow-right': '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    'send': '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
    'pencil': '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  };
  function svg(paths, size) {
    return '<svg class="i" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
      ' stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }
  function ui(name, size) { return svg(UI_ICONS[name] || '', size || 16); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  // Sentence case for a stored value: "in_progress" → "In progress".
  function label(s) { s = String(s || '').replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  function badge(text, t, title) {
    return '<span class="n-badge' + (t ? ' n-badge--' + t : '') + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(text) + '</span>';
  }
  // An icon-only button: `name` is its accessible name and its tooltip.
  function ibtn(attrs, icon, name, danger) {
    return '<button type="button" class="ibtn' + (danger ? ' ibtn--danger' : '') + '" ' + attrs +
      ' aria-label="' + esc(name) + '" title="' + esc(name) + '">' + ui(icon, 16) + '</button>';
  }

  function run(op, extra) {
    var p = { op: op, venues: (ctx && ctx.venues) || [] };
    for (var k in (extra || {})) p[k] = extra[k];
    return norm.run(p).then(function (d) {
      if (d && d.error) throw new Error(d.error);
      return d;
    });
  }
  function loading() { body.innerHTML = '<div class="state" role="status"><span class="spin">' + ui('loader-circle', 18) + '</span>Loading…</div>'; }
  function empty(title, detail) {
    return '<div class="state"><div class="state-title">' + esc(title) + '</div>' +
      (detail ? '<div class="state-detail">' + esc(detail) + '</div>' : '') + '</div>';
  }
  function fail(e) {
    body.innerHTML = '<div class="alert" role="alert">' + ui('triangle-alert', 16) +
      '<div><div class="alert-title">That didn’t work</div><div class="alert-detail">' + esc(e && e.message ? e.message : e) + '</div></div></div>';
  }

  // ---- Dialogs -----------------------------------------------------------
  // The sandbox has no allow-modals, so window.confirm / prompt / alert do
  // nothing here: every question is asked in the app's own dialog instead.
  var dismiss = null;    // how the open question cancels (overlay click, Escape)
  var pointerY = null;   // where the last click landed (placeModal)
  document.addEventListener('pointerdown', function (ev) { pointerY = ev.clientY; }, true);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && dismiss) { ev.preventDefault(); closeModal(); }
  });
  function closeModal() {
    var d = dismiss; dismiss = null;
    modalHost.innerHTML = '';
    if (d) d();
  }
  function foot(html) { return '<div class="dlg-foot dlg-foot--bar">' + html + '</div>'; }
  // A card in a conversation grows to fit its content, so its frame never
  // scrolls, and a dialog pinned to the top of a tall card would open out of
  // sight. There, it opens level with the click that asked for it.
  function placeModal(overlay) {
    if (document.documentElement.getAttribute('data-norm-variant') !== 'embedded') return;
    var vh = window.innerHeight;
    if (pointerY == null || document.documentElement.scrollHeight > vh + 1) return;
    var y = Math.min(pointerY - 60, vh - overlay.firstChild.offsetHeight - 16);
    if (y > 40) overlay.style.paddingTop = Math.round(y) + 'px';
  }
  // opts: small (a question), role, onDismiss (cancel path), keep (an editor
  // re-rendering itself keeps its scroll position).
  function modal(html, opts) {
    opts = opts || {};
    var prev = modalHost.querySelector('.modal');
    var pad = prev ? prev.style.paddingTop : '';
    var top = prev && opts.keep ? prev.scrollTop : 0;
    closeModal();
    modalHost.innerHTML = '<div class="modal"><div class="dlg' + (opts.small ? ' dlg--sm' : '') + '" role="' + (opts.role || 'dialog') +
      '" aria-modal="true" aria-labelledby="dlg-title">' + html + '</div></div>';
    var overlay = modalHost.querySelector('.modal');
    dismiss = opts.onDismiss || null;
    overlay.addEventListener('click', function (ev) {
      if (ev.target === ev.currentTarget) closeModal();
    });
    if (prev) overlay.style.paddingTop = pad; else placeModal(overlay);
    if (top) overlay.scrollTop = top;
    return overlay;
  }
  // One question in a small dialog; resolves with what `finish` is given, or
  // with `cancelled` when it is dismissed.
  function dialog(html, cancelled, setup) {
    return new Promise(function (resolve) {
      var settled = false;
      function finish(value) {
        if (settled) return;
        settled = true;
        dismiss = null;
        modalHost.innerHTML = '';
        resolve(value);
      }
      var overlay = modal(html, { small: true, role: 'alertdialog', onDismiss: function () { finish(cancelled); } });
      setup(overlay, finish);
    });
  }
  // → Promise<boolean>. opts: title, confirm, cancel (button labels), danger.
  function askConfirm(message, opts) {
    opts = opts || {};
    return dialog(
      '<h2 class="dlg-title" id="dlg-title">' + esc(opts.title || 'Are you sure?') + '</h2>' +
      '<p class="dlg-msg">' + esc(message) + '</p>' +
      '<div class="dlg-foot">' +
        '<button type="button" class="n-btn n-btn--secondary" data-dlg="no">' + esc(opts.cancel || 'Cancel') + '</button>' +
        '<button type="button" class="n-btn ' + (opts.danger ? 'n-btn--danger' : 'n-btn--primary') + '" data-dlg="yes">' + esc(opts.confirm || 'OK') + '</button>' +
      '</div>', false, function (root, finish) {
        var no = root.querySelector('[data-dlg="no"]'), yes = root.querySelector('[data-dlg="yes"]');
        no.addEventListener('click', function () { finish(false); });
        yes.addEventListener('click', function () { finish(true); });
        (opts.danger ? no : yes).focus();
      });
  }
  // → Promise<string|null> (null = cancelled). opts: title, placeholder,
  // confirm, required (no empty answer), multiline.
  function askText(labelText, initial, opts) {
    opts = opts || {};
    var ph = opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '';
    var field = opts.multiline
      ? '<textarea class="n-input dlg-input" id="dlg-in" rows="3"' + ph + '>' + esc(initial || '') + '</textarea>'
      : '<input type="text" class="n-input dlg-input" id="dlg-in" autocomplete="off" value="' + esc(initial || '') + '"' + ph + '>';
    return dialog(
      '<h2 class="dlg-title" id="dlg-title">' + esc(opts.title || labelText) + '</h2>' +
      '<label class="n-label dlg-label" for="dlg-in">' + esc(labelText) + '</label>' + field +
      '<div class="dlg-foot">' +
        '<button type="button" class="n-btn n-btn--secondary" data-dlg="no">Cancel</button>' +
        '<button type="button" class="n-btn n-btn--primary" data-dlg="yes">' + esc(opts.confirm || 'OK') + '</button>' +
      '</div>', null, function (root, finish) {
        var input = root.querySelector('#dlg-in'), yes = root.querySelector('[data-dlg="yes"]');
        function sync() { if (opts.required) yes.disabled = !input.value.trim(); }
        input.addEventListener('input', sync);
        sync();
        yes.addEventListener('click', function () { if (!yes.disabled) finish(input.value); });
        root.querySelector('[data-dlg="no"]').addEventListener('click', function () { finish(null); });
        if (!opts.multiline) input.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); yes.click(); }
        });
        input.focus();
      });
  }
  // → Promise<void>.
  function notify(message, opts) {
    opts = opts || {};
    return dialog(
      '<h2 class="dlg-title" id="dlg-title">' + esc(opts.title || 'Before you do that') + '</h2>' +
      '<p class="dlg-msg">' + esc(message) + '</p>' +
      '<div class="dlg-foot"><button type="button" class="n-btn n-btn--primary" data-dlg="yes">OK</button></div>',
      undefined, function (root, finish) {
        var ok = root.querySelector('[data-dlg="yes"]');
        ok.addEventListener('click', function () { finish(); });
        ok.focus();
      });
  }

  function bind(sel, ev, fn) { body.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, function () { fn(el); }); }); }
  // Handlers for elements INSIDE a modal live in modalHost, not body.
  function bindM(sel, ev, fn) {
    if (typeof ev === 'function') { fn = ev; ev = 'click'; }
    modalHost.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, function () { fn(el); }); });
  }

  // ---- Capability frameworks ---------------------------------------------
  function showFrameworks() {
    loading();
    run('frameworks').then(function (d) {
      var rows = d.frameworks || [];
      body.innerHTML = '<div class="toolbar">' +
          (rows.length ? '<span class="sub">' + rows.length + ' framework' + (rows.length === 1 ? '' : 's') + '</span>' : '') +
          '<span class="grow"></span><button type="button" class="n-btn n-btn--secondary n-btn--sm" id="newfw">' + ui('plus', 14) + 'New framework</button></div>' +
        (rows.length ? '<table class="n-table ltable"><thead><tr><th class="c-main">Framework</th><th class="num c-desk">Categories</th>' +
            '<th class="c-status">Status</th><th class="c-act"><span class="sr">Actions</span></th></tr></thead><tbody>' +
          rows.map(function (f) {
            return '<tr><td class="c-main"><div class="prog" data-fw="' + esc(f.id) + '"><div class="prog-text">' +
                '<div class="name">' + esc(f.name) + '</div>' +
                (f.role_label && f.role_label !== f.name ? '<div class="meta">' + esc(f.role_label) + '</div>' : '') +
                '<div class="meta m-only">' + f.category_count + ' categor' + (f.category_count === 1 ? 'y' : 'ies') + '</div>' +
              '</div></div></td>' +
              '<td class="num c-desk">' + f.category_count + '</td>' +
              '<td class="c-status">' + (f.is_active === false ? badge('Inactive') : badge('Active', 'ok')) + '</td>' +
              '<td class="num c-act"><button type="button" class="n-btn n-btn--secondary n-btn--sm" data-fw="' + esc(f.id) + '" aria-label="Open ' + esc(f.name) + '">Open</button></td></tr>';
          }).join('') + '</tbody></table>'
          : empty('No capability frameworks yet.'));
      document.getElementById('newfw').addEventListener('click', function () {
        askText('Name', '', { title: 'New capability framework', placeholder: 'e.g. Sales Manager', confirm: 'Create framework', required: true })
          .then(function (name) {
            if (!name || !name.trim()) return;
            run('save_framework', { fields: { name: name.trim(), is_active: true } }).then(function (r) { showFramework(r.framework.id); }).catch(fail);
          });
      });
      bind('[data-fw]', 'click', function (el) { showFramework(el.getAttribute('data-fw')); });
    }).catch(fail);
  }

  function showFramework(fid) {
    loading();
    run('framework', { framework_id: fid }).then(function (d) {
      state.fw = d.framework;
      // Work on a local copy of the tree so structural edits (add/remove) don't
      // hit the server until Save; every node keeps its id (server fills new).
      state.fwCats = JSON.parse(JSON.stringify(d.framework.categories || []));
      renderFramework(fid);
    }).catch(fail);
  }

  // Pull the on-screen field values back into the working model, so an add or
  // remove elsewhere on the form doesn't discard in-progress edits.
  function readFwInputs() {
    (state.fwCats || []).forEach(function (cat, ci) {
      var cn = document.getElementById('cat-' + ci); if (cn) cat.name = cn.value;
      (cat.capabilities || []).forEach(function (cap, ki) {
        var pn = document.getElementById('cap-' + ci + '-' + ki); if (pn) cap.name = pn.value;
        var l1 = document.getElementById('l1-' + ci + '-' + ki); if (l1) cap.level1_descriptor = l1.value;
        var l2 = document.getElementById('l2-' + ci + '-' + ki); if (l2) cap.level2_descriptor = l2.value;
        var l3 = document.getElementById('l3-' + ci + '-' + ki); if (l3) cap.level3_descriptor = l3.value;
      });
    });
  }

  function renderFramework(fid) {
    var f = state.fw;
    var catsHtml = (state.fwCats || []).map(function (cat, ci) {
      var caps = (cat.capabilities || []).map(function (cap, ki) {
        return '<div class="cap">' +
          '<div class="cap-head"><input type="text" class="n-input fld-sm" id="cap-' + ci + '-' + ki + '" value="' + esc(cap.name || '') + '" placeholder="Capability" style="flex:1;font-weight:500" aria-label="Capability">' +
            ibtn('data-delcap="' + ci + '-' + ki + '"', 'trash-2', 'Remove capability', true) + '</div>' +
          '<div class="lvl-row"><label class="lvl-tag" for="l1-' + ci + '-' + ki + '">Developing</label>' +
            '<input type="text" class="n-input fld-sm" id="l1-' + ci + '-' + ki + '" value="' + esc(cap.level1_descriptor || '') + '" placeholder="Level 1 — developing"></div>' +
          '<div class="lvl-row"><label class="lvl-tag" for="l2-' + ci + '-' + ki + '">Competent</label>' +
            '<input type="text" class="n-input fld-sm" id="l2-' + ci + '-' + ki + '" value="' + esc(cap.level2_descriptor || '') + '" placeholder="Level 2 — competent"></div>' +
          '<div class="lvl-row"><label class="lvl-tag" for="l3-' + ci + '-' + ki + '">Leading</label>' +
            '<input type="text" class="n-input fld-sm" id="l3-' + ci + '-' + ki + '" value="' + esc(cap.level3_descriptor || '') + '" placeholder="Level 3 — leading"></div>' +
          '</div>';
      }).join('');
      return '<div class="cat"><div class="cat-head"><input type="text" class="n-input" id="cat-' + ci + '" value="' + esc(cat.name || '') + '" placeholder="Category" style="flex:1;font-weight:600" aria-label="Category">' +
        '<button type="button" class="n-btn n-btn--secondary n-btn--sm" data-addcap="' + ci + '">' + ui('plus', 14) + 'Capability</button>' +
        ibtn('data-delcat="' + ci + '"', 'trash-2', 'Remove category', true) + '</div>' +
        '<div class="caps">' + (caps || '<div class="none">No capabilities yet</div>') + '</div></div>';
    }).join('');
    body.innerHTML = '<button type="button" class="back" id="back">' + ui('arrow-left', 14) + 'All frameworks</button>' +
      '<div class="title-row"><h2 class="title">' + esc(f.name || 'Framework') + '</h2>' +
        (f.is_active === false ? badge('Inactive') : badge('Active', 'ok')) + '</div>' +
      '<section class="n-card panel"><div class="panel-head"><h2>Details</h2></div><div class="panel-body form">' +
        '<div class="field"><label for="fw-name">Name</label><input type="text" class="n-input" id="fw-name" style="flex:1" value="' + esc(f.name || '') + '"></div>' +
        '<div class="field"><label for="fw-role">Role label</label><input type="text" class="n-input" id="fw-role" style="flex:1" value="' + esc(f.role_label || '') + '"></div>' +
        '<div class="field field--inline"><label for="fw-active">Active</label><input type="checkbox" id="fw-active"' + (f.is_active === false ? '' : ' checked') + '></div>' +
      '</div></section>' +
      '<section class="n-card panel"><div class="panel-head"><h2>Categories &amp; capabilities</h2><span class="grow"></span>' +
        '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="addcat">' + ui('plus', 14) + 'Category</button></div>' +
        '<div class="panel-body"><div class="tree">' + (catsHtml || '<div class="none">No categories yet — add one.</div>') + '</div></div></section>' +
      '<div class="actions"><button type="button" class="n-btn n-btn--primary" id="fw-save">Save framework</button><span class="saved" id="fw-saved"></span></div>';
    document.getElementById('back').addEventListener('click', function () { view = 'frameworks'; render(); });
    document.getElementById('addcat').addEventListener('click', function () {
      readFwInputs(); state.fwCats.push({ name: 'New category', capabilities: [] }); renderFramework(fid);
    });
    bind('[data-addcap]', 'click', function (el) {
      readFwInputs(); var ci = Number(el.getAttribute('data-addcap'));
      state.fwCats[ci].capabilities = state.fwCats[ci].capabilities || [];
      state.fwCats[ci].capabilities.push({ name: 'New capability' }); renderFramework(fid);
    });
    bind('[data-delcat]', 'click', function (el) {
      readFwInputs(); state.fwCats.splice(Number(el.getAttribute('data-delcat')), 1); renderFramework(fid);
    });

  // ---- One performance review -----------------------------------------------

  ];
  var RATINGS = [

    { value: 1, label: 'Below Requirements or Developing', description: 'Employees show potential, but performance is low. Employees may be new to the job or task and are developing. Employees require frequent guidance.' },
    { value: 0, label: 'Unsatisfactory', description: 'Employee is not completing the task at all or performance is very low. Employees may be doing things that negatively affect others’ performance, or create conflict.' },

  var STEP_LABELS = { capabilities: 'Capabilities', assessment: 'Assessment', goals: 'Goals', pay: 'Pay' };

  // Writes to a review go one at a time: each op reads the whole review and

  }

  function rvCaps() {

  // The same rules the server enforces on submit (training.py _manager_missing).
  function rvComplete(side) {

        if (!noteworthy) return apply();
        function list(title, ppl, extra) {
          if (!(ppl || []).length) return '';
          return '<div class="plan-sec"><div class="name">' + esc(title) + '</div><ul class="people-list">' + ppl.map(function (x) { return '<li>' + esc(x.name) + '</li>'; }).join('') + '</ul>' + (extra || '') + '</div>';
        }
        var n = function (a) { return (a || []).length; };
        dialog('<h2 class="dlg-title" id="dlg-title">Before we save</h2><p class="dlg-msg">Here’s what this changes for the round due ' + esc(p.due_date || '—') + '.</p>' +
          '<div style="margin-top:12px">' +
          list(n(p.created) + ' review' + (n(p.created) === 1 ? '' : 's') + ' will be created', p.created) +
          list(n(p.removed) + ' unstarted review' + (n(p.removed) === 1 ? '' : 's') + ' will be withdrawn (no longer in this cycle)', p.removed) +
          list(n(p.deletion_blocked) + ' won’t get a review — theirs was deleted for this round', p.deletion_blocked, '<div class="hint">They’ll be picked up again at the next round.</div>') +
          list(n(p.missing_framework) + ' will have no capability framework', p.missing_framework, '<div class="hint">Set a default framework on the cycle first if that matters.</div>') +
          '</div><div class="dlg-foot"><button type="button" class="n-btn n-btn--secondary" data-dlg="no">Back</button><button type="button" class="n-btn n-btn--primary" data-dlg="yes">Confirm</button></div>',
          false, function (root, finish) {
            root.querySelector('[data-dlg="no"]').addEventListener('click', function () { finish(false); });
            root.querySelector('[data-dlg="yes"]').addEventListener('click', function () { finish(true); });
          }).then(function (ok) { if (ok) apply().catch(oops); else draw(); });
      }).catch(function (e) { var el = modalHost.querySelector('#ca-err'); if (el) el.textContent = e.message; else oops(e); });
    }
    draw();
    countPreview();
  }

  // ---- Review emails ---------------------------------------------------------
  var KIND_LABELS = { ready: 'Ready', turn: 'Your turn', reminder: 'Reminder', meeting_ready: 'Meeting ready', manager_digest: 'Manager digest', goals: 'Goals' };
  function showReviewEmails() {
    loading();
    run('review_emails').then(function (d) {
      state.em = d;
      body.innerHTML =
        '<section class="n-card panel" style="margin-top:0"><div class="panel-head"><h2>Settings</h2></div><div class="panel-body">' +
          '<p class="intro">Managers get one combined email a day at 8am with the reviews they have to do — weekly, then every 3 days, then daily in the last 3 days, then every 2 days once overdue. A goals email goes when a review is completed. Emails to team members come with staff access.</p>' +
          '<label class="check"><input type="checkbox" id="em-on"' + (d.enabled ? ' checked' : '') + (d.can_toggle ? '' : ' disabled') + '>Send review emails</label>' +
          (d.can_toggle ? '' : '<span class="hint" style="margin-left:8px">An org manager can switch this.</span>') +
          '<div class="hint" style="margin-top:4px">Off while Orbit is the live system, so nobody gets every email twice.</div>' +
          '<div class="actions"><button type="button" class="n-btn n-btn--secondary n-btn--sm" id="em-preview">Preview today’s emails</button>' +
          '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="em-test">' + ui('send', 14) + 'Send test to me</button></div>' +
        '</div></section>' +
        '<section class="n-card panel"><div class="panel-head"><h2>Sent</h2><span class="grow"></span>' +
          '<input type="search" class="n-input fld-sm search" id="em-q" placeholder="Search name, email or subject…" aria-label="Search emails" value="' + esc(state.emQ || '') + '"></div>' +
          '<div id="em-list"></div></section>';
      renderEmailList();
      document.getElementById('em-q').addEventListener('input', function () { state.emQ = this.value; renderEmailList(); });
      document.getElementById('em-on').addEventListener('change', function () {
        var on = this.checked, box = this;
        (on ? askConfirm('Norm will email managers their review digest each morning and send goals emails when reviews are completed. Orbit sends its own — only switch this on at cut-over.', { title: 'Switch on review emails?', confirm: 'Switch on' }) : Promise.resolve(true))
          .then(function (ok) {
            if (!ok) { box.checked = !on; return; }
            run('review_email_toggle', { enabled: on }).then(function (r) {
              if (r && r.ok === false) { box.checked = !on; notify(r.reason || 'Not allowed'); return; }
              toast(on ? 'Review emails on' : 'Review emails off');
            }).catch(function (e) { box.checked = !on; oops(e); });
          });
      });
      document.getElementById('em-preview').addEventListener('click', function () { runDigests('dry_run'); });
      document.getElementById('em-test').addEventListener('click', function () { runDigests('test'); });
    }).catch(fail);
  }
  function renderEmailList() {
    var q = String(state.emQ || '').trim().toLowerCase();
    var rows = (state.em.rows || []).filter(function (r) {
      return !q || [r.name, r.to, r.subject].some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; });
    });
    var host = document.getElementById('em-list');
    if (!rows.length) { host.innerHTML = '<div class="panel-body none">No review emails yet.</div>'; return; }
    host.innerHTML = '<div class="tbl"><table class="n-table"><thead><tr><th>Sent</th><th>To</th><th>Type</th><th>Subject</th><th>Status</th></tr></thead><tbody>' +
      rows.map(function (r, i) {
        var st = String(r.status || '');
        return '<tr class="click" data-em="' + i + '"><td class="nowrap">' + esc(fmtStamp(r.at)) + '</td>' +
          '<td>' + (r.name ? '<div class="name">' + esc(r.name) + '</div>' : '') + '<div class="sub">' + esc(r.to || '') + '</div></td>' +
          '<td><div class="pills">' + badge(KIND_LABELS[r.kind] || label(r.kind || 'email')) + (r.is_test ? badge('Test', 'info') : '') + (r.source === 'orbit' ? badge('Orbit') : '') + '</div></td>' +
          '<td class="sub">' + esc(r.subject || '') + '</td>' +
          '<td>' + badge(label(st || 'unknown'), st === 'sent' ? 'ok' : (st === 'failed' ? 'error' : '')) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    host.querySelectorAll('[data-em]').forEach(function (el) {
      el.addEventListener('click', function () {
        var r = rows[Number(el.getAttribute('data-em'))];
        run('review_email_preview', { id: r.id, source: r.source }).then(function (p) {
          modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">' + esc(r.subject || 'Email') + '</h2></div>' +
            '<div class="sub">To ' + esc(r.to || '') + ' · ' + esc(fmtStamp(r.at)) + '</div>' +
            (r.error || p.error ? '<div class="err">' + esc(r.error || p.error) + '</div>' : '') +
            (p.html ? mailFrame(p.html) : '<div class="none" style="margin-top:12px">No copy of this email was kept.</div>') +
            foot('<button type="button" class="n-btn n-btn--secondary" id="em-close">Close</button>'));
          modalHost.querySelector('#em-close').addEventListener('click', closeModal);
        }).catch(oops);
      });
    });
  }
  function runDigests(mode) {
    var p = { op: 'review_digest_run', venues: (ctx && ctx.venues) || [], _email_mode: mode };
    norm.run(p).then(function (d) {
      if (d && d.error) throw new Error(d.error);
      if (mode === 'test') {
        var e = (d.emails || [])[0];
        notify(!e ? 'Nothing to send — no manager has reviews to do today.'
          : e.status === 'sent' ? 'A sample digest is on its way to you (“[TEST] ' + e.subject + '”).'
          : 'The test didn’t send: ' + (e.reason || e.status) + '.', { title: 'Send test' });
        showReviewEmails();
        return;
      }
      var list = d.emails || [];
      modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">Today’s emails</h2></div>' +
        '<p class="dlg-intro">' + (list.length ? list.length + ' manager digest' + (list.length === 1 ? '' : 's') + ' would go out today' : 'No digests would go out today.') +
          (state.em && !state.em.enabled ? ' (emails are switched off, so none will).' : '.') + '</p>' +
        (list.length ? '<div class="pick">' + list.map(function (e, i) {
          return '<label data-dg="' + i + '"><span class="grow"><span class="name">' + esc(e.manager || '') + '</span><span class="inst">' + esc((e.to || []).join(', ') || 'no email address on file') + ' · ' + esc(e.subject) + '</span></span>' + badge(e.items + ' review' + (e.items === 1 ? '' : 's')) + '</label>';
        }).join('') + '</div><div id="dg-preview"></div>' : '') +
        foot('<button type="button" class="n-btn n-btn--secondary" id="dg-close">Close</button>'));
      modalHost.querySelector('#dg-close').addEventListener('click', closeModal);
      bindM('[data-dg]', function (el) { var e = list[Number(el.getAttribute('data-dg'))]; modalHost.querySelector('#dg-preview').innerHTML = e.html ? mailFrame(e.html) : ''; });
    }).catch(oops);
  }

  function render() {
    closeModal();
    selectTab(view);
    if (view === 'all') showAllReviews();
    else if (view === 'cycles') showCycles();
    else if (view === 'frameworks') showFrameworks();
    else if (view === 'emails') showReviewEmails();
    else showMyTeam();
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { view = t.getAttribute('data-view'); render(); });
  });

  var VIEWS = ['my_team', 'all', 'cycles', 'frameworks', 'emails'];
  // What these pages were called while they lived in Norm Training.
  var OLD_VIEWS = { my_team_reviews: 'my_team', reviews: 'all', review_cycles: 'cycles', review_emails: 'emails' };
  function selectTab(v) {
    view = VIEWS.indexOf(v) >= 0 ? v : 'my_team';
    document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x.getAttribute('data-view') === view)); });
  }

  // Where Norm asked us to open — this component's inputs (view, review).
  // They ride every init, so only the FIRST one acts on them: a venue switch
  // must not yank the user back.
  var started = false;
  function start(c) {
    var ins = c.inputs || {};
    var v = OLD_VIEWS[ins.view] || ins.view;
    if (VIEWS.indexOf(v) >= 0) selectTab(v);
    if (!ins.review) return false;
    loading();
    run('locate', { review: ins.review }).then(function (r) {
      if (!r.review_id) { render(); return; }
      // From an email: as its manager when that's you, else as an admin.
      if (view !== 'all') selectTab('my_team');
      showReview(r.review_id, null, view);
    }).catch(fail);
    return true;
  }

  norm.onReady(function (c) {
    ctx = c;
    document.getElementById('scope').textContent =
      'Across the group' + (c.app && c.app.version ? ' · v' + c.app.version : '');
    if (!started) {
      started = true;
      loadSync();
      loadBadge();
      if (start(c)) return;
    }
    render();
  });
})();
</script>
