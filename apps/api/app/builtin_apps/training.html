  }

  // ---- Plans tab ---------------------------------------------------------
  function showPlans() {
    loading();
    Promise.all([run('plans', { status: state.planStatus || 'active' }), run('overview')]).then(function (res) {
      var plans = res[0].plans || [], programs = res[1].programs || [];
      state.planPrograms = programs.filter(function (p) { return p.requires_plan; });
      var statusSel = ['active', 'completed', 'cancelled', 'all'].map(function (s) {
        return '<option value="' + s + '"' + ((state.planStatus || 'active') === s ? ' selected' : '') + '>' + label(s) + '</option>';
      }).join('');
      var rows = plans.map(function (pl) {
        return '<tr><td><button type="button" class="link" data-member="' + esc(pl.person_id) + '">' + esc(pl.person_name) + '</button></td>' +
          '<td><button type="button" class="link" data-plan="' + esc(pl.id) + '">' + esc(pl.program_name || '') + '</button>' +
            (pl.instance ? '<span class="inst">' + esc(pl.instance) + '</span>' : '') + '</td>' +
          '<td class="nowrap">' + esc(pl.next_due || (pl.section_count ? 'All scheduled' : '—')) + '</td>' +
          '<td>' + (pl.status ? status(pl.status) : '') + '</td>' +
          '<td class="num">' + ibtn('data-delplan="' + esc(pl.id) + '"', 'trash-2', 'Delete plan', true) + '</td></tr>';
      }).join('');
      var which = state.planStatus || 'active';
      body.innerHTML = '<div class="toolbar"><label class="lbl" for="planstatus">Status</label>' +
          '<select class="n-select fld-sm" id="planstatus">' + statusSel + '</select><span class="grow"></span>' +
          '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="newplan">' + ui('plus', 14) + 'New plan</button></div>' +
        (rows
          ? '<div class="tbl"><table class="n-table"><thead><tr><th>Team member</th><th>Program</th><th>Next due</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
          : empty(which === 'all' ? 'No plans.' : 'No ' + which + ' plans.'));
      document.getElementById('planstatus').addEventListener('change', function () { state.planStatus = this.value; showPlans(); });
      document.getElementById('newplan').addEventListener('click', newPlan);
      bind('[data-member]', 'click', function (el) { state.program = null; showMember(el.getAttribute('data-member')); });
      bind('[data-plan]', 'click', function (el) { showPlan(el.getAttribute('data-plan')); });
      bind('[data-delplan]', 'click', function (el) {
        askConfirm('Delete this plan and its schedule?', { title: 'Delete plan', confirm: 'Delete plan', danger: true }).then(function (ok) {
          if (ok) run('delete_plan', { plan_id: el.getAttribute('data-delplan') }).then(showPlans).catch(fail);
        });
      });
    }).catch(fail);
  }

  // The instance a plan is for: its variant(s) and venue. A program with a
  // venue-sourced variant takes the venue from that variant, so no separate
  // venue picker (Orbit's create dialog). "No venue" files the plan
  // group-wide (sent as venue_id "", storage's explicit group-wide).
  function planInstance(program) {
    var groups = ((program && program.variants) || []).filter(function (g) { return g && g.id; });
    var here = (ctx && ctx.venueId) || '';
    var fromVariant = groups.some(function (g) { return g.source === 'venue'; });
    var html = groups.map(function (g) {
      var opts = g.source === 'venue'
        ? venueOptions(here)
        : '<option value="">Not set</option>' + (g.options || []).map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.name) + '</option>'; }).join('');
      return '<div class="field"><label>' + esc(g.name || 'Variant') + '</label>' +
        '<select class="n-select" data-vg="' + esc(g.id) + '" data-vgsrc="' + esc(g.source || '') + '" style="flex:1">' + opts + '</select></div>';
    }).join('');
    if (!fromVariant) html += '<div class="field"><label for="np-venue">Venue (optional)</label><select class="n-select" id="np-venue" style="flex:1"><option value="">No venue (group-wide)</option>' + venueOptions(here) + '</select></div>';
    return {
      html: html,
      selection: function () {
        var idParts = [], nameParts = [], venueId = null;
        modalHost.querySelectorAll('[data-vg]').forEach(function (sel) {
          if (!sel.value) return;
          var gid = sel.getAttribute('data-vg');
          idParts.push(gid + ':' + sel.value);
          if (sel.getAttribute('data-vgsrc') === 'venue') venueId = sel.value;
          else nameParts.push(sel.options[sel.selectedIndex].text);
        });
        var v = modalHost.querySelector('#np-venue');
        if (v) venueId = v.value;  // "" = group-wide, deliberately
        return { variant_id: idParts.join('|') || null, variant_name: nameParts.join(' · ') || null, venue_id: venueId };
      },
    };
  }
  function newPlan() {
    var progs = (state.planPrograms || []);
    if (!progs.length) { notify('Create a plan-led program first (tick "Plan-led").', { title: 'No plan-led programs yet' }); return; }
    run('people').then(function (pd) {
      var everyone = (pd.people || []).filter(function (p) { return p.is_active; });
      var pplOpts = everyone.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
      var progOpts = progs.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
      modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">New training plan</h2></div>' +
        '<div class="field"><label for="np-person">Team member</label><select class="n-select" id="np-person" style="flex:1">' + pplOpts + '</select></div>' +
        '<div class="field"><label for="np-prog">Program</label><select class="n-select" id="np-prog" style="flex:1">' + progOpts + '</select></div>' +
        '<div id="np-inst"></div><div class="err" id="np-err"></div>' +
        foot('<button type="button" class="n-btn n-btn--secondary" id="np-cancel">Cancel</button>' +
          '<button type="button" class="n-btn n-btn--primary" id="np-create">Create &amp; schedule</button>'));
      var inst = null;
      function program() { var id = document.getElementById('np-prog').value; return progs.filter(function (p) { return p.id === id; })[0]; }
      function drawInst() { inst = planInstance(program()); document.getElementById('np-inst').innerHTML = inst.html; }
      drawInst();
      document.getElementById('np-prog').addEventListener('change', drawInst);
      document.getElementById('np-cancel').addEventListener('click', closeModal);
      document.getElementById('np-create').addEventListener('click', function () {
        var sel = inst.selection();
        run('create_plan', { person_id: document.getElementById('np-person').value, program_id: document.getElementById('np-prog').value,
          variant_id: sel.variant_id, variant_name: sel.variant_name, venue_id: sel.venue_id })
          .then(function (r) { closeModal(); showPlan(r.plan.id); })
          .catch(function (e) { document.getElementById('np-err').textContent = e.message; });
      });
    }).catch(fail);
  }

  function progBadge(pr) {
    if (!pr) return '';
    return '<span class="prog-badge">' + badge(pr.label, pr.tone) + (pr.at ? '<span class="hint">' + esc(fmtDay(pr.at)) + '</span>' : '') + '</span>';
  }
  function showPlan(planId) {
    loading();
    run('plan', { plan_id: planId })
      .then(function (d) {
        var pl = d.plan, st = pl.status || 'active';
        var mods = {}; (d.modules || []).forEach(function (m) { mods[m.id] = m; });
        var lastMod = null;
        var rows = (d.sections || []).map(function (s) {
          var done = s.status === 'completed';
          var head = '';
          if (s.module_id !== lastMod) {
            lastMod = s.module_id;
            var m = mods[s.module_id] || { name: s.module };
            head = '<tr class="mod-row"><td colspan="5"><span class="prog-badge">' + esc(m.name || 'Module') + progBadge(m.progress) + '</span></td></tr>';
          }
          // A section can only be ticked off once it has been scheduled (that
          // is when it gets a plan_section_id to hang the status on).
          var toggle = s.plan_section_id
            ? '<button type="button" class="n-btn n-btn--secondary n-btn--sm" data-pstatus="' + esc(s.plan_section_id) +
                '" data-to="' + (done ? 'pending' : 'completed') + '">' + (done ? 'Undo' : ui('check', 14) + 'Done') + '</button>'
            : '<span class="hint">Schedule first</span>';
          return head + '<tr><td>' + esc(s.name) + '<span class="inst">' + esc(sectionLabel(s.section_type || '')) + '</span>' +
              '<div style="margin-top:4px">' + progBadge(s.progress) + '</div></td>' +
            '<td><input type="date" class="n-input fld-sm" data-due="' + esc(s.section_id) + '" value="' + esc(s.due_date || '') + '" aria-label="Date"></td>' +
            '<td><input type="time" class="n-input fld-sm" data-time="' + esc(s.section_id) + '" value="' + esc(s.start_time || '') + '" style="width:110px" aria-label="Time"></td>' +
            '<td>' + status(s.status) + '</td>' +
            '<td class="num nowrap"><span class="cell-actions"><button type="button" class="n-btn n-btn--secondary n-btn--sm" data-sched="' + esc(s.section_id) + '">Save</button>' + toggle + '</span></td></tr>';
        }).join('');
        var planAction = st === 'completed'
          ? badge('Completed', 'ok') + '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="plan-reopen">Reopen</button>'
          : (st === 'cancelled'
            ? badge('Cancelled') + '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="plan-reopen">Reactivate</button>'
            : '<button type="button" class="n-btn n-btn--danger n-btn--sm" id="plan-cancel">Cancel plan</button>' +
              '<button type="button" class="n-btn n-btn--primary n-btn--sm" id="plan-complete">Mark plan complete</button>');
        var venueCtl = pl.venue_from_variant
          ? '<span class="sub">Venue: ' + esc(venueName(pl.venue_id) || '—') + ' (from the variant)</span>'
          : '<span class="filter"><label class="lbl" for="plan-venue">Venue</label><select class="n-select fld-sm" id="plan-venue">' +
              '<option value=""' + (pl.venue_id ? '' : ' selected') + '>No venue (group-wide)</option>' + venueOptions(pl.venue_id || '') + '</select></span>';
        body.innerHTML = '<button type="button" class="back" id="back">' + ui('arrow-left', 14) + 'All plans</button>' +
          '<div class="title-row"><h2 class="title">' + esc(pl.program || 'Plan') + '</h2><span class="title-actions">' + planAction + '</span></div>' +
          '<div class="rv-meta">' + (pl.person_name ? '<button type="button" class="link" id="plan-person">' + esc(pl.person_name) + '</button>' : '') +
            (pl.variant_name ? ' · ' + esc(pl.variant_name) : '') + '</div>' +
          '<div class="toolbar" style="margin-top:12px">' + venueCtl + '<span class="hint">' + (pl.assignment_id ? 'Progress comes from their enrolment on this instance.' : 'No enrolment on this instance yet, so no progress to show.') + '</span></div>' +
          (rows
            ? '<section class="n-card panel" style="margin-top:4px"><div class="tbl"><table class="n-table"><thead><tr><th>Section</th><th>Date</th><th>Time</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>'
            : empty('This program has no sections to schedule.'));
        document.getElementById('back').addEventListener('click', function () { view = 'plans'; render(); });
        var pp = document.getElementById('plan-person');
        if (pp) pp.addEventListener('click', function () { state.program = null; showMember(pl.person_id); });
        var pv = document.getElementById('plan-venue');
        if (pv) pv.addEventListener('change', function () {
          run('set_plan_venue', { plan_id: planId, venue_id: pv.value || null })
            .then(function (r) { toast('Venue changed' + (r.moved_assignments ? ' — their enrolment moved with it' : '')); showPlan(planId); })
            .catch(function (e) { oops(e); showPlan(planId); });
        });
        bind('[data-sched]', 'click', function (el) {
          var sid = el.getAttribute('data-sched');
          run('schedule_section', { plan_id: planId, section_id: sid,
            due_date: q('[data-due="' + sid + '"]').value || null,
            start_time: q('[data-time="' + sid + '"]').value || null })
            .then(function () { showPlan(planId); }).catch(fail);
        });
        bind('[data-pstatus]', 'click', function (el) {
          run('set_plan_section_status', { plan_section_id: el.getAttribute('data-pstatus'), status: el.getAttribute('data-to') })
            .then(function () { showPlan(planId); }).catch(fail);
        });
        function setPlan(status, thenPlans) {
          run('set_plan_status', { plan_id: planId, status: status })
            .then(function () { if (thenPlans) { view = 'plans'; render(); } else showPlan(planId); }).catch(fail);
        }
        var pc = document.getElementById('plan-complete');
        if (pc) pc.addEventListener('click', function () { setPlan('completed'); });
        var pr = document.getElementById('plan-reopen');
        if (pr) pr.addEventListener('click', function () { setPlan('active'); });
        var px = document.getElementById('plan-cancel');
        if (px) px.addEventListener('click', function () {
          askConfirm('Cancel this plan? It drops off the active tracker.', { title: 'Cancel plan', confirm: 'Cancel plan', cancel: 'Keep plan', danger: true })
            .then(function (ok) { if (ok) setPlan('cancelled', true); });
        });
      }).catch(fail);
  }

  // ---- Tracker -----------------------------------------------------------
  function showTracker() {
    loading();
    run('tracker').then(function (d) {
      var cols = d.columns || [], rows = d.rows || [];
      state.tracker = d;
      if (!rows.length) { body.innerHTML = empty('Nobody is enrolled on a training program yet.'); return; }
      var venues = (ctx && ctx.venues) || [];
      var venueSel = '<option value="">All venues</option>' + venues.map(function (v) { return '<option value="' + esc(v.id) + '"' + (state.trkVenue === v.id ? ' selected' : '') + '>' + esc(v.name) + '</option>'; }).join('');
      var progSel = '<option value="">All programs</option>' + cols.map(function (c) { return '<option value="' + esc(c.id) + '"' + (state.trkProg === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
      // filter columns/rows
      var showCols = cols.filter(function (c) { return !state.trkProg || c.id === state.trkProg; });
      var colIdx = {}; cols.forEach(function (c, i) { colIdx[c.id] = i; });
      var visRows = rows.filter(function (r) {
        if (!state.trkVenue) return true;
        // a row shows if any of its cells is at that venue (instance) or the person is at it
        return r.cells.some(function (cell) { return (cell || []).some(function (e) { return e.venue_id === state.trkVenue; }); }) ||
          (r.person.venues || []).indexOf(state.trkVenue) >= 0;
      });
      var head = '<tr><th class="person">Team member</th>' + showCols.map(function (c) { return '<th class="mid">' + esc(c.name) + '</th>'; }).join('') + '</tr>';
      var trs = visRows.map(function (r) {
        return '<tr><td class="person"><button type="button" class="link" data-member="' + esc(r.person.id) + '">' + esc(r.person.name) + '</button>' +
          (r.person.role ? '<span class="inst">' + esc(r.person.role) + '</span>' : '') + '</td>' +
          showCols.map(function (c) {
            var entries = r.cells[colIdx[c.id]] || [];
            if (!entries.length) return '<td class="mid"><span class="dash">—</span></td>';
            return '<td class="mid">' + entries.map(function (e) {
              var b = e.status === 'complete' ? badge('Complete', 'ok')
                : (e.status === 'progress' ? badge(e.label || 'In progress', 'warn', e.label || '') : '<span class="dash">—</span>');
              return '<div class="cell">' + (e.instance ? '<span class="inst">' + esc(e.instance) + '</span>' : '') + b + '</div>';
            }).join('') + '</td>';
          }).join('') + '</tr>';
      }).join('');
      body.innerHTML = '<div class="toolbar">' +
          '<span class="filter"><label class="lbl" for="trkvenue">Venue</label><select class="n-select fld-sm" id="trkvenue">' + venueSel + '</select></span>' +
          '<span class="filter"><label class="lbl" for="trkprog">Program</label><select class="n-select fld-sm" id="trkprog">' + progSel + '</select></span>' +
          ((state.trkVenue || state.trkProg) ? '<button type="button" class="n-btn n-btn--quiet n-btn--sm" id="trkclear">Clear</button>' : '') +
          '<span class="grow"></span><button type="button" class="n-btn n-btn--secondary n-btn--sm" id="trkprint">' + ui('printer', 14) + 'Print</button></div>' +
        '<div class="n-card matrix" id="trkmatrix"><table class="n-table"><thead>' + head + '</thead><tbody>' + trs + '</tbody></table></div>' +
        '<div class="hint foot-note">One badge per enrolment — a person trained on two variants shows two. ' + visRows.length + ' of ' + rows.length + ' people shown.</div>';
      document.getElementById('trkvenue').addEventListener('change', function () { state.trkVenue = this.value; showTracker(); });
      document.getElementById('trkprog').addEventListener('change', function () { state.trkProg = this.value; showTracker(); });
      var clr = document.getElementById('trkclear'); if (clr) clr.addEventListener('click', function () { state.trkVenue = ''; state.trkProg = ''; showTracker(); });
      document.getElementById('trkprint').addEventListener('click', function () { window.print(); });
      bind('[data-member]', 'click', function (el) { state.program = null; showMember(el.getAttribute('data-member')); });
    }).catch(fail);
  }

  // ---- Sign-off queue ----------------------------------------------------
  function showSignoffs() {
    loading();
    run('signoffs').then(function (d) {
      var rows = d.pending || [];
      if (!rows.length) { body.innerHTML = empty('Nothing awaiting sign-off.'); return; }
      body.innerHTML = '<p class="intro">' + rows.length + ' item' + (rows.length === 1 ? '' : 's') + ' a trainee has submitted, waiting for a manager to accept.</p>' +
        '<div class="n-card">' + rows.map(function (r) {
          var files = (r.files || []).map(function (f) {
            return '<button type="button" class="n-btn n-btn--secondary n-btn--sm" data-viewfile="' + esc(f.id) + '" data-fct="' + esc(f.content_type || '') + '" data-fn="' + esc(f.filename || 'file') + '">' +
              ui('paperclip', 14) + '<span class="fname">' + esc(f.filename || 'evidence') + '</span></button>';
          }).join('') || '<span class="hint">No files attached</span>';
          return '<div class="list-row"><div class="grow">' +
            '<div class="name">' + esc(r.person) + '</div>' +
            '<div class="sub">' + esc(r.program || '') + ' · ' + esc(r.item || '') + '</div>' +
            '<div class="files">' + files + '</div></div>' +
            '<div class="row-actions">' +
              '<button type="button" class="n-btn n-btn--secondary n-btn--sm" data-reject="' + esc(r.completion_id) + '">Reject</button>' +
              '<button type="button" class="n-btn n-btn--primary n-btn--sm" data-approve="' + esc(r.completion_id) + '">' + ui('check', 14) + 'Approve</button>' +
            '</div></div>';
        }).join('') + '</div>';
      bind('[data-approve]', 'click', function (el) { run('sign_off', { completion_id: el.getAttribute('data-approve') }).then(showSignoffs).catch(fail); });
      bind('[data-reject]', 'click', function (el) {
        askText('Reason for sending it back (the trainee sees this)', '', { title: 'Send it back', confirm: 'Send back', multiline: true })
          .then(function (notes) {
            if (notes === null) return;
            run('reject_signoff', { completion_id: el.getAttribute('data-reject'), notes: notes || null }).then(showSignoffs).catch(fail);
          });
      });
      bind('[data-viewfile]', 'click', function (el) {

  // Pull the on-screen field values back into the working model, so an add or
  // remove elsewhere on the form doesn't discard in-progress edits.
  function readFwInputs() {
    (state.fwCats || []).forEach(function (cat, ci) {
      var cn = document.getElementById('cat-' + ci); if (cn) cat.name = cn.value;
      (cat.capabilities || []).forEach(function (cap, ki) {
        var pn = document.getElementById('cap-' + ci + '-' + ki); if (pn) cap.name = pn.value;
        var l1 = document.getElementById('l1-' + ci + '-' + ki); if (l1) cap.level1_descriptor = l1.value;
        var l2 = document.getElementById('l2-' + ci + '-' + ki); if (l2) cap.level2_descriptor = l2.value;
        var l3 = document.getElementById('l3-' + ci + '-' + ki); if (l3) cap.level3_descriptor = l3.value;
      });
    });
  }

          '<div class="lvl-row"><label class="lvl-tag" for="l1-' + ci + '-' + ki + '">Developing</label>' +

      return '<div class="cat"><div class="cat-head"><input type="text" class="n-input" id="cat-' + ci + '" value="' + esc(cat.name || '') + '" placeholder="Category" style="flex:1;font-weight:600" aria-label="Category">' +

        (f.is_active === false ? badge('Inactive') : badge('Active', 'ok')) + '</div>' +
      '<section class="n-card panel"><div class="panel-head"><h2>Details</h2></div><div class="panel-body form">' +
        '<div class="field"><label for="fw-name">Name</label><input type="text" class="n-input" id="fw-name" style="flex:1" value="' + esc(f.name || '') + '"></div>' +
        '<div class="field"><label for="fw-role">Role label</label><input type="text" class="n-input" id="fw-role" style="flex:1" value="' + esc(f.role_label || '') + '"></div>' +

      '</div></section>' +
      '<section class="n-card panel"><div class="panel-head"><h2>Categories &amp; capabilities</h2><span class="grow"></span>' +

        '<div class="panel-body"><div class="tree">' + (catsHtml || '<div class="none">No categories yet — add one.</div>') + '</div></div></section>' +

      state.fwCats[ci].capabilities.push({ name: 'New capability' }); renderFramework(fid);
    });

  // ---- Small shared helpers for the newer screens --------------------------
  function fmtDay(iso) {
    if (!iso) return '';
    var s = String(iso);
    var d = new Date(s.length <= 10 ? s + 'T00:00:00' : s);
    if (isNaN(d.getTime())) return s.slice(0, 10);
    return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtStamp(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function oops(e) { notify(e && e.message ? e.message : String(e), { title: 'That didn’t work' }); }
  function venueName(id) {
    var v = ((ctx && ctx.venues) || []).filter(function (x) { return x.id === id; })[0];
    return v ? v.name : '';
  }
  function venueOptions(selected, blankLabel) {
    return (blankLabel != null ? '<option value="">' + esc(blankLabel) + '</option>' : '') +
      ((ctx && ctx.venues) || []).map(function (v) {
        return '<option value="' + esc(v.id) + '"' + (v.id === selected ? ' selected' : '') + '>' + esc(v.name) + '</option>';
      }).join('');
  }
  // A sandboxed frame for stored email HTML: no scripts, ever.
  function mailFrame(html) {
    return '<iframe class="mailframe" sandbox="" title="Email preview" srcdoc="' + esc(html || '') + '"></iframe>';
  }
  // A multi-select filter: a button opening a list of checkboxes.
  function multiFilter(id, labelText, options, selected) {
    var n = selected.length;
    return '<span class="mf"><button type="button" class="n-btn n-btn--secondary n-btn--sm" data-mf="' + id + '" aria-expanded="false">' +
      esc(labelText) + (n ? ' <span class="n-badge n-badge--info">' + n + '</span>' : '') + '</button>' +
      '<span class="mf-panel" id="mf-' + id + '" hidden>' + (options.length ? options.map(function (o) {
        return '<label><input type="checkbox" data-mfopt="' + id + '" value="' + esc(o.value) + '"' + (selected.indexOf(o.value) >= 0 ? ' checked' : '') + '>' + esc(o.label) + '</label>';
      }).join('') : '<span class="hint" style="padding:6px 8px;display:block">Nothing to filter by</span>') + '</span></span>';
  }
  function bindMultiFilters(onChange) {
    bind('[data-mf]', 'click', function (el) {
      var panel = document.getElementById('mf-' + el.getAttribute('data-mf'));
      var open = panel.hidden;
      body.querySelectorAll('.mf-panel').forEach(function (p) { p.hidden = true; });
      body.querySelectorAll('[data-mf]').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });
      panel.hidden = !open; el.setAttribute('aria-expanded', String(open));
    });
    bind('[data-mfopt]', 'change', function (el) {
      var id = el.getAttribute('data-mfopt');
      var vals = Array.prototype.slice.call(body.querySelectorAll('[data-mfopt="' + id + '"]:checked')).map(function (x) { return x.value; });
      onChange(id, vals);
    });
  }
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest || ev.target.closest('.mf')) return;
    document.querySelectorAll('.mf-panel').forEach(function (p) { p.hidden = true; });
  });

  function roleName(r) { return (ROLE_OPTIONS.filter(function (o) { return o.value === r; })[0] || ROLE_OPTIONS[0]).label; }

      if (page === 'reviews') showAllReviews();
      else if (page === 'review_cycles') showCycles();
      else if (page === 'review_emails') showReviewEmails();
      else showMyTeam();

  function rvTone(labelText) {

        }).join('');
        return '<tr class="' + (del ? 'muted-row' : '') + '"><td>' +
            (del ? esc(r.person_name) : '<button type="button" class="link name" data-aropen="' + esc(r.id) + '">' + esc(r.person_name) + '</button>') +
            (del ? ' ' + badge((r.withdrawn ? 'Withdrawn ' : 'Deleted ') + fmtDay(r.deleted_at) + (r.deleted_by_name ? ' by ' + r.deleted_by_name : '')) : '') + '</td>' +
          '<td><select class="n-select fld-sm" data-armgr="' + esc(r.id) + '" aria-label="Manager for ' + esc(r.person_name) + '"' + (del ? ' disabled' : '') + '>' + mOpts + '</select></td>' +

    var byId = {}; (d.reviews || []).forEach(function (r) { byId[r.id] = r; });
    host.querySelectorAll('[data-aropen]').forEach(function (el) { el.addEventListener('click', function () { showReview(el.getAttribute('data-aropen'), 'admin', 'reviews'); }); });
    host.querySelectorAll('[data-armgr]').forEach(function (el) {

  }
  function qaSelect(id, q, options, v) {

  }

    return '<div class="rating-read"><div class="rating-name">' + v + '. ' + esc(o.label) + '</div><div class="rating-desc">' + esc(o.description) + '</div></div>';
  }
  function ratingPick(v) {
    return '<div class="ratings" role="radiogroup" aria-label="Overall rating">' + RATINGS.map(function (o) {
      var on = v === o.value;

  function payDiff() {
    var rv = state.rv, rate = rv.d.current_rate, pay = rv.pay;
    if (pay.none) return 'Proposing no change to the current rate.';
    if (!rate || rate.rate == null || String(pay.proposed).trim() === '' || !isFinite(Number(pay.proposed))) return '';
    var n = Number(pay.proposed), c = Number(rate.rate);
    if (n === c) return 'Same as current rate.';
    return (n > c ? 'Increase' : 'Decrease') + ' of $' + Math.abs(n - c).toFixed(2) + (c ? ' (' + (((n - c) / c) * 100).toFixed(1) + '%)' : '');
  }

  function cadenceText(c) {

  // `times` steps from `iso` (counted from the first date, so a cycle on the

    var host = document.getElementById('pp-list');
    if (!rows.length) { host.innerHTML = empty('Nobody here.', state.ppRoles.length || state.ppVenues.length || q ? 'Try clearing the filters.' : ''); return; }
    host.innerHTML = '<div class="tbl"><table class="n-table"><thead><tr><th>Name</th><th>Role</th><th>Venues</th><th>Manager</th><th><span class="sr">Actions</span></th></tr></thead><tbody>' +
      rows.map(function (p) {
        return '<tr><td><button type="button" class="link name" data-ppedit="' + esc(p.id) + '">' + esc(p.name || '(no name)') + '</button>' +
            (p.email ? '<span class="inst">' + esc(p.email) + '</span>' : '') + '</td>' +
          '<td>' + esc(roleName(p.role)) + (p.loadedhub_role ? '<span class="inst">' + esc(p.loadedhub_role) + '</span>' : '') + '</td>' +
          '<td class="sub">' + esc((p.venues || []).map(venueName).filter(Boolean).join(', ') || '—') + '</td>' +
          '<td class="sub">' + esc(p.manager_name || '—') + '</td>' +
          '<td class="num nowrap"><button type="button" class="n-btn n-btn--quiet n-btn--sm" data-pptrain="' + esc(p.id) + '">Training</button></td></tr>';
      }).join('') + '</tbody></table></div><div class="hint foot-note">' + rows.length + ' shown.</div>';
    var byId = {}; (d.people || []).forEach(function (p) { byId[p.id] = p; });
    host.querySelectorAll('[data-ppedit]').forEach(function (el) { el.addEventListener('click', function () { personEditor(byId[el.getAttribute('data-ppedit')]); }); });
    host.querySelectorAll('[data-pptrain]').forEach(function (el) { el.addEventListener('click', function () { state.program = null; showMember(el.getAttribute('data-pptrain')); }); });
  }
  function personEditor(p) {
    var d = state.pp, can = d.can_set_manager;
    var mgrs = (d.managers || []).filter(function (m) { return !p || m.id !== p.id; });
    var cur = p && p.manager_id;
    var mOpts = '<option value="">No manager</option>' + mgrs.filter(function (m) { return !m.inactive || m.id === cur; }).map(function (m) {
      return '<option value="' + esc(m.id) + '"' + (m.id === cur ? ' selected' : '') + '>' + esc(m.name) + (m.inactive ? ' (inactive)' : '') + '</option>';
    }).join('');
    if (cur && !mgrs.some(function (m) { return m.id === cur; })) mOpts += '<option value="' + esc(cur) + '" selected>' + esc(p.manager_name || 'Current manager') + '</option>';
    var venues = (ctx && ctx.venues) || [], mine = (p && p.venues) || [];
    modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">' + (p ? esc(p.name) : 'New person') + '</h2>' + (p && p.from_orbit ? badge('From Orbit') : '') + '</div>' +
      '<div class="field"><label for="pe-name">Name</label><input type="text" class="n-input" id="pe-name" style="flex:1" value="' + esc((p && p.name) || '') + '"></div>' +
      '<div class="field"><label for="pe-email">Email</label><input type="email" class="n-input" id="pe-email" style="flex:1" value="' + esc((p && p.email) || '') + '"></div>' +
      '<div class="field"><label for="pe-role">Role</label><select class="n-select" id="pe-role">' + ROLE_OPTIONS.map(function (o) {
        return '<option value="' + o.value + '"' + (((p && p.role) || 'team_member') === o.value ? ' selected' : '') + '>' + o.label + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="pe-mgr">Manager</label><select class="n-select" id="pe-mgr" style="flex:1"' + (can ? '' : ' disabled') + '>' + mOpts + '</select></div>' +
      '<div class="hint" style="margin:-4px 0 8px">' + (can ? 'The manager responsible for this team member — they complete their performance review.' : 'Only an HR admin can change someone’s manager — it decides who sees their performance review.') + '</div>' +
      (venues.length ? '<div class="lbl">Venues</div><div class="pick" style="max-height:160px">' + venues.map(function (v) {
        return '<label><input type="checkbox" data-pev="' + esc(v.id) + '"' + (mine.indexOf(v.id) >= 0 ? ' checked' : '') + '><span class="grow">' + esc(v.name) + '</span></label>'; }).join('') + '</div>' : '') +
      '<div class="field field--inline" style="margin-top:12px"><label for="pe-active">Active</label><input type="checkbox" id="pe-active"' + (!p || p.is_active ? ' checked' : '') + '><span class="hint">untick when they leave</span></div>' +
      '<div class="err" id="pe-err"></div>' +
      foot('<button type="button" class="n-btn n-btn--secondary" id="pe-cancel">Cancel</button><button type="button" class="n-btn n-btn--primary" id="pe-save">Save</button>'));
    modalHost.querySelector('#pe-cancel').addEventListener('click', closeModal);
    modalHost.querySelector('#pe-save').addEventListener('click', function () {
      var fields = {
        name: modalHost.querySelector('#pe-name').value, email: modalHost.querySelector('#pe-email').value,
        role: modalHost.querySelector('#pe-role').value, is_active: modalHost.querySelector('#pe-active').checked,
        venues: Array.prototype.slice.call(modalHost.querySelectorAll('[data-pev]:checked')).map(function (x) { return x.getAttribute('data-pev'); }),
      };
      if (can) fields.manager_id = modalHost.querySelector('#pe-mgr').value || null;
      run('save_person', { person_id: p ? p.id : null, fields: fields })
        .then(function () { closeModal(); toast('Saved'); showPeople(); })
        .catch(function (e) { modalHost.querySelector('#pe-err').textContent = e.message; });
    });
  }

  function render() {
    closeModal();
    selectTab(view);
    if (view === 'tracker') showTracker();
    else if (view === 'plans') showPlans();
    else if (view === 'signoffs') showSignoffs();
    else if (view === 'frameworks') showFrameworks();
    else if (view === 'people') showPeople();
    else if (isReviewView(view)) showReviewsPage(view);
    else showPrograms();
  }

  document.getElementById('newprog').addEventListener('click', function () {
    askText('Name', '', { title: 'New training program', placeholder: 'e.g. Barista basics', confirm: 'Create program', required: true })
      .then(function (name) {
        if (!name || !name.trim()) return;
        run('save_program', { fields: { name: name.trim(), is_active: true } })
          .then(function (r) { showProgram(r.program.id); }).catch(fail);
      });
  });
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      view = t.getAttribute('data-view');
      // The Reviews tab reopens whichever reviews page was last in use.
      if (view === 'my_team_reviews' && state.reviewsPage) view = state.reviewsPage;
      render();
    });
  });

  // The reviews pages all live under the one Reviews tab.
  function selectTab(v) {
    view = v;
    var tab = isReviewView(v) ? 'my_team_reviews' : v;
    document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x.getAttribute('data-view') === tab)); });
    // "New program" is the Programs tab's own action.
    document.getElementById('newprog').hidden = tab !== 'programs';
  }

  // Where Norm asked us to open — this component's inputs (view, program,
  // person; ids or names). They ride every init, so only the FIRST one acts
  // on them: a venue switch must not yank the user back.
  var started = false;
  var VIEWS = ['programs', 'plans', 'signoffs', 'tracker', 'people', 'frameworks', 'my_team_reviews', 'reviews', 'review_cycles', 'review_emails'];
  function start(c) {
    var ins = c.inputs || {};
    if (VIEWS.indexOf(ins.view) >= 0) selectTab(ins.view);
    if (!ins.program && !ins.person && !ins.review) return false;
    loading();
    run('locate', { program: ins.program || null, person: ins.person || null, review: ins.review || null }).then(function (r) {
      if (r.review_id) {
        // From an email: as its manager when that's you, else as an admin.
        if (!isReviewView(view)) selectTab('my_team_reviews');
        showReview(r.review_id, null, view === 'reviews' ? 'reviews' : 'my_team_reviews');
      } else if (r.person_id) { selectTab('tracker'); showMember(r.person_id); }
      else if (r.program_id) showProgram(r.program_id);
      else render();
    }).catch(fail);
    return true;
  }

  norm.onReady(function (c) {
    ctx = c;
    var v = (c.venues || []).find(function (x) { return x.id === c.venueId; });
    document.getElementById('scope').textContent =
      'Group-wide programs and ' + (v ? v.name : 'all venues') + (c.app && c.app.version ? ' · v' + c.app.version : '');
    if (!started) {
      started = true;
      loadSync();
      loadBadge();
      if (start(c)) return;
    }
    render();
  });
})();
</script>
