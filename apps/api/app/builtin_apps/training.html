<style>
  /* Norm Training.
     Styled by its host (AppRunner → hostStyles.ts): the --norm-* tokens, the
     element defaults and the opt-in .n-* classes (buttons, badges, tables,
     tabs, fields, cards) all come from there, and the body carries the page
     gutter — so nothing here frames, centres or pads the app. */

  /* Our own title shows only outside Norm: the host draws the app's title.
     The scope line (which venue, which version) stays — the host doesn't say it. */
  .app-head { margin: 12px 0 8px; }
  .app-head h1 { margin: 0; font-size: var(--norm-fs-xl); font-weight: 700; letter-spacing: -0.01em; }
  html[data-norm-variant] .app-head h1 { display: none; }
  html[data-norm-variant] .app-head { margin: 0 0 4px; }

  /* Tabs on the left, the one primary action on the right, one rule under both. */
  .bar { display: flex; align-items: flex-end; gap: 16px; box-shadow: inset 0 -1px 0 var(--norm-line); }
  .bar .n-tabs { flex: 0 1 auto; min-width: 0; gap: 24px; box-shadow: none; }
  .bar .n-tab { padding: 10px 2px; }
  .n-tab:focus-visible { outline-offset: -2px; }
  .bar > .n-btn { flex: 0 0 auto; align-self: center; margin: 0 0 8px auto; }
  .bar > .n-btn[hidden] { display: none; }
  #body { padding-top: 16px; }

  /* ---- Small parts ---- */
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .sub, .hint, .none { font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .none { padding: 4px 0; }
  .inst { display: block; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .dash { color: var(--norm-muted-soft); }
  .nowrap { white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .err { margin-top: 8px; font-size: var(--norm-fs-sm); color: var(--norm-error); }
  .err:empty { display: none; }
  .saved { font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-ok); }
  .i { display: inline-block; flex: 0 0 auto; vertical-align: middle; }
  .link { padding: 0; border: none; background: none; font: inherit; color: var(--norm-accent); text-align: left; cursor: pointer; }
  .link:hover { color: var(--norm-accent-strong); text-decoration: underline; text-underline-offset: 2px; }
  .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 2px 0; border: none; background: none;
          font: inherit; font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); cursor: pointer; }
  .back:hover { color: var(--norm-text); }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
          border: none; border-radius: var(--norm-radius); background: transparent; color: var(--norm-icon); cursor: pointer; }
  .ibtn:hover { background: var(--norm-surface-alt); color: var(--norm-text); }
  .ibtn--danger:hover { background: var(--norm-error-bg); color: var(--norm-error); }
  .ibtn-gap { flex: 0 0 auto; width: 28px; }
  @media (pointer: coarse) { .ibtn, .ibtn-gap { width: 36px; height: 36px; } }
  .fld-sm { height: 30px; font-size: var(--norm-fs-sm); }
  @media (pointer: coarse) { .fld-sm { height: 40px; } }
  input[type=checkbox] { flex: 0 0 auto; width: 16px; height: 16px; margin: 0; accent-color: var(--norm-accent); cursor: pointer; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft);
           white-space: nowrap; cursor: pointer; }
  .tile { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
          border-radius: var(--norm-radius); background: var(--norm-surface-alt); color: var(--norm-text-soft); }
  .avatar { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
            border-radius: 50%; background: var(--norm-selected); color: var(--norm-accent-strong); font-size: var(--norm-fs-sm); font-weight: 600; }

  /* ---- Loading, empty, error ---- */
  .state { padding: 40px 16px; text-align: center; color: var(--norm-muted); }
  .state-title { font-weight: 500; color: var(--norm-text-soft); }
  .state-detail { margin-top: 4px; font-size: var(--norm-fs-sm); }
  .spin { display: flex; width: 18px; height: 18px; margin: 0 auto 8px; color: var(--norm-icon); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--norm-radius);
           background: var(--norm-error-bg); color: var(--norm-error); }
  .alert .i { margin-top: 2px; }
  .alert-title { font-weight: 600; }
  .alert-detail { margin-top: 2px; font-size: var(--norm-fs-sm); }

  /* ---- Programs and frameworks: a table on the page, cards on a phone ---- */
  .ltable .c-main { width: 100%; max-width: 0; }
  .prog { display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
  .prog-text { min-width: 0; }
  .prog .meta { font-size: var(--norm-fs-xs); color: var(--norm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-only { display: none; }
  .meter { display: flex; align-items: center; gap: 10px; }
  .track { flex: 0 0 auto; width: 120px; height: 6px; border-radius: 3px; background: var(--norm-line-soft); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 3px; background: var(--norm-brand); }
  .pct { min-width: 4ch; font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }
  @media (max-width: 640px) {
    .ltable thead { display: none; }
    .ltable, .ltable tbody { display: block; }
    .ltable tbody tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px 12px;
                       margin-bottom: 10px; padding: 12px 14px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius-lg);
                       background: var(--norm-bg); }
    .ltable tbody td { display: block; padding: 0; border: none; background: none; }
    /* A tap leaves :hover on a card; the table's row hover must not paint it. */
    .ltable.n-table tbody tr:hover > td { background: none; }
    .ltable .c-main { grid-column: 1 / 3; grid-row: 1; width: auto; max-width: none; }
    .ltable .c-act { grid-column: 3; grid-row: 1; }
    .ltable .c-desk { display: none; }
    .ltable .c-status { grid-column: 1; grid-row: 2; }
    .ltable.progs .c-status { padding-left: 44px; }
    .ltable .c-wide { grid-column: 2 / 4; grid-row: 2; }
    .ltable .m-only { display: block; }
    .ltable .track { flex: 1 1 auto; width: auto; }
  }

  /* ---- Detail views: sections as cards ---- */
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .title-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .title { margin: 0; font-size: var(--norm-fs-lg); font-weight: 600; }
  .panel { margin-top: 16px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--norm-line); }
  .panel-head h2 { margin: 0; font-size: var(--norm-fs-md); font-weight: 600; }
  .panel-body { padding: 12px 16px; }
  .panel-body.form { max-width: 760px; }
  .panel-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--norm-line-soft); }
  .tbl { overflow-x: auto; }
  /* On a narrow screen the table scrolls sideways rather than crushing its first column. */
  .tbl .n-table td:first-child { min-width: 120px; }
  .n-card .n-table tbody tr:last-child > td { border-bottom: none; }
  .n-card .n-table th:first-child, .n-card .n-table td:first-child { padding-left: 16px; }
  .n-card .n-table th:last-child, .n-card .n-table td:last-child { padding-right: 16px; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .lbl { font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); }
  .filter { display: inline-flex; align-items: center; gap: 8px; min-width: 0; margin-right: 8px; }
  .intro { margin: 0 0 12px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }
  .foot-note { margin-top: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .cell-actions { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; }

  /* Form rows: a label column, then the control. */
  .field { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .panel-body > .field:first-child { margin-top: 0; }
  .panel-body > .field:last-child { margin-bottom: 0; }
  .field > label, .field > .lbl { flex: 0 0 120px; font-size: var(--norm-fs-sm); font-weight: 500; color: var(--norm-text-soft); }
  .field > label.inline { flex: 0 0 auto; margin-left: 12px; }
  .field .n-input, .field .n-select { min-width: 0; }
  .stack { margin-top: 12px; }
  .stack .n-input { display: block; width: 100%; }
  @media (max-width: 640px) {
    .field { flex-wrap: wrap; row-gap: 6px; }
    .field > label, .field > .lbl { flex-basis: 100%; }
    .field--inline > label, .field > label.inline { flex-basis: auto; margin-left: 0; }
  }

  /* Program structure: modules → sections → content. */
  .tree { max-width: 880px; }
  .mod { padding: 12px 0; border-top: 1px solid var(--norm-line-soft); }
  .mod:first-child { padding-top: 0; border-top: none; }
  .mod:last-child { padding-bottom: 4px; }
  .modhead, .sec-head, .item, .cap-head, .cat-head, .group-head, .opt-row, .q-head { display: flex; align-items: center; gap: 8px; }
  .idx { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px;
         border-radius: 999px; background: var(--norm-surface-alt); font-size: var(--norm-fs-xs); font-weight: 600; color: var(--norm-text-soft); }
  .mod-name { flex: 1; min-width: 0; font-weight: 500; }
  .ctl { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; }
  .secs { margin: 8px 0 0 12px; padding-left: 20px; border-left: 1px solid var(--norm-line); }
  .sec { padding: 6px 0; }
  .sec-name { flex: 0 1 260px; min-width: 0; }
  .item { min-height: 32px; margin-left: 4px; font-size: var(--norm-fs-sm); }
  .item > .i { color: var(--norm-icon); }
  .item-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .addrow .n-input { flex: 0 1 240px; min-width: 0; }
  @media (max-width: 640px) {
    .modhead, .sec-head { flex-wrap: wrap; }
    .mod-name { flex: 1 1 70%; }
    .secs { margin-left: 4px; padding-left: 12px; }
  }

  /* ---- Dialogs ---- */
  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
           padding: 40px 16px; overflow-y: auto; background: rgba(26, 26, 26, 0.35); }
  .dlg { width: 100%; max-width: 640px; padding: 20px; border-radius: var(--norm-radius-lg); background: var(--norm-bg);
         box-shadow: 0 12px 40px rgba(26, 26, 26, 0.18); }
  .dlg--sm { max-width: 440px; }
  .dlg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .dlg-title { margin: 0; font-size: var(--norm-fs-md); font-weight: 600; }
  .dlg-msg { margin: 8px 0 0; color: var(--norm-text-soft); }
  .dlg-intro { margin: -6px 0 12px; font-size: var(--norm-fs-sm); color: var(--norm-text-soft); }
  .dlg-label { margin-top: 14px; }
  .dlg-input { display: block; width: 100%; }
  .dlg-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  /* A long editor keeps Save in reach: the footer sticks to the foot of the view. */
  .dlg-foot--bar { position: sticky; bottom: -40px; z-index: 2; margin: 20px -20px -20px; padding: 12px 20px;
                   border-top: 1px solid var(--norm-line); border-radius: 0 0 var(--norm-radius-lg) var(--norm-radius-lg);
                   background: var(--norm-bg); }
  .dlg iframe, .dlg video { display: block; max-width: 100%; border: 0; border-radius: var(--norm-radius); }
  .evidence { display: block; max-width: 100%; border-radius: var(--norm-radius); }
  .pick { max-height: 240px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .pick label { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--norm-line-soft); cursor: pointer; }
  .pick label:last-child { border-bottom: none; }
  .pick label:hover { background: var(--norm-surface-alt); }
  .pick .none { padding: 8px 10px; }
  .preview { max-height: 220px; overflow: auto; padding: 10px 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius);
             background: var(--norm-surface); }
  .group, .q-edit, .cat { padding: 12px 0; border-top: 1px solid var(--norm-line-soft); }
  .group:first-child, .q-edit:first-child, .cat:first-child { padding-top: 4px; border-top: none; }
  .group-name { flex: 1; min-width: 0; font-weight: 600; }
  .opt-row, .add-opt, .opt-hint { margin: 6px 0 0 16px; }
  .opt-hint { display: block; }
  .q-num { flex: 0 0 auto; font-size: var(--norm-fs-sm); font-weight: 600; color: var(--norm-text-soft); }
  .q-edit > .n-input { display: block; width: 100%; margin-top: 8px; }
  .ord { flex: 0 0 auto; min-width: 18px; font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .pair-sep { color: var(--norm-icon); }
  .caps { margin: 4px 0 0 12px; }
  .cap { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--norm-line); }
  .lvl-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .lvl-tag { flex: 0 0 84px; font-size: var(--norm-fs-xs); color: var(--norm-muted); }
  .lvl-row .n-input { flex: 1; min-width: 0; }
  /* Inputs sharing a row with buttons may shrink, so nothing is pushed off a phone screen. */
  .cat-head .n-input, .cap-head .n-input, .group-head .n-input, .opt-row .n-input { min-width: 0; }
  .q { margin-top: 12px; }
  .q-head { flex-wrap: wrap; }
  .ans { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 4px 8px; border-radius: var(--norm-radius-sm);
         font-size: var(--norm-fs-sm); }
  .ans--ok { background: var(--norm-ok-bg); color: var(--norm-ok); }
  .ans-gap { flex: 0 0 auto; width: 14px; }
  .prose { line-height: 1.5; color: var(--norm-text); }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose img, .prose video { max-width: 100%; }

  /* ---- Tracker: the matrix scrolls sideways under a pinned name column ---- */
  .matrix { overflow-x: auto; }
  .matrix th.person, .matrix td.person { position: sticky; left: 0; z-index: 1; min-width: 160px; background: var(--norm-bg); }
  .matrix th.person { background: var(--norm-surface-alt); }
  .matrix .mid { min-width: 120px; text-align: center; }
  .matrix .cell + .cell { margin-top: 4px; }
  .matrix .n-badge { display: inline-block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }

  /* ---- Sign-off queue ---- */
  .list-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--norm-line); }
  .list-row:first-child { border-top: none; }
  .row-actions { display: flex; flex: 0 0 auto; gap: 8px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .files .n-btn { min-width: 0; max-width: 260px; }
  .fname { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* ---- Orbit refresh banner: slim, never in the way ---- */
  .sync { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 8px; padding: 6px 10px; border-radius: var(--norm-radius);
          background: var(--norm-surface-alt); font-size: var(--norm-fs-xs); color: var(--norm-text-soft); }
  .sync .i { margin-top: 1px; color: var(--norm-icon); }
  .sync[hidden] { display: none; }
  .tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px;
               border-radius: 999px; background: var(--norm-warn-bg); color: var(--norm-warn); font-size: var(--norm-fs-xs); font-weight: 600; }
  .tab-count[hidden] { display: none; }
  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 60; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px;
           border-radius: var(--norm-radius); background: var(--norm-text); color: var(--norm-bg); font-size: var(--norm-fs-sm);
           box-shadow: 0 6px 20px rgba(26, 26, 26, 0.2); }
  .toast[hidden] { display: none; }

  /* Segmented sub-navigation (Reviews pages, People buckets). */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; margin-bottom: 12px; padding: 2px; border-radius: var(--norm-radius); background: var(--norm-surface-alt); }
  .seg-btn { padding: 5px 12px; border: none; border-radius: var(--norm-radius-sm); background: none; font: inherit; font-size: var(--norm-fs-sm);
             color: var(--norm-text-soft); cursor: pointer; white-space: nowrap; }
  .seg-btn:hover { color: var(--norm-text); }
  .seg-btn[aria-selected="true"], .seg-btn[aria-pressed="true"] { background: var(--norm-bg); color: var(--norm-text); font-weight: 600;
             box-shadow: 0 1px 2px rgba(26, 26, 26, 0.08); }
  .seg-btn .hint { margin-left: 4px; }
  .seg--bar { margin-bottom: 0; }
  tr.click { cursor: pointer; }
  .overdue { color: var(--norm-error); font-weight: 500; }
  .muted-row td { color: var(--norm-muted); }
  .warnline { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; font-size: var(--norm-fs-xs); color: var(--norm-warn); }
  .warnline .i { margin-top: 1px; }
  .banner { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--norm-line); border-left: 3px solid var(--norm-accent);
            border-radius: var(--norm-radius); background: var(--norm-bg); font-size: var(--norm-fs-sm); }
  .banner .name { margin-bottom: 2px; }
  .banner--row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .search { flex: 0 1 260px; min-width: 0; }

  /* Multi-select filter: a button that opens a list of checkboxes. */
  .mf { position: relative; display: inline-block; }
  .mf-panel { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 200px; max-height: 260px; overflow-y: auto; padding: 4px;
              border: 1px solid var(--norm-line); border-radius: var(--norm-radius); background: var(--norm-bg); box-shadow: 0 8px 24px rgba(26, 26, 26, 0.12); }
  .mf-panel[hidden] { display: none; }
  .mf-panel label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--norm-radius-sm); font-size: var(--norm-fs-sm); cursor: pointer; white-space: nowrap; }
  .mf-panel label:hover { background: var(--norm-surface-alt); }

  /* ---- A performance review ---- */
  .rv-meta { margin-top: 4px; font-size: var(--norm-fs-sm); color: var(--norm-muted); }
  .rv-steps { margin-top: 16px; }
  .rv-steps .n-tab { display: inline-flex; align-items: center; gap: 4px; }
  .rv-steps .n-tab .i { color: var(--norm-ok); }
  .capcat + .capcat { margin-top: 16px; }
  .capcat-name { margin-bottom: 8px; font-weight: 600; font-size: var(--norm-fs-sm); }
  .capbox { margin-top: 8px; padding: 12px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .lvl-grid { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 4px 12px; align-items: start; }
  .lvl-grid.cols-2 { grid-template-columns: minmax(0, 1fr) 56px 56px; }
  .lvl-grid.cols-0 { grid-template-columns: minmax(0, 1fr); }
  .lvl-col { font-size: var(--norm-fs-xs); font-weight: 600; color: var(--norm-muted); text-align: center; text-transform: uppercase; letter-spacing: 0.02em; }
  .lvl-line { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--norm-line-soft); }
  .lvl-name { font-size: var(--norm-fs-xs); font-weight: 600; }
  .lvl-desc { font-size: var(--norm-fs-xs); color: var(--norm-muted); white-space: pre-wrap; }
  .lvl-cell { display: flex; justify-content: center; padding-top: 2px; }
  .radio { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; padding: 0; border: 2px solid var(--norm-line-strong);
           border-radius: 50%; background: var(--norm-bg); cursor: pointer; }
  .radio:hover:not(:disabled) { border-color: var(--norm-accent); }
  .radio.on { border-color: var(--norm-accent); background: var(--norm-accent); box-shadow: inset 0 0 0 3px var(--norm-bg); }
  .radio:disabled { cursor: default; opacity: 0.65; }
  @media (pointer: coarse) { .radio { width: 26px; height: 26px; } }
  .sums { display: grid; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--norm-line); }
  @media (min-width: 900px) { .sums.two { grid-template-columns: 1fr 1fr; } }
  .sum { padding: 14px; border: 1px solid var(--norm-line); border-radius: var(--norm-radius); }
  .sum-list { margin-top: 10px; }
  .sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--norm-line-soft); font-size: var(--norm-fs-sm); }
  .sum-row:last-child { border-bottom: none; }

                (i < mods.length - 1 ? ibtn('data-mdn="' + esc(m.id) + '"', 'arrow-down', 'Move module down') : GAP) +
                ibtn('data-delm="' + esc(m.id) + '"', 'trash-2', 'Delete module', true) +
              '</span>' +
            '</div>' +
            '<div class="secs">' + (secs || '<div class="none">No sections</div>') +
              '<div class="addrow">' +
                '<select class="n-select fld-sm" data-newstype="' + esc(m.id) + '" aria-label="Section type">' +
                  '<option value="online">Online</option><option value="on_shift">On-shift</option>' +

        }).join('');

        var enrolled = (e.assignments || []).map(function (a) {
          return '<tr><td><button type="button" class="link" data-member="' + esc(a.person_id) + '">' + esc(a.person_name) + '</button>' +

                ? '<button type="button" class="n-btn n-btn--secondary n-btn--sm" data-reopen="' + esc(a.id) + '">Reopen</button>'

        body.innerHTML =

          '<div class="title-row" id="ptitle">' + titleInner(p) + '</div>' +

            '<div class="panel-head"><h2>Details</h2></div>' +
            '<div class="panel-body form">' +
              '<div class="field"><label for="f-name">Name</label><input type="text" class="n-input" id="f-name" style="flex:1" value="' + esc(p.name || '') + '"></div>' +
              '<div class="field"><label for="f-icon">Icon</label><input type="text" class="n-input" id="f-icon" style="width:140px" value="' + esc(p.icon || '') + '">' +
                '<span id="f-icon-tile">' + tile(p.icon) + '</span><span class="hint">An emoji, or an icon name like “chef-hat”</span></div>' +
              '<div class="field"><label for="f-desc">Description</label><input type="text" class="n-input" id="f-desc" style="flex:1" value="' + esc(p.description || '') + '"></div>' +
              '<div class="field"><label for="f-due">Due within</label><input type="number" class="n-input" id="f-due" style="width:90px" min="0" value="' +

                '<span class="hint">days after enrolling — blank means no due date</span></div>' +
              '<div class="field field--inline"><label for="f-active">Active</label><input type="checkbox" id="f-active"' + (p.is_active === false ? '' : ' checked') + '></div>' +
              '<div class="field field--inline"><label for="f-plan">Plan-led</label><input type="checkbox" id="f-plan"' + (p.requires_plan ? ' checked' : '') + '>' +
                '<span class="hint">scheduled with a trainer instead of self-paced</span></div>' +
              '<div class="field"><span class="lbl">Variants</span>' +
                '<span class="grow hint">' + ((p.variants || []).length
                  ? (p.variants || []).map(function (g) { return esc(g.name) + (g.source === 'venue' ? ' (by venue)' : ' (' + ((g.options || []).length) + ')'); }).join(', ')
                  : 'none — one track for everyone') + '</span>' +
                '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="editvariants">Edit variants</button></div>' +
            '</div>' +
            '<div class="panel-foot">' +
              '<button type="button" class="n-btn n-btn--danger n-btn--sm" id="delprog">Delete program</button>' +
              '<span class="grow"></span><span class="saved" id="saved"></span>' +
              '<button type="button" class="n-btn n-btn--primary" id="saveprog">Save</button>' +
            '</div>' +
          '</section>' +
          '<section class="n-card panel">' +
            '<div class="panel-head"><h2>Structure</h2><span class="sub">' + mods.length + ' module' + (mods.length === 1 ? '' : 's') + '</span>' +
              '<span class="grow"></span><button type="button" class="n-btn n-btn--secondary n-btn--sm" id="addmod">' + ui('plus', 14) + 'Module</button></div>' +
            '<div class="panel-body"><div class="tree">' + (tree || '<div class="none">No modules yet — add one.</div>') + '</div></div>' +
          '</section>' +
          '<section class="n-card panel">' +
            '<div class="panel-head"><h2>Enrolled</h2><span class="sub">' + (e.assignments || []).length + '</span>' +
              '<span class="grow"></span><button type="button" class="n-btn n-btn--secondary n-btn--sm" id="enrolbtn">' + ui('plus', 14) + 'Enrol people</button></div>' +
            (enrolled
              ? '<div class="tbl"><table class="n-table"><thead><tr><th>Person</th><th>Role</th><th>Due</th><th>Status</th><th><span class="sr">Actions</span></th></tr></thead><tbody>' + enrolled + '</tbody></table></div>'
              : '<div class="panel-body none">Nobody is enrolled yet.</div>') +
          '</section>';

        var reload = function () { showProgram(id); };
        function act(op, extra) { return run(op, extra).then(reload).catch(fail); }
        document.getElementById('back').addEventListener('click', showPrograms);
        document.getElementById('f-icon').addEventListener('input', function () {
          document.getElementById('f-icon-tile').innerHTML = tile(this.value);
        });

        document.getElementById('saveprog').addEventListener('click', function () {
          var due = document.getElementById('f-due').value;
          var fields = {
            name: document.getElementById('f-name').value,
            icon: document.getElementById('f-icon').value || null,
            description: document.getElementById('f-desc').value || null,
            default_due_days: due === '' ? null : Number(due),
            is_active: document.getElementById('f-active').checked,
            requires_plan: document.getElementById('f-plan').checked,
          };
          run('save_program', { program_id: id, fields: fields }).then(function () {
            var t = document.getElementById('ptitle'); if (t) t.innerHTML = titleInner(fields);
            var el = document.getElementById('saved'); el.textContent = 'Saved';
            setTimeout(function () { if (el) el.textContent = ''; }, 1500);
          }).catch(fail);
        });
        document.getElementById('delprog').addEventListener('click', function () {
          askConfirm('Delete "' + (p.name || 'this program') + '" and every enrolment, completion and plan on it?',
            { title: 'Delete program', confirm: 'Delete program', danger: true }).then(function (ok) {
            if (!ok) return;
            run('delete_program', { program_id: id }).then(showPrograms).catch(fail);
          });
        });
        document.getElementById('addmod').addEventListener('click', function () { act('add_module', { program_id: id }); });
        document.getElementById('enrolbtn').addEventListener('click', function () { enrolPicker(p, e.available || []); });
        document.getElementById('editvariants').addEventListener('click', function () { variantsEditor(p); });

        bind('[data-mod]', 'change', function (el) { run('update_module', { module_id: el.getAttribute('data-mod'), fields: { name: el.value } }).catch(fail); });
        bind('[data-modsign]', 'change', function (el) { act('update_module', { module_id: el.getAttribute('data-modsign'), fields: { requires_signoff: el.checked } }); });
        bind('[data-delm]', 'click', function (el) {
          askConfirm('Delete this module, its sections and their content?', { title: 'Delete module', confirm: 'Delete module', danger: true })
            .then(function (ok) { if (ok) act('delete_module', { module_id: el.getAttribute('data-delm') }); });
        });
        bind('[data-adds]', 'click', function (el) {
          var mid = el.getAttribute('data-adds');
          act('add_section', { module_id: mid, section_type: q('[data-newstype="' + mid + '"]').value, name: q('[data-news="' + mid + '"]').value || null });
        });
        bind('[data-dels]', 'click', function (el) {
          askConfirm('Delete this section and its content? Any scheduled plan dates for it go too.', { title: 'Delete section', confirm: 'Delete section', danger: true })
            .then(function (ok) { if (ok) act('delete_section', { section_id: el.getAttribute('data-dels') }); });
        });
        bind('[data-secname]', 'change', function (el) { run('update_section', { section_id: el.getAttribute('data-secname'), fields: { name: el.value } }).catch(fail); });
        bind('[data-secedit]', 'click', function (el) { editSection(state.sections[el.getAttribute('data-secedit')]); });
        bind('[data-addc]', 'click', function (el) {
          var sid = el.getAttribute('data-addc'); var title = q('[data-newc="' + sid + '"]').value;
          if (title.trim()) act('add_content', { section_id: sid, title: title, content_type: q('[data-newctype="' + sid + '"]').value });
        });
        bind('[data-delc]', 'click', function (el) { act('delete_content', { content_id: el.getAttribute('data-delc') }); });
        bind('[data-viewc]', 'click', function (el) { viewContent(el.getAttribute('data-viewc')); });
        bind('[data-done]', 'click', function (el) { setStatus(el.getAttribute('data-done'), 'completed', id); });
        bind('[data-reopen]', 'click', function (el) { setStatus(el.getAttribute('data-reopen'), 'assigned', id); });
        bind('[data-unenrol]', 'click', function (el) {
          askConfirm('Remove this enrolment and its completion history?', { title: 'Remove enrolment', confirm: 'Remove', danger: true })
            .then(function (ok) { if (ok) act('unenrol', { assignment_id: el.getAttribute('data-unenrol') }); });
        });
        bind('[data-member]', 'click', function (el) { showMember(el.getAttribute('data-member')); });
        // reorder: send the whole new order for the collection
        reorderArrows('[data-mup]', '[data-mdn]', 'modules', mods.map(function (m) { return m.id; }));
        var allContent = (d.content || []);
        bindReorderContent(secsByModule, itemsBySection);
      }).catch(fail);
  }

  function bindReorderContent(secsByModule, itemsBySection) {
    // Content reorder is per-section; rebuild the section's id list on click.
    body.querySelectorAll('[data-cup],[data-cdn]').forEach(function (el) {
      el.addEventListener('click', function () {
        var cid = el.getAttribute('data-cup') || el.getAttribute('data-cdn');
        var up = !!el.getAttribute('data-cup');
        var sid = state.content[cid].section_id;
        var ids = (itemsBySection[sid] || []).map(function (c) { return c.id; });
        var i = ids.indexOf(cid); if (i < 0) return;
        var j = up ? i - 1 : i + 1; if (j < 0 || j >= ids.length) return;
        var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
        run('reorder', { collection: 'content', ids: ids }).then(function () { showProgram(state.program.id); }).catch(fail);
      });
    });
  }
  function reorderArrows(upSel, dnSel, collection, ids) {
    function move(cid, up) {
      var order = ids.slice(); var i = order.indexOf(cid); if (i < 0) return;
      var j = up ? i - 1 : i + 1; if (j < 0 || j >= order.length) return;
      var t = order[i]; order[i] = order[j]; order[j] = t;
      run('reorder', { collection: collection, ids: order }).then(function () { showProgram(state.program.id); }).catch(fail);
    }
    body.querySelectorAll(upSel).forEach(function (el) { el.addEventListener('click', function () { move(el.getAttribute(upSel.slice(1, -1)), true); }); });
    body.querySelectorAll(dnSel).forEach(function (el) { el.addEventListener('click', function () { move(el.getAttribute(dnSel.slice(1, -1)), false); }); });
  }
  function q(sel) { return body.querySelector(sel); }
  function bind(sel, ev, fn) { body.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, function () { fn(el); }); }); }
  // Handlers for elements INSIDE a modal live in modalHost, not body.
  function bindM(sel, ev, fn) {
    if (typeof ev === 'function') { fn = ev; ev = 'click'; }
    modalHost.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, function () { fn(el); }); });
  }
  function uid() { return 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function extractYouTube(v) {
    v = String(v || '').trim();
    var m = v.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : v;
  }

  // ---- Variant groups editor ---------------------------------------------
  // A variant splits a program into separately-tracked instances (Orbit's
  // "Sections": Larder / Fryer / Grill). The enrol picker already reads these;
  // this is what lets you DEFINE them, which nothing did before.
  function variantsEditor(program) {
    state.vg = JSON.parse(JSON.stringify(program.variants || []));
    renderVariants(program);
  }
  function readVarInputs() {
    (state.vg || []).forEach(function (g, gi) {
      var gn = modalHost.querySelector('#vg-' + gi); if (gn) g.name = gn.value;
      (g.options || []).forEach(function (o, oi) {
        var on = modalHost.querySelector('#vo-' + gi + '-' + oi); if (on) o.name = on.value;
      });
    });
  }
  function renderVariants(program) {
    var groupsHtml = (state.vg || []).map(function (g, gi) {
      var isVenue = g.source === 'venue';
      var opts = isVenue
        ? '<div class="hint opt-hint">Options come from your venues automatically.</div>'
        : (g.options || []).map(function (o, oi) {
            return '<div class="opt-row"><input type="text" class="n-input fld-sm" id="vo-' + gi + '-' + oi + '" value="' + esc(o.name || '') + '" placeholder="Option (e.g. Larder)" style="flex:1" aria-label="Option">' +
              ibtn('data-delvo="' + gi + '-' + oi + '"', 'x', 'Remove option') + '</div>';
          }).join('') + '<button type="button" class="n-btn n-btn--quiet n-btn--sm add-opt" data-addvo="' + gi + '">' + ui('plus', 14) + 'Option</button>';
      return '<div class="group"><div class="group-head"><input type="text" class="n-input group-name" id="vg-' + gi + '" value="' + esc(g.name || '') + '" placeholder="Group name (e.g. Section)" aria-label="Group name">' +
        badge(isVenue ? 'By venue' : 'Manual') +
        ibtn('data-delvg="' + gi + '"', 'trash-2', 'Remove group', true) + '</div>' + opts + '</div>';
    }).join('');
    modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">Variant groups — ' + esc(program.name) + '</h2></div>' +
      '<p class="dlg-intro">A variant splits this program into separately-tracked tracks — someone enrols on one track and the tracker shows a badge per track. A "by venue" group tracks per venue automatically.</p>' +
      '<div>' + (groupsHtml || '<div class="none">No variant groups yet.</div>') + '</div>' +
      '<div class="addrow" style="margin-top:12px"><button type="button" class="n-btn n-btn--secondary n-btn--sm" id="addvg">' + ui('plus', 14) + 'Manual group</button>' +
        '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="addvgvenue">' + ui('plus', 14) + 'Venue group</button></div>' +
      '<div class="err" id="vg-err"></div>' +
      foot('<button type="button" class="n-btn n-btn--secondary" id="vg-cancel">Cancel</button>' +
        '<button type="button" class="n-btn n-btn--primary" id="vg-save">Save</button>'), { keep: true });
    modalHost.querySelector('#vg-cancel').addEventListener('click', closeModal);
    modalHost.querySelector('#addvg').addEventListener('click', function () { readVarInputs(); state.vg.push({ id: uid(), name: 'New group', source: 'manual', options: [] }); renderVariants(program); });
    modalHost.querySelector('#addvgvenue').addEventListener('click', function () {
      readVarInputs();
      if (state.vg.some(function (g) { return g.source === 'venue'; })) { modalHost.querySelector('#vg-err').textContent = 'Only one venue group.'; return; }
      state.vg.push({ id: uid(), name: 'Venue', source: 'venue', options: [] }); renderVariants(program);
    });
    bindM('[data-addvo]', function (el) { readVarInputs(); var gi = Number(el.getAttribute('data-addvo')); state.vg[gi].options = state.vg[gi].options || []; state.vg[gi].options.push({ id: uid(), name: '' }); renderVariants(program); });
    bindM('[data-delvo]', function (el) { readVarInputs(); var p = el.getAttribute('data-delvo').split('-'); state.vg[Number(p[0])].options.splice(Number(p[1]), 1); renderVariants(program); });
    bindM('[data-delvg]', function (el) { readVarInputs(); state.vg.splice(Number(el.getAttribute('data-delvg')), 1); renderVariants(program); });
    modalHost.querySelector('#vg-save').addEventListener('click', function () {
      readVarInputs();
      var clean = state.vg.filter(function (g) { return String(g.name || '').trim(); }).map(function (g) {
        if (g.source !== 'venue') g.options = (g.options || []).filter(function (o) { return String(o.name || '').trim(); });
        return g;
      });
      run('save_program', { program_id: program.id, fields: { variants: clean } })
        .then(function () { closeModal(); showProgram(program.id); }).catch(function (e) { modalHost.querySelector('#vg-err').textContent = e.message; });
    });
  }

  function setStatus(assignmentId, status, programId) {
    run('set_assignment_status', { assignment_id: assignmentId, status: status })
      .then(function () { showProgram(programId); }).catch(fail);
  }

  // ---- Enrol picker ------------------------------------------------------
  function enrolPicker(program, available) {
    var groups = variantGroups(program);
    var pickerRows = available.map(function (p) {
      return '<label><input type="checkbox" value="' + esc(p.id) + '"><span class="grow">' + esc(p.name) + '</span>' +
        (p.role ? '<span class="sub">' + esc(p.role) + '</span>' : '') + '</label>';
    }).join('') || '<div class="none">Everyone is already enrolled on this instance.</div>';
    modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">Enrol on ' + esc(program.name) + '</h2></div>' +
      groups.html +
      '<input type="text" class="n-input" id="pfilter" placeholder="Filter names…" aria-label="Filter names" style="width:100%;margin-top:12px">' +
      '<div class="pick" id="picklist">' + pickerRows + '</div>' +
      foot('<span class="sub" id="enrolcount">0 selected</span><span class="grow"></span>' +
        '<button type="button" class="n-btn n-btn--secondary" id="cancelenrol">Cancel</button>' +
        '<button type="button" class="n-btn n-btn--primary" id="doenrol">Enrol selected</button>'));

    var list = document.getElementById('picklist');
    function count() { document.getElementById('enrolcount').textContent = list.querySelectorAll('input:checked').length + ' selected'; }
    list.addEventListener('change', count);
    document.getElementById('pfilter').addEventListener('input', function () {
      var t = this.value.toLowerCase();
      list.querySelectorAll('label').forEach(function (l) { l.style.display = l.textContent.toLowerCase().indexOf(t) >= 0 ? '' : 'none'; });
    });
    document.getElementById('cancelenrol').addEventListener('click', closeModal);
    document.getElementById('doenrol').addEventListener('click', function () {
      var ids = Array.prototype.slice.call(list.querySelectorAll('input:checked')).map(function (x) { return x.value; });
      if (!ids.length) { closeModal(); return; }
      var sel = groups.selection();
      run('bulk_enrol', { program_id: program.id, person_ids: ids,
        variant_id: sel.variant_id, variant_name: sel.variant_name, venue_id: sel.venue_id })
        .then(function () { closeModal(); showProgram(program.id); }).catch(fail);
    });
  }

  // Variant groups on a program define the instance a person is enrolled on.
  function variantGroups(program) {
    var groups = (program.variants || []).filter(function (g) { return g && g.id; });
    var venues = (ctx && ctx.venues) || [];
    if (!groups.length) {
      // Even with no variant groups, a venue can scope the instance.
      var opts = '<option value="">No venue</option>' + venues.map(function (v) {
        return '<option value="' + esc(v.id) + '">' + esc(v.name) + '</option>'; }).join('');
      return {
        html: '<div class="field"><label for="v-venue">Venue</label><select class="n-select" id="v-venue" style="flex:1">' + opts + '</select></div>',
        selection: function () { var v = document.getElementById('v-venue'); return { variant_id: null, variant_name: null, venue_id: v && v.value || null }; }
      };
    }
    var html = groups.map(function (g) {
      var isVenue = g.source === 'venue';
      var opts = isVenue
        ? '<option value="">Not set</option>' + venues.map(function (v) { return '<option value="' + esc(v.id) + '">' + esc(v.name) + '</option>'; }).join('')
        : '<option value="">Not set</option>' + (g.options || []).map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.name) + '</option>'; }).join('');
      return '<div class="field"><label>' + esc(g.name || 'Variant') + '</label>' +
        '<select class="n-select" data-vg="' + esc(g.id) + '" data-vgsrc="' + esc(g.source || '') + '" style="flex:1">' + opts + '</select></div>';
    }).join('');
    return {
      html: html,
      selection: function () {
        var idParts = [], nameParts = [], venueId = null;
        modalHost.querySelectorAll('[data-vg]').forEach(function (sel) {
          if (!sel.value) return;
          var gid = sel.getAttribute('data-vg');
          if (sel.getAttribute('data-vgsrc') === 'venue') { venueId = sel.value; idParts.push(gid + ':' + sel.value); }
          else { idParts.push(gid + ':' + sel.value); nameParts.push(sel.options[sel.selectedIndex].text); }
        });
        return { variant_id: idParts.join('|') || null, variant_name: nameParts.join(' · ') || null, venue_id: venueId };
      }
    };
  }

  // ---- Content viewer ----------------------------------------------------
  function viewContent(cid) {
    var c = state.content[cid];
    if (!c) { run('content', { content_id: cid }).then(function (d) { renderContent(d.content); }).catch(fail); return; }
    renderContent(c);
  }
  // Media the Orbit import copied into Norm: `files: [{file_id, name,
  // source_url}]`. The body still names Orbit's storage URL (its public bucket
  // goes away at cut-over), so each source_url is swapped for the Norm copy.
  // A file that can't be resolved keeps its original URL.
  function mediaCopies(c) {
    var files = (c.files || []).filter(function (f) { return f && f.file_id && f.source_url; });
    if (!files.length || !norm.files || !norm.files.urlFor) return Promise.resolve([]);
    return Promise.all(files.map(function (f) {
      return norm.files.urlFor(f.file_id).then(function (u) { return u ? [f.source_url, u] : null; }, function () { return null; });
    })).then(function (pairs) { return pairs.filter(Boolean); });
  }
  function withCopies(value, pairs) {
    if (!pairs || !pairs.length || value == null) return value;
    var text = JSON.stringify(value);
    pairs.forEach(function (p) { text = text.split(JSON.stringify(p[0]).slice(1, -1)).join(JSON.stringify(p[1]).slice(1, -1)); });
    return JSON.parse(text);
  }
  function renderContent(c) {
    modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">' + esc(c.title) + '</h2>' + badge(typeLabel(c.content_type || '')) + '</div>' +
      '<div id="cv-body">' + contentInner(c, null) + '</div>' +
      foot('<button type="button" class="n-btn n-btn--secondary" id="closev">Close</button>' +
        '<button type="button" class="n-btn n-btn--primary" id="editc">Edit</button>'));
    document.getElementById('closev').addEventListener('click', closeModal);
    document.getElementById('editc').addEventListener('click', function () { editContent(c); });
    mediaCopies(c).then(function (pairs) {
      var el = modalHost.querySelector('#cv-body');
      if (pairs.length && el) el.innerHTML = contentInner(c, pairs);
    });
  }
  function contentInner(c, pairs) {
    var body_ = withCopies(c.body || {}, pairs);
    var inner = '';
    if (c.content_type === 'rich_text') {
      inner = '<div class="prose">' + (typeof body_ === 'object' ? (body_.html || body_.text || '') : String(body_)) + '</div>';
    } else if (c.content_type === 'video') {
      var yt = body_.youtube_id;
      inner = yt ? '<iframe width="100%" height="320" src="https://www.youtube.com/embed/' + esc(yt) + '" frameborder="0" allowfullscreen></iframe>'
        : (body_.url ? '<video controls style="width:100%"><source src="' + esc(body_.url) + '"></video>' : '<div class="none">No video attached.</div>');
    } else if (c.content_type === 'quiz') {
      var qs = (body_.questions || []);
      inner = '<div class="sub">Quiz — ' + qs.length + ' question' + (qs.length === 1 ? '' : 's') +
        (body_.pass_percentage ? ', pass ' + body_.pass_percentage + '%' : '') + '</div>' +
        qs.map(function (qq, i) {
          var qtype = qq.type || 'multiple_choice';
          var detail = '';
          if (qtype === 'multiple_choice') {
            detail = (qq.options || []).map(function (o, oi) {
              var correct = (qq.correct_indices || []).indexOf(oi) >= 0;
              return '<div class="ans' + (correct ? ' ans--ok' : '') + '">' +
                (correct ? ui('check', 14) : '<span class="ans-gap"></span>') + '<span>' + esc(o) + '</span></div>';
            }).join('');
          } else if (qtype === 'match_pairs') {
            detail = (qq.pairs || []).map(function (pr) {
              return '<div class="ans"><span>' + esc(pr.left || '') + '</span><span class="pair-sep">' + ui('arrow-left-right', 14) + '</span><span>' + esc(pr.right || '') + '</span></div>';
            }).join('');
          } else if (qtype === 'ordering') {
            detail = (qq.items || []).map(function (it, ii) {
              return '<div class="ans"><span class="ord">' + (ii + 1) + '.</span><span>' + esc(it) + '</span></div>';
            }).join('');
          }
          return '<div class="q"><div class="q-head"><span class="name">' + (i + 1) + '. ' + esc(qq.question || '') + '</span>' +
            badge(label(qtype)) + '</div>' + detail + '</div>';
        }).join('');
    } else if (c.content_type === 'file_upload') {
      inner = '<div class="sub">Evidence upload step — trainees attach files here.' +
        (body_.requires_signoff ? ' Requires manager sign-off.' : '') + '</div>';
    }
    return inner;
  }

  // ---- Content editor (authoring the body the viewer reads) ---------------
  // A structured editor per type — no raw JSON. The quiz editor builds all
  // three Orbit question types (multiple choice with multi-answer, match pairs,
  // ordering); rich text and video show a live preview as you type.
  function editContent(c) {
    state.ec = {
      id: c.id,
      title: c.title || '',
      content_type: c.content_type || 'rich_text',
      body: JSON.parse(JSON.stringify(c.body || {})),
      files: c.files || [],
    };
    renderEditContent();
  }

  function readECInputs() {
    var t = modalHost.querySelector('#ec-title'); if (t) state.ec.title = t.value;
    var ct = state.ec.content_type, b = state.ec.body || {};
    if (ct === 'rich_text') {
      var h = modalHost.querySelector('#ec-html'); if (h) state.ec.body = { html: h.value };
    } else if (ct === 'video') {
      var yt = modalHost.querySelector('#ec-yt'), dur = modalHost.querySelector('#ec-dur');
      var nb = { youtube_id: yt ? (yt.value || null) : b.youtube_id };
      if (dur && dur.value) nb.duration_seconds = Number(dur.value);
      state.ec.body = nb;
    } else if (ct === 'file_upload') {
      var inst = modalHost.querySelector('#ec-inst'), mx = modalHost.querySelector('#ec-max'), sg = modalHost.querySelector('#ec-sign');
      state.ec.body = { instructions: inst ? inst.value : '', max_files: mx ? Number(mx.value || 10) : 10, requires_signoff: sg ? sg.checked : false };
    } else if (ct === 'quiz') {
      var pass = modalHost.querySelector('#ec-pass');
      (b.questions || []).forEach(function (qq, qi) {
        var qt = modalHost.querySelector('#q-' + qi + '-text'); if (qt) qq.question = qt.value;
        if (qq.type === 'multiple_choice') {
          var ci = [];
          (qq.options || []).forEach(function (o, oi) {
            var ot = modalHost.querySelector('#q-' + qi + '-opt-' + oi + '-text'); if (ot) qq.options[oi] = ot.value;
            var cb = modalHost.querySelector('#q-' + qi + '-opt-' + oi + '-correct'); if (cb && cb.checked) ci.push(oi);
          });
          qq.correct_indices = ci;
        } else if (qq.type === 'match_pairs') {
          (qq.pairs || []).forEach(function (pr, pi) {
            var l = modalHost.querySelector('#q-' + qi + '-pair-' + pi + '-left'), r = modalHost.querySelector('#q-' + qi + '-pair-' + pi + '-right');
            if (l) pr.left = l.value; if (r) pr.right = r.value;
          });
        } else if (qq.type === 'ordering') {
          (qq.items || []).forEach(function (it, ii) {
            var iel = modalHost.querySelector('#q-' + qi + '-item-' + ii); if (iel) qq.items[ii] = iel.value;
          });
        }
      });
      b.pass_percentage = pass && pass.value ? Number(pass.value) : (b.pass_percentage || 100);
      state.ec.body = b;
    }
  }

  function quizEditorHtml() {
    var b = state.ec.body || {};
    var qHtml = (b.questions || []).map(function (qq, qi) {
      var typeOpts = ['multiple_choice', 'match_pairs', 'ordering'].map(function (t) {
        return '<option value="' + t + '"' + (qq.type === t ? ' selected' : '') + '>' + label(t) + '</option>';
      }).join('');
      var tb = '';
      if (qq.type === 'multiple_choice') {
        tb = (qq.options || []).map(function (o, oi) {
          var correct = (qq.correct_indices || []).indexOf(oi) >= 0;
          return '<div class="opt-row"><input type="checkbox" id="q-' + qi + '-opt-' + oi + '-correct"' + (correct ? ' checked' : '') + ' title="Correct answer" aria-label="Correct answer">' +
            '<input type="text" class="n-input fld-sm" id="q-' + qi + '-opt-' + oi + '-text" value="' + esc(o) + '" placeholder="Option" style="flex:1" aria-label="Option">' +
            ibtn('data-delopt="' + qi + '-' + oi + '"', 'x', 'Remove option') + '</div>';
        }).join('') + '<button type="button" class="n-btn n-btn--quiet n-btn--sm add-opt" data-addopt="' + qi + '">' + ui('plus', 14) + 'Option</button>' +
          '<div class="hint opt-hint">Tick every correct answer — more than one is allowed.</div>';
      } else if (qq.type === 'match_pairs') {
        tb = (qq.pairs || []).map(function (pr, pi) {
          return '<div class="opt-row"><input type="text" class="n-input fld-sm" id="q-' + qi + '-pair-' + pi + '-left" value="' + esc(pr.left || '') + '" placeholder="Left" style="flex:1" aria-label="Left">' +
            '<span class="pair-sep">' + ui('arrow-left-right', 14) + '</span>' +
            '<input type="text" class="n-input fld-sm" id="q-' + qi + '-pair-' + pi + '-right" value="' + esc(pr.right || '') + '" placeholder="Right" style="flex:1" aria-label="Right">' +
            ibtn('data-delpair="' + qi + '-' + pi + '"', 'x', 'Remove pair') + '</div>';
        }).join('') + '<button type="button" class="n-btn n-btn--quiet n-btn--sm add-opt" data-addpair="' + qi + '">' + ui('plus', 14) + 'Pair</button>';
      } else if (qq.type === 'ordering') {
        tb = (qq.items || []).map(function (it, ii) {
          return '<div class="opt-row"><span class="ord">' + (ii + 1) + '.</span>' +
            '<input type="text" class="n-input fld-sm" id="q-' + qi + '-item-' + ii + '" value="' + esc(it) + '" placeholder="Item" style="flex:1" aria-label="Item ' + (ii + 1) + '">' +
            (ii > 0 ? ibtn('data-itemup="' + qi + '-' + ii + '"', 'arrow-up', 'Move up') : GAP) +
            ibtn('data-delitem="' + qi + '-' + ii + '"', 'x', 'Remove item') + '</div>';
        }).join('') + '<button type="button" class="n-btn n-btn--quiet n-btn--sm add-opt" data-additem="' + qi + '">' + ui('plus', 14) + 'Item</button>' +
          '<div class="hint opt-hint">List them in the correct order.</div>';
      }
      return '<div class="q-edit"><div class="q-head"><span class="q-num">Q' + (qi + 1) + '</span>' +
        '<select class="n-select fld-sm" data-qtype="' + qi + '" aria-label="Question type">' + typeOpts + '</select>' +
        '<span class="grow"></span>' + ibtn('data-delq="' + qi + '"', 'trash-2', 'Remove question', true) + '</div>' +
        '<input type="text" class="n-input" id="q-' + qi + '-text" value="' + esc(qq.question || '') + '" placeholder="Question" aria-label="Question">' +
        tb + '</div>';
    }).join('');
    return '<div class="field"><label for="ec-pass">Pass %</label><input type="number" class="n-input" id="ec-pass" style="width:90px" value="' + esc(b.pass_percentage == null ? 100 : b.pass_percentage) + '"></div>' +
      '<div>' + (qHtml || '<div class="none">No questions yet.</div>') + '</div>' +
      '<button type="button" class="n-btn n-btn--secondary n-btn--sm" id="ec-addq" style="margin-top:8px">' + ui('plus', 14) + 'Question</button>';
  }

  function renderEditContent() {
    var ct = state.ec.content_type, b = state.ec.body || {};
    var typeSel = ['rich_text', 'video', 'quiz', 'file_upload'].map(function (t) {
      return '<option value="' + t + '"' + (ct === t ? ' selected' : '') + '>' + typeLabel(t) + '</option>';
    }).join('');
    var editor = '';
    if (ct === 'rich_text') {
      var html = typeof b === 'object' ? (b.html || b.text || '') : String(b);
      editor = '<div class="stack"><label class="n-label" for="ec-html">Body (HTML)</label>' +
        '<textarea class="n-input" id="ec-html" style="min-height:140px">' + esc(html) + '</textarea></div>' +
        '<div class="stack"><div class="n-label">Live preview</div>' +
        '<div class="preview prose" id="ec-preview">' + html + '</div></div>';
    } else if (ct === 'video') {
      editor = '<div class="field"><label for="ec-yt">YouTube link or ID</label><input type="text" class="n-input" id="ec-yt" style="flex:1" value="' + esc(b.youtube_id || '') + '" placeholder="Paste a YouTube link or the 11-character id"></div>' +
        '<div class="field"><label for="ec-dur">Duration (s)</label><input type="number" class="n-input" id="ec-dur" style="width:110px" value="' + esc(b.duration_seconds || '') + '"></div>' +
        '<div id="ec-vpreview" class="stack">' + (b.youtube_id ? '<iframe width="100%" height="220" src="https://www.youtube.com/embed/' + esc(b.youtube_id) + '" frameborder="0" allowfullscreen></iframe>' : '<div class="none">Paste a link to preview.</div>') + '</div>';
    } else if (ct === 'quiz') {
      editor = quizEditorHtml();
    } else if (ct === 'file_upload') {
      editor = '<div class="stack"><label class="n-label" for="ec-inst">Instructions</label>' +
        '<textarea class="n-input" id="ec-inst" style="min-height:70px">' + esc(b.instructions || '') + '</textarea></div>' +
        '<div class="field" style="margin-top:12px"><label for="ec-max">Max files</label><input type="number" class="n-input" id="ec-max" style="width:90px" value="' + esc(b.max_files == null ? 10 : b.max_files) + '"></div>' +
        '<div class="field field--inline"><label for="ec-sign">Sign-off</label><input type="checkbox" id="ec-sign"' + (b.requires_signoff ? ' checked' : '') + '><span class="hint">a manager must accept the uploaded evidence</span></div>';
    }
    modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">Edit content</h2></div>' +
      '<div class="field"><label for="ec-title">Title</label><input type="text" class="n-input" id="ec-title" style="flex:1" value="' + esc(state.ec.title || '') + '"></div>' +
      '<div class="field"><label for="ec-type">Type</label><select class="n-select" id="ec-type">' + typeSel + '</select></div>' +
      '<div id="ec-body" style="margin-top:12px">' + editor + '</div>' +
      '<div class="err" id="ec-err"></div>' +
      foot('<button type="button" class="n-btn n-btn--secondary" id="ec-cancel">Cancel</button>' +
        '<button type="button" class="n-btn n-btn--primary" id="ec-save">Save</button>'), { keep: true });

    modalHost.querySelector('#ec-cancel').addEventListener('click', function () {
      renderContent({ id: state.ec.id, title: state.ec.title, content_type: state.ec.content_type, body: state.ec.body, files: state.ec.files });
    });
    modalHost.querySelector('#ec-type').addEventListener('change', function () {
      readECInputs(); state.ec.content_type = this.value;
      if (this.value === 'quiz' && !(state.ec.body && state.ec.body.questions)) state.ec.body = { pass_percentage: 100, questions: [] };
      renderEditContent();
    });
    var htmlEl = modalHost.querySelector('#ec-html');
    if (htmlEl) htmlEl.addEventListener('input', function () { var pv = modalHost.querySelector('#ec-preview'); if (pv) pv.innerHTML = this.value; });
    var ytEl = modalHost.querySelector('#ec-yt');
    if (ytEl) ytEl.addEventListener('change', function () {
      this.value = extractYouTube(this.value);
      var pv = modalHost.querySelector('#ec-vpreview');
      if (pv) pv.innerHTML = this.value ? '<iframe width="100%" height="220" src="https://www.youtube.com/embed/' + esc(this.value) + '" frameborder="0" allowfullscreen></iframe>' : '<div class="none">Paste a link to preview.</div>';
    });
    // Quiz structural controls
    var addq = modalHost.querySelector('#ec-addq');
    if (addq) addq.addEventListener('click', function () {
      readECInputs(); state.ec.body.questions = state.ec.body.questions || [];
      state.ec.body.questions.push({ type: 'multiple_choice', question: '', options: ['', ''], correct_indices: [] });
      renderEditContent();
    });
    bindM('[data-qtype]', 'change', function (el) {
      readECInputs(); var qq = state.ec.body.questions[Number(el.getAttribute('data-qtype'))]; qq.type = el.value;
      if (qq.type === 'multiple_choice' && !qq.options) { qq.options = ['', '']; qq.correct_indices = []; }
      if (qq.type === 'match_pairs' && !qq.pairs) qq.pairs = [{ left: '', right: '' }];
      if (qq.type === 'ordering' && !qq.items) qq.items = ['', ''];
      renderEditContent();
    });
    bindM('[data-delq]', function (el) { readECInputs(); state.ec.body.questions.splice(Number(el.getAttribute('data-delq')), 1); renderEditContent(); });
    bindM('[data-addopt]', function (el) { readECInputs(); var qi = Number(el.getAttribute('data-addopt')); state.ec.body.questions[qi].options.push(''); renderEditContent(); });
    bindM('[data-delopt]', function (el) { readECInputs(); var p = el.getAttribute('data-delopt').split('-'); var qq = state.ec.body.questions[Number(p[0])]; qq.options.splice(Number(p[1]), 1); qq.correct_indices = (qq.correct_indices || []).filter(function (x) { return x !== Number(p[1]); }).map(function (x) { return x > Number(p[1]) ? x - 1 : x; }); renderEditContent(); });
    bindM('[data-addpair]', function (el) { readECInputs(); state.ec.body.questions[Number(el.getAttribute('data-addpair'))].pairs.push({ left: '', right: '' }); renderEditContent(); });
    bindM('[data-delpair]', function (el) { readECInputs(); var p = el.getAttribute('data-delpair').split('-'); state.ec.body.questions[Number(p[0])].pairs.splice(Number(p[1]), 1); renderEditContent(); });
    bindM('[data-additem]', function (el) { readECInputs(); state.ec.body.questions[Number(el.getAttribute('data-additem'))].items.push(''); renderEditContent(); });
    bindM('[data-delitem]', function (el) { readECInputs(); var p = el.getAttribute('data-delitem').split('-'); state.ec.body.questions[Number(p[0])].items.splice(Number(p[1]), 1); renderEditContent(); });
    bindM('[data-itemup]', function (el) { readECInputs(); var p = el.getAttribute('data-itemup').split('-'); var it = state.ec.body.questions[Number(p[0])].items; var i = Number(p[1]); var t = it[i]; it[i] = it[i - 1]; it[i - 1] = t; renderEditContent(); });

    modalHost.querySelector('#ec-save').addEventListener('click', function () {
      readECInputs();
      run('update_content', { content_id: state.ec.id, fields: { title: state.ec.title, content_type: state.ec.content_type, body: state.ec.body } })
        .then(function (r) {
          if (state.content) state.content[state.ec.id] = r.content;
          renderContent(r.content);
          if (state.program) showProgram(state.program.id);
        }).catch(function (e) { modalHost.querySelector('#ec-err').textContent = e.message; });
    });
  }

  // ---- Section details editor --------------------------------------------
  function editSection(s) {
    if (!s) return;
    modal('<div class="dlg-head"><h2 class="dlg-title" id="dlg-title">Section details</h2></div>' +
      '<div class="field"><label for="s-name">Name</label><input type="text" class="n-input" id="s-name" style="flex:1" value="' + esc(s.name || '') + '"></div>' +
      '<div class="stack"><label class="n-label" for="s-intro">Introduction</label>' +
      '<textarea class="n-input" id="s-intro" style="min-height:70px">' + esc(s.introduction || '') + '</textarea></div>' +
      '<div class="stack"><label class="n-label" for="s-instr">Instructions</label>' +

      '<div class="field" style="margin-top:12px"><label for="s-trm">Trainer mins</label><input type="number" class="n-input" id="s-trm" style="width:90px" value="' + esc(s.trainer_time_minutes == null ? '' : s.trainer_time_minutes) + '">' +
        '<label class="inline" for="s-tem">Trainee mins</label><input type="number" class="n-input" id="s-tem" style="width:90px" value="' + esc(s.trainee_time_minutes == null ? '' : s.trainee_time_minutes) + '"></div>' +
      foot('<button type="button" class="n-btn n-btn--secondary" id="s-cancel">Cancel</button>' +

  // ---- Member detail -----------------------------------------------------

    loading();
    run('member', { person_id: personId }).then(function (d) {
      var a = (d.assignments || []).map(function (r) {
        var mods = (r.modules || []).map(function (m) {
          return badge((m.name || '') + ' ' + m.done + '/' + m.total, m.done === m.total ? 'ok' : (m.done > 0 ? 'warn' : ''));
        }).join('');
        return '<tr><td>' + esc(r.program) + (r.instance ? '<span class="inst">' + esc(r.instance) + '</span>' : '') + '</td>' +
          '<td><div class="pills">' + mods + '</div></td><td class="num">' + r.percent + '%</td></tr>';
      }).join('');
      var plans = (d.plans || []).map(function (pl) {
        var secs = (pl.sections || []).map(function (s) {
          return badge(s.name, s.status === 'completed' ? 'ok' : '', s.due_date || '');
        }).join('');
        return '<tr><td>' + esc(pl.program) + '</td><td>' + (secs ? '<div class="pills">' + secs + '</div>' : '<span class="hint">No sections scheduled</span>') + '</td></tr>';
      }).join('');
      body.innerHTML = '<button type="button" class="back" id="back">' + ui('arrow-left', 14) + 'Back</button>' +
        '<div class="title-row"><span class="avatar" aria-hidden="true">' + esc(String(d.person.name || '?').trim().charAt(0).toUpperCase()) + '</span>' +
          '<h2 class="title">' + esc(d.person.name) + '</h2>' +
          (d.person.role ? '<span class="sub">' + esc(d.person.role) + '</span>' : '') + '</div>' +
        '<section class="n-card panel"><div class="panel-head"><h2>Programs</h2></div>' +
          (a ? '<div class="tbl"><table class="n-table"><thead><tr><th>Program</th><th>Modules</th><th class="num">Overall</th></tr></thead><tbody>' + a + '</tbody></table></div>'
             : '<div class="panel-body none">No self-paced programs.</div>') + '</section>' +
        (d.plans && d.plans.length
          ? '<section class="n-card panel"><div class="panel-head"><h2>Plans</h2></div>' +
            '<div class="tbl"><table class="n-table"><thead><tr><th>Program</th><th>Sections</th></tr></thead><tbody>' + plans + '</tbody></table></div></section>'
          : '');
      document.getElementById('back').addEventListener('click', function () {
        if (state.program) showProgram(state.program.id); else { view = 'tracker'; render(); }
      });
