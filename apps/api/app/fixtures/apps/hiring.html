<style>
  :root { --line:#e5e2dc; --muted:#8a8a8a; --ink:#2a2a2a; --green:#2e7d4f; }
  body { font-size: 13px; }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 14px 16px 40px; }
  h1 { font-size: 1.05rem; margin: 0; }
  .sub { color: var(--muted); font-size: .72rem; }
  .tabs { display:flex; gap:4px; margin:12px 0 14px; border-bottom:1px solid var(--line); }
  .tab { border:none; background:none; padding:6px 12px; font:inherit; font-size:.78rem; color:var(--muted);
         cursor:pointer; border-bottom:2px solid transparent; }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--green); font-weight:600; }
  .card { border:1px solid var(--line); border-radius:10px; background:#fff; padding:.7rem .9rem; margin-top:8px; }
  .row { display:flex; align-items:center; gap:12px; }
  .grow { flex:1; min-width:0; }
  .name { font-weight:600; }
  .pill { font-size:.6rem; padding:1px 7px; border-radius:99px; white-space:nowrap; }
  .ok { background:#d1fae5; color:#065f46; }
  .go { background:#fef3c7; color:#92400e; }
  .no { background:#fee2e2; color:#991b1b; }
  .off { background:#f3f4f6; color:#6b7280; }
  button.act { font-size:.7rem; padding:3px 11px; border:1px solid var(--line); border-radius:5px;
               background:#fff; cursor:pointer; font-family:inherit; color:#555; }
  button.act:hover { border-color:#bbb; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); }
  .board { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .col { min-width:210px; flex:0 0 210px; }
  .colhead { font-size:.64rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
             font-weight:600; padding:0 2px 5px; display:flex; justify-content:space-between; }
  .cand { border:1px solid var(--line); border-radius:8px; background:#fff; padding:.45rem .6rem;
          margin-bottom:6px; cursor:grab; }
  .cand:hover { border-color:#bbb; }
  .cand:active { cursor:grabbing; }
  .drop { min-height:44px; border-radius:8px; padding:2px; }
  .drop.over { background:#eef6f0; outline:2px dashed var(--green); outline-offset:-2px; }
  .cand .who { font-size:.76rem; font-weight:600; }
  input[type=text], input[type=email], input[type=number], input[type=date], select {
    font:inherit; font-size:.72rem; padding:3px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; box-sizing:border-box; }
  .empty { border:1px dashed var(--line); border-radius:10px; padding:26px; text-align:center; color:var(--muted); }
  .back { font-size:.7rem; color:#6b6b6b; background:none; border:none; cursor:pointer; padding:0; font-family:inherit; }
  .link { color:var(--green); cursor:pointer; } .link:hover { text-decoration:underline; }
  .kv { display:flex; gap:8px; font-size:.74rem; padding:2px 0; }
  .kv b { min-width:120px; color:var(--muted); font-weight:600; font-size:.68rem; }
  .feed { font-size:.72rem; color:#555; padding:3px 0; border-bottom:1px solid #f4f2ee; }
  .err { color:#b91c1c; font-size:.75rem; }
  .field { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .field label { font-size:.66rem; color:var(--muted); min-width:110px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .tiny { font-size:.62rem; padding:1px 7px; } .danger { color:#b91c1c; border-color:#f0d0d0; }
  .arrow { font-size:.6rem; padding:0 5px; }
  .stars { cursor:pointer; font-size:1rem; letter-spacing:2px; color:#f0b429; }
  textarea { width:100%; font:inherit; font-size:.75rem; border:1px solid var(--line); border-radius:6px; padding:6px; box-sizing:border-box; }
  .modal { position:fixed; inset:0; background:rgba(30,30,30,.35); display:flex; align-items:flex-start;
           justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
  .modal .panel { background:#fff; border-radius:12px; max-width:520px; width:100%; padding:18px 20px; box-shadow:0 12px 40px rgba(0,0,0,.2); }
</style>

<div class="wrap">
  <div class="row" style="justify-content:space-between">
    <div><h1>Hiring</h1><div class="sub" id="scope">—</div></div>
    <button class="act primary" id="newjob">+ New job</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="jobs" aria-selected="true">Openings</button>
    <button class="tab" role="tab" data-view="pool" aria-selected="false">Talent pool</button>
  </div>
  <div id="body"><div class="sub">Loading…</div></div>
</div>
<div id="modal"></div>

<script>
(function () {
  var ctx = null, view = 'jobs';
  var body = document.getElementById('body');
  var modalHost = document.getElementById('modal');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  // Descriptions are stored as HTML but edited as plain text — convert both
  // ways so a manager types prose, not markup.
  function htmlToText(html) {
    if (!html) return '';
    return String(html)
      .replace(/<\/(p|div|h[1-6]|li)>/gi, '\n')
      .replace(/<br\s*\/?>(?=.)/gi, '\n')
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
      .replace(/\n{3,}/g, '\n\n').trim();
  }
  function textToHtml(text) {
    text = String(text == null ? '' : text).trim();
    if (!text) return null;
    return text.split(/\n{2,}/).map(function (para) {
      return '<p>' + esc(para).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function agoLabel(iso) {
    var d = new Date(iso); if (isNaN(d.getTime())) return '';
    var days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return '1d ago';
    if (days < 30) return days + 'd ago';
    var mo = Math.floor(days / 30); return mo + 'mo ago';
  }
  function run(op, extra) {
    var p = { op: op, actor: 'Norm' };
    for (var k in (extra || {})) p[k] = extra[k];
    return norm.run(p).then(function (d) { if (d && d.error) throw new Error(d.error); return d; });
  }
  function loading() { body.innerHTML = '<div class="sub">Loading…</div>'; }
  function fail(e) { body.innerHTML = '<div class="card err">' + esc(e && e.message ? e.message : e) + '</div>'; }
  function closeModal() { modalHost.innerHTML = ''; }
  function modal(html) {
    modalHost.innerHTML = '<div class="modal"><div class="panel">' + html + '</div></div>';
    modalHost.querySelector('.modal').addEventListener('click', function (ev) { if (ev.target === ev.currentTarget) closeModal(); });
  }
  function statusPill(s) {
    var cls = s === 'hired' ? 'ok' : (s === 'rejected' ? 'no' : 'go');
    return '<span class="pill ' + cls + '">' + esc(s || 'active') + '</span>';
  }
  function bind(sel, fn) { body.querySelectorAll(sel).forEach(function (el) { el.addEventListener('click', function () { fn(el); }); }); }

  // ---- Openings ----------------------------------------------------------
  function showJobs() {
    loading();
    run('board').then(function (d) {
      var jobs = d.jobs || [];
      if (!jobs.length) { body.innerHTML = '<div class="empty">No job openings yet. Click <b>+ New job</b> to create one.</div>'; return; }
      body.innerHTML = jobs.map(function (j) {
        return '<div class="card row">' +
          '<div class="grow" style="cursor:pointer" data-pipe="' + esc(j.id) + '">' +
            '<div class="row" style="gap:8px"><span class="name">' + esc(j.title) + '</span>' +
              '<span class="pill ' + (j.status === 'open' ? 'ok' : 'off') + '">' + esc(j.status || 'draft') + '</span>' +
              (j.is_published ? '<span class="pill off">published</span>' : '') + '</div>' +
            '<div class="sub">' + j.application_count + ' applicant' + (j.application_count === 1 ? '' : 's') +
              ' · ' + j.active_count + ' active · ' + j.hired_count + ' hired' +
              (j.employment_type ? ' · ' + esc(j.employment_type.replace('_', ' ')) : '') + '</div>' +
          '</div>' +
          '<button class="act" data-edit="' + esc(j.id) + '">Edit</button>' +
          '<button class="act primary" data-pipe="' + esc(j.id) + '">Pipeline</button>' +
        '</div>';
      }).join('');
      bind('[data-pipe]', function (el) { showPipeline(el.getAttribute('data-pipe')); });
      bind('[data-edit]', function (el) { showJobEditor(el.getAttribute('data-edit')); });
    }).catch(fail);
  }

  function newJob() {
    modal('<div class="name" style="font-size:.85rem">New job opening</div>' +
      '<div class="field" style="margin-top:8px"><label>Title</label><input type="text" id="nj-title" style="flex:1" placeholder="e.g. Bar Team — Part Time"></div>' +
      '<div class="field"><label>Department</label><input type="text" id="nj-dept" style="flex:1" placeholder="e.g. Bar, Kitchen, Crowd Control"></div>' +
      '<div class="field"><label>Employment</label><select id="nj-emp">' +
        '<option value="part_time">Part time</option><option value="full_time">Full time</option><option value="casual">Casual</option></select></div>' +
      '<div class="field"><label>Positions</label><input type="number" id="nj-pos" min="1" value="1" style="width:70px"></div>' +
      '<div class="sub" style="margin-top:6px">This seeds a standard pipeline and application form you can then tailor.</div>' +
      '<div class="row" style="margin-top:10px"><button class="act primary" id="nj-create">Create</button>' +
      '<span class="grow"></span><button class="act" id="nj-cancel">Cancel</button></div>');
    document.getElementById('nj-cancel').addEventListener('click', closeModal);
    document.getElementById('nj-create').addEventListener('click', function () {
      var title = document.getElementById('nj-title').value;
      if (!title.trim()) return;
      run('create_job', { venue_id: ctx && ctx.venueId, fields: {
        title: title, department: document.getElementById('nj-dept').value || null,
        employment_type: document.getElementById('nj-emp').value,
        positions_to_fill: Number(document.getElementById('nj-pos').value) || 1,
      }}).then(function (r) { closeModal(); showJobEditor(r.job.id); }).catch(fail);
    });
  }

  // ---- Job editor --------------------------------------------------------
  function showJobEditor(jobId) {
    loading();
    run('job_editor', { job_id: jobId }).then(function (d) {
      var j = d.job;
      var stageRows = (d.stages || []).map(function (s, i) {
        return '<tr><td><input type="text" data-sname="' + esc(s.id) + '" value="' + esc(s.name) + '" style="width:160px"></td>' +
          '<td><select data-stype="' + esc(s.id) + '">' +
            ['active', 'hired', 'rejected'].map(function (t) { return '<option value="' + t + '"' + (s.stage_type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></td>' +
          '<td style="text-align:right">' +
            (i > 0 ? '<button class="act tiny arrow" data-sup="' + esc(s.id) + '">↑</button>' : '') +
            (i < d.stages.length - 1 ? '<button class="act tiny arrow" data-sdn="' + esc(s.id) + '">↓</button>' : '') +
            '<button class="act tiny danger" data-sdel="' + esc(s.id) + '">×</button></td></tr>';
      }).join('');
      var fieldsById = {};
      (d.fields || []).forEach(function (f) { fieldsById[f.id] = f; });
      var fieldRows = (d.fields || []).map(function (f) {
        return '<tr><td>' + esc(f.label) + (f.knockout_enabled ? ' <span class="pill no">knockout</span>' : '') + '</td>' +
          '<td><span class="sub">' + esc(f.field_type) + '</span></td>' +
          '<td>' + (f.is_required ? '<span class="pill off">required</span>' : '') + (f.is_standard ? ' <span class="pill off">standard</span>' : '') +
            (f.is_enabled === false ? ' <span class="pill off">off</span>' : '') + '</td>' +
          '<td style="text-align:right"><button class="act tiny" data-fedit="' + esc(f.id) + '">edit</button>' +
            (f.is_standard ? '' : ' <button class="act tiny danger" data-fdel="' + esc(f.id) + '">×</button>') + '</td></tr>';
      }).join('');
      body.innerHTML = '<button class="back" id="back">← All openings</button>' +
        '<div class="card">' +
          '<div class="field"><label>Title</label><input type="text" id="j-title" style="flex:1" value="' + esc(j.title || '') + '"></div>' +
          '<div class="field"><label>Department</label><input type="text" id="j-dept" style="flex:1" value="' + esc(j.department || '') + '"></div>' +
          '<div class="field"><label>Employment</label><select id="j-emp">' +
            ['part_time', 'full_time', 'casual'].map(function (t) { return '<option value="' + t + '"' + (j.employment_type === t ? ' selected' : '') + '>' + t.replace('_', ' ') + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label>Positions</label><input type="number" id="j-pos" min="1" value="' + esc(j.positions_to_fill || 1) + '" style="width:70px"></div>' +
          '<div class="field"><label>Pay</label><select id="j-paytype">' +
            ['', 'hourly', 'salary'].map(function (t) { return '<option value="' + t + '"' + (j.pay_type === t ? ' selected' : '') + '>' + (t || 'not shown') + '</option>'; }).join('') + '</select>' +
            '<input type="number" id="j-paymin" placeholder="min" style="width:90px" value="' + esc(j.pay_min == null ? '' : j.pay_min) + '">' +
            '<span class="sub">to</span><input type="number" id="j-paymax" placeholder="max" style="width:90px" value="' + esc(j.pay_max == null ? '' : j.pay_max) + '"></div>' +
          '<div class="field" style="align-items:flex-start"><label>Description</label><textarea id="j-desc" style="flex:1;min-height:60px" placeholder="What the role is about">' + esc(htmlToText(j.description_html)) + '</textarea></div>' +
          '<div class="field" style="align-items:flex-start"><label>Requirements</label><textarea id="j-req" style="flex:1;min-height:60px" placeholder="What you are looking for">' + esc(htmlToText(j.requirements_html)) + '</textarea></div>' +
          '<div class="row" style="margin-top:8px"><button class="act primary" id="j-save">Save</button><span class="sub" id="j-saved"></span>' +
            '<span class="grow"></span>' +
            '<span class="pill ' + (j.status === 'open' ? 'ok' : 'off') + '">' + esc(j.status) + '</span>' +
            (j.is_published ? '<button class="act" id="j-unpub">Unpublish</button>' : '<button class="act" id="j-pub">Publish</button>') +
            (j.status === 'closed' ? '<button class="act" id="j-reopen">Reopen</button>' : '<button class="act danger" id="j-close">Close</button>') +
          '</div>' +
        '</div>' +
        '<div class="card"><div class="row"><div class="grow name" style="font-size:.8rem">Pipeline stages</div><button class="act" id="addstage">+ Stage</button></div>' +
          '<table style="margin-top:6px;width:100%"><tbody>' + stageRows + '</tbody></table>' +
          '<div class="sub" style="margin-top:4px">The TYPE drives status — a candidate on a "hired" stage is hired, whatever the stage is named.</div></div>' +
        '<div class="card"><div class="row"><div class="grow name" style="font-size:.8rem">Application form</div><button class="act" id="addfield">+ Field</button></div>' +
          '<table style="margin-top:6px;width:100%"><tbody>' + fieldRows + '</tbody></table></div>';

      var reload = function () { showJobEditor(jobId); };
      document.getElementById('back').addEventListener('click', showJobs);
      document.getElementById('j-save').addEventListener('click', function () {
        var pmin = document.getElementById('j-paymin').value, pmax = document.getElementById('j-paymax').value;
        run('update_job', { job_id: jobId, fields: {
          title: document.getElementById('j-title').value, department: document.getElementById('j-dept').value || null,
          employment_type: document.getElementById('j-emp').value, positions_to_fill: Number(document.getElementById('j-pos').value) || 1,
          pay_type: document.getElementById('j-paytype').value || null,
          pay_min: pmin === '' ? null : Number(pmin), pay_max: pmax === '' ? null : Number(pmax),
          description_html: textToHtml(document.getElementById('j-desc').value),
          requirements_html: textToHtml(document.getElementById('j-req').value),
        }}).then(function () { var el = document.getElementById('j-saved'); el.textContent = 'Saved'; setTimeout(function () { el.textContent = ''; }, 1500); }).catch(fail);
      });
      function status(fields) { run('set_job_status', Object.assign({ job_id: jobId }, fields)).then(reload).catch(fail); }
      var pub = document.getElementById('j-pub'); if (pub) pub.addEventListener('click', function () { status({ is_published: true }); });
      var unpub = document.getElementById('j-unpub'); if (unpub) unpub.addEventListener('click', function () { status({ is_published: false }); });
      var close = document.getElementById('j-close'); if (close) close.addEventListener('click', function () { status({ status: 'closed' }); });
      var reopen = document.getElementById('j-reopen'); if (reopen) reopen.addEventListener('click', function () { status({ status: 'open' }); });
      document.getElementById('addstage').addEventListener('click', function () { run('add_stage', { job_id: jobId }).then(reload).catch(fail); });
      document.getElementById('addfield').addEventListener('click', function () { addFieldModal(jobId, reload); });

      body.querySelectorAll('[data-sname]').forEach(function (el) { el.addEventListener('change', function () { run('update_stage', { stage_id: el.getAttribute('data-sname'), fields: { name: el.value } }).catch(fail); }); });
      body.querySelectorAll('[data-stype]').forEach(function (el) { el.addEventListener('change', function () { run('update_stage', { stage_id: el.getAttribute('data-stype'), fields: { stage_type: el.value } }).then(reload).catch(fail); }); });
      bind('[data-sdel]', function (el) { run('delete_stage', { stage_id: el.getAttribute('data-sdel') }).then(reload).catch(fail); });
      bind('[data-fdel]', function (el) { run('delete_field', { field_id: el.getAttribute('data-fdel') }).then(reload).catch(fail); });
      bind('[data-fedit]', function (el) { editFieldModal(fieldsById[el.getAttribute('data-fedit')], reload); });
      var stageIds = (d.stages || []).map(function (s) { return s.id; });
      function moveStage(id, up) { var o = stageIds.slice(), i = o.indexOf(id); if (i < 0) return; var j = up ? i - 1 : i + 1; if (j < 0 || j >= o.length) return; var t = o[i]; o[i] = o[j]; o[j] = t; run('reorder_stages', { ids: o }).then(reload).catch(fail); }
      bind('[data-sup]', function (el) { moveStage(el.getAttribute('data-sup'), true); });
      bind('[data-sdn]', function (el) { moveStage(el.getAttribute('data-sdn'), false); });
    }).catch(fail);
  }

  var FIELD_TYPES = ['text', 'textarea', 'email', 'phone', 'select', 'file'];
  function csv(id) { return document.getElementById(id).value.split(',').map(function (x) { return x.trim(); }).filter(Boolean); }

  function addFieldModal(jobId, reload) {
    modal('<div class="name" style="font-size:.85rem">Add application field</div>' +
      '<div class="field" style="margin-top:8px"><label>Label</label><input type="text" id="af-label" style="flex:1"></div>' +
      '<div class="field"><label>Key</label><input type="text" id="af-key" style="flex:1" placeholder="lowercase_no_spaces"></div>' +
      '<div class="field"><label>Type</label><select id="af-type">' +
        FIELD_TYPES.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Options</label><input type="text" id="af-opts" style="flex:1" placeholder="comma-separated (for select)"></div>' +
      '<div class="field"><label>Required</label><input type="checkbox" id="af-req"></div>' +
      '<div class="field"><label>Knockout</label><input type="checkbox" id="af-ko"><span class="sub">auto-reject on a value below</span></div>' +
      '<div class="field"><label>KO values</label><input type="text" id="af-kov" style="flex:1" placeholder="comma-separated, e.g. No"></div>' +
      '<div class="row" style="margin-top:10px"><button class="act primary" id="af-add">Add</button><span class="grow"></span><button class="act" id="af-cancel">Cancel</button></div>');
    document.getElementById('af-cancel').addEventListener('click', closeModal);
    document.getElementById('af-add').addEventListener('click', function () {
      var label = document.getElementById('af-label').value;
      if (!label.trim()) return;
      var key = document.getElementById('af-key').value.trim() || label.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      run('add_field', { job_id: jobId, label: label, field_key: key,
        field_type: document.getElementById('af-type').value, is_required: document.getElementById('af-req').checked,
        options: csv('af-opts'), knockout_enabled: document.getElementById('af-ko').checked, knockout_values: csv('af-kov') })
        .then(function () { closeModal(); reload(); }).catch(fail);
    });
  }

  function editFieldModal(f, reload) {
    if (!f) return;
    modal('<div class="name" style="font-size:.85rem">Edit field — ' + esc(f.label) + '</div>' +
      '<div class="field" style="margin-top:8px"><label>Label</label><input type="text" id="ef-label" style="flex:1" value="' + esc(f.label || '') + '"></div>' +
      '<div class="field"><label>Type</label><select id="ef-type">' +
        FIELD_TYPES.map(function (t) { return '<option' + (f.field_type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Options</label><input type="text" id="ef-opts" style="flex:1" placeholder="comma-separated (for select)" value="' + esc((f.options || []).join(', ')) + '"></div>' +
      '<div class="field"><label>Required</label><input type="checkbox" id="ef-req"' + (f.is_required ? ' checked' : '') + '></div>' +
      '<div class="field"><label>Enabled</label><input type="checkbox" id="ef-en"' + (f.is_enabled === false ? '' : ' checked') + '></div>' +
      '<div class="field"><label>Knockout</label><input type="checkbox" id="ef-ko"' + (f.knockout_enabled ? ' checked' : '') + '><span class="sub">auto-reject on a value below</span></div>' +
      '<div class="field"><label>KO values</label><input type="text" id="ef-kov" style="flex:1" placeholder="comma-separated, e.g. No" value="' + esc((f.knockout_values || []).join(', ')) + '"></div>' +
      '<div class="row" style="margin-top:10px"><button class="act primary" id="ef-save">Save</button><span class="grow"></span><button class="act" id="ef-cancel">Cancel</button></div>');
    document.getElementById('ef-cancel').addEventListener('click', closeModal);
    document.getElementById('ef-save').addEventListener('click', function () {
      run('update_field', { field_id: f.id, fields: {
        label: document.getElementById('ef-label').value,
        field_type: document.getElementById('ef-type').value,
        is_required: document.getElementById('ef-req').checked,
        is_enabled: document.getElementById('ef-en').checked,
        options: csv('ef-opts'),
        knockout_enabled: document.getElementById('ef-ko').checked,
        knockout_values: csv('ef-kov'),
      }}).then(function () { closeModal(); reload(); }).catch(fail);
    });
  }

  // ---- Pipeline ----------------------------------------------------------
  function showPipeline(jobId) {
    loading();
    run('pipeline', { job_id: jobId }).then(function (d) {
      var stages = d.stages || [];
      var cols = stages.map(function (s) {
        var st = s.stage_type;
        var cards = (s.applications || []).map(function (a) {
          return '<div class="cand" draggable="true" data-app="' + esc(a.id) + '">' +
            '<div class="who">' + esc(a.candidate_name) + (a.rating ? ' <span class="sub">' + '★'.repeat(a.rating) + '</span>' : '') + '</div>' +
            '<div class="sub">' + esc(a.source || 'manual') + (a.knockout_flag ? ' · <span class="pill no">knockout</span>' : '') +
              (a.applied_at ? ' · ' + agoLabel(a.applied_at) : '') + '</div></div>';
        }).join('');
        return '<div class="col"><div class="colhead"><span>' + esc(s.name) +
            (st && st !== 'active' ? ' <span class="pill ' + (st === 'hired' ? 'ok' : 'no') + '">' + esc(st) + '</span>' : '') +
            '</span><span>' + (s.applications || []).length + '</span></div>' +
          '<div class="drop" data-stage="' + esc(s.id) + '">' + (cards || '<div class="sub" style="padding:6px 2px">—</div>') + '</div></div>';
      }).join('');
      body.innerHTML = '<button class="back" id="back">← All openings</button>' +
        '<div class="card"><div class="row"><div class="grow"><div class="name">' + esc(d.job.title) + '</div>' +
          '<div class="sub">' + esc(d.job.department || '') + (d.job.positions_to_fill ? ' · ' + d.job.positions_filled + '/' + d.job.positions_to_fill + ' filled' : '') + '</div></div>' +
          '<button class="act" id="editjob">Edit job</button><button class="act primary" id="addcand">+ Add candidate</button></div></div>' +
        '<div class="sub" style="margin:8px 0 2px">Drag a card between columns to move someone, or click it to open. The stage TYPE (hired / rejected) drives their status.</div>' +
        '<div class="board" style="margin-top:4px">' + cols + '</div>';
      document.getElementById('back').addEventListener('click', showJobs);
      document.getElementById('editjob').addEventListener('click', function () { showJobEditor(jobId); });
      document.getElementById('addcand').addEventListener('click', function () { addCandidateModal(jobId); });
      bind('[data-app]', function (el) { showCandidate(el.getAttribute('data-app'), jobId); });

      // Drag a candidate card onto a stage's drop zone to move them.
      var dragId = null;
      body.querySelectorAll('.cand[draggable]').forEach(function (el) {
        el.addEventListener('dragstart', function (ev) { dragId = el.getAttribute('data-app'); if (ev.dataTransfer) ev.dataTransfer.effectAllowed = 'move'; el.style.opacity = '.4'; });
        el.addEventListener('dragend', function () { el.style.opacity = ''; });
      });
      body.querySelectorAll('.drop').forEach(function (zone) {
        zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
        zone.addEventListener('drop', function (ev) {
          ev.preventDefault(); zone.classList.remove('over');
          var stageId = zone.getAttribute('data-stage');
          if (dragId) run('move', { application_id: dragId, stage_id: stageId }).then(function () { showPipeline(jobId); }).catch(fail);
        });
      });
    }).catch(fail);
  }

  function addCandidateModal(jobId) {
    modal('<div class="name" style="font-size:.85rem">Add a candidate</div>' +
      '<div class="field" style="margin-top:8px"><label>First name</label><input type="text" id="ac-first" style="flex:1"></div>' +
      '<div class="field"><label>Last name</label><input type="text" id="ac-last" style="flex:1"></div>' +
      '<div class="field"><label>Email</label><input type="email" id="ac-email" style="flex:1"></div>' +
      '<div class="field"><label>Phone</label><input type="text" id="ac-phone" style="flex:1"></div>' +
      '<div class="field"><label>Source</label><select id="ac-source"><option>manual</option><option>referral</option><option>seek</option><option>walk_in</option></select></div>' +
      '<div class="row" style="margin-top:10px"><button class="act primary" id="ac-add">Add to pipeline</button><span class="grow"></span><button class="act" id="ac-cancel">Cancel</button></div>');
    document.getElementById('ac-cancel').addEventListener('click', closeModal);
    document.getElementById('ac-add').addEventListener('click', function () {
      run('add_candidate', { job_id: jobId, venue_id: ctx && ctx.venueId,
        first_name: document.getElementById('ac-first').value, last_name: document.getElementById('ac-last').value,
        email: document.getElementById('ac-email').value, phone: document.getElementById('ac-phone').value,
        source: document.getElementById('ac-source').value })
        .then(function () { closeModal(); showPipeline(jobId); }).catch(fail);
    });
  }

  // ---- Candidate ---------------------------------------------------------
  function showCandidate(applicationId, jobId) {
    loading();
    run('candidate', { application_id: applicationId }).then(function (d) {
      var a = d.application, c = d.candidate;
      var options = (d.stages || []).map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === a.stage_id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
      var answers = (d.answers || []).map(function (x) { return '<div class="kv"><b>' + esc(x.label || x.field_key) + '</b><span>' + esc(x.value) + '</span></div>'; }).join('') || '<div class="sub">No application answers.</div>';
      var notes = (d.notes || []).map(function (n) { return '<div class="feed">' + esc(n.body) + ' <span class="sub">— ' + esc(n.author || '') + '</span></div>'; }).join('') || '<div class="sub">No notes yet.</div>';
      var feed = (d.activity || []).map(function (x) { return '<div class="feed">' + esc(x.summary) + ' <span class="sub">' + esc((x.at || '').slice(0, 16).replace('T', ' ')) + '</span></div>'; }).join('') || '<div class="sub">Nothing yet.</div>';
      var interviews = (d.interviews || []).map(function (iv) {
        return '<div class="feed">' + esc(iv.interview_type || 'interview') + ' · ' + esc((iv.scheduled_at || 'unscheduled').replace('T', ' ')) +
          (iv.duration_minutes ? ' · ' + iv.duration_minutes + 'min' : '') +
          (iv.location ? ' · ' + esc(iv.location) : '') +
          (iv.meeting_url ? ' · <a class="link" href="' + esc(iv.meeting_url) + '" target="_blank">link</a>' : '') + '</div>';
      }).join('') || '<div class="sub">No interviews.</div>';
      var stars = ''; for (var i = 1; i <= 5; i++) stars += '<span data-star="' + i + '">' + (a.rating >= i ? '★' : '☆') + '</span>';

      body.innerHTML = '<button class="back" id="back">← Pipeline</button>' +
        '<div class="card"><div class="row"><div class="grow"><div class="name">' + esc(c.name) + '</div>' +
          '<div class="sub">' + esc(c.email || '') + (c.phone ? ' · ' + esc(c.phone) : '') + '</div></div>' + statusPill(a.status) + '</div>' +
          '<div class="row" style="margin-top:8px"><span class="sub">Rating</span><span class="stars" id="stars">' + stars + '</span>' +
            '<span class="grow"></span>' +
            '<label class="sub" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="tp"' + (c.in_talent_pool ? ' checked' : '') + '> talent pool</label></div>' +
          '<div class="row" style="margin-top:10px;gap:8px"><select id="stage">' + options + '</select>' +
            '<button class="act" id="move">Move</button>' +
            '<button class="act" id="interview">Schedule interview</button>' +
            (a.status === 'rejected' ? '' : '<button class="act danger" id="reject">Not progressing</button>') +
            (a.status === 'hired' ? '' :
              '<select id="hire-role"><option value="team_member">Team member</option><option value="manager">Manager</option><option value="head_office">Head office</option></select>' +
              '<input type="date" id="hire-start" title="start date">' +
              '<button class="act primary" id="hire">Hire</button>') +
            (a.person_id ? '<span class="sub">on the team — Training can enrol them</span>' : '') +
          '</div></div>' +
        '<div class="card"><div class="name" style="font-size:.78rem">Application</div>' + answers + '</div>' +
        '<div class="card"><div class="name" style="font-size:.78rem">Interviews</div>' + interviews + '</div>' +
        '<div class="card"><div class="name" style="font-size:.78rem">Notes</div>' + notes +
          '<textarea id="note" rows="2" placeholder="Add a note…" style="margin-top:6px"></textarea><button class="act" id="addnote" style="margin-top:5px">Add note</button></div>' +
        '<div class="card"><div class="name" style="font-size:.78rem">Activity</div>' + feed + '</div>';

      var reload = function () { showCandidate(applicationId, jobId); };
      document.getElementById('back').addEventListener('click', function () { showPipeline(jobId); });
      document.getElementById('move').addEventListener('click', function () { run('move', { application_id: applicationId, stage_id: document.getElementById('stage').value }).then(reload).catch(fail); });
      document.getElementById('addnote').addEventListener('click', function () { var b = document.getElementById('note').value; if (b.trim()) run('note', { application_id: applicationId, body: b }).then(reload).catch(fail); });
      document.getElementById('tp').addEventListener('change', function () { run('set_talent_pool', { candidate_id: c.id, in_talent_pool: this.checked }).catch(fail); });
      document.getElementById('interview').addEventListener('click', function () { interviewModal(applicationId, reload); });
      var rej = document.getElementById('reject'); if (rej) rej.addEventListener('click', function () { rejectModal(applicationId, reload); });
      var hire = document.getElementById('hire'); if (hire) hire.addEventListener('click', function () {
        run('hire', { application_id: applicationId, venue_id: ctx && ctx.venueId,
          role: document.getElementById('hire-role').value, start_date: document.getElementById('hire-start').value || null }).then(reload).catch(fail);
      });
      document.getElementById('stars').querySelectorAll('[data-star]').forEach(function (el) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function () { run('set_rating', { application_id: applicationId, rating: Number(el.getAttribute('data-star')) }).then(reload).catch(fail); });
      });
    }).catch(fail);
  }

  function rejectModal(applicationId, reload) {
    modal('<div class="name" style="font-size:.85rem">Not progressing</div>' +
      '<textarea id="rej-reason" rows="3" placeholder="Reason (optional, recorded on the candidate)" style="margin-top:8px"></textarea>' +
      '<div class="row" style="margin-top:10px"><button class="act danger" id="rej-do">Reject</button><span class="grow"></span><button class="act" id="rej-cancel">Cancel</button></div>');
    document.getElementById('rej-cancel').addEventListener('click', closeModal);
    document.getElementById('rej-do').addEventListener('click', function () {
      run('reject', { application_id: applicationId, reason: document.getElementById('rej-reason').value || null }).then(function () { closeModal(); reload(); }).catch(fail);
    });
  }

  function interviewModal(applicationId, reload) {
    modal('<div class="name" style="font-size:.85rem">Schedule interview</div>' +
      '<div class="field" style="margin-top:8px"><label>Type</label><select id="iv-type"><option value="phone_screen">Phone screen</option><option value="in_person">In person</option><option value="video">Video</option><option value="trial_shift">Trial shift</option></select></div>' +
      '<div class="field"><label>When</label><input type="datetime-local" id="iv-when"></div>' +
      '<div class="field"><label>Duration (min)</label><input type="number" id="iv-dur" style="width:90px" value="30"></div>' +
      '<div class="field"><label>Location</label><input type="text" id="iv-loc" style="flex:1" placeholder="venue / room"></div>' +
      '<div class="field"><label>Meeting URL</label><input type="text" id="iv-url" style="flex:1" placeholder="video call link (optional)"></div>' +
      '<div class="field"><label>Briefing</label></div><textarea id="iv-inst" rows="2" placeholder="Notes for the candidate or panel"></textarea>' +
      '<div class="row" style="margin-top:10px"><button class="act primary" id="iv-do">Schedule</button><span class="grow"></span><button class="act" id="iv-cancel">Cancel</button></div>');
    document.getElementById('iv-cancel').addEventListener('click', closeModal);
    document.getElementById('iv-do').addEventListener('click', function () {
      var dur = document.getElementById('iv-dur').value;
      run('schedule_interview', { application_id: applicationId, interview_type: document.getElementById('iv-type').value,
        scheduled_at: document.getElementById('iv-when').value || null, location: document.getElementById('iv-loc').value || null,
        duration_minutes: dur ? Number(dur) : null, meeting_url: document.getElementById('iv-url').value || null,
        instructions: document.getElementById('iv-inst').value || null })
        .then(function () { closeModal(); reload(); }).catch(fail);
    });
  }

  // ---- Talent pool -------------------------------------------------------
  function showPool() {
    loading();
    run('talent_pool').then(function (d) {
      var rows = d.candidates || [];
      if (!rows.length) { body.innerHTML = '<div class="empty">Nobody in the talent pool yet. Tick "talent pool" on a candidate to add them.</div>'; return; }
      body.innerHTML = rows.map(function (c) {
        return '<div class="card row"><div class="grow"><div class="name">' + esc(c.name) + '</div>' +
          '<div class="sub">' + esc(c.email || '') + (c.talent_pool_note ? ' · ' + esc(c.talent_pool_note) : '') + '</div></div>' +
          '<button class="act tiny" data-tpremove="' + esc(c.id) + '">Remove</button></div>';
      }).join('');
      bind('[data-tpremove]', function (el) { run('set_talent_pool', { candidate_id: el.getAttribute('data-tpremove'), in_talent_pool: false }).then(showPool).catch(fail); });
    }).catch(fail);
  }

  function render() { closeModal(); view === 'pool' ? showPool() : showJobs(); }

  document.getElementById('newjob').addEventListener('click', newJob);
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      view = t.getAttribute('data-view');
      document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x === t)); });
      render();
    });
  });

  norm.onReady(function (c) {
    ctx = c;
    var v = (c.venues || []).find(function (x) { return x.id === c.venueId; });
    document.getElementById('scope').textContent = 'Openings across the group' + (v ? ' · hiring into ' + v.name : '');
    render();
  });
})();
</script>
