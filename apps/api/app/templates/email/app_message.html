{% extends "base.html" %}
{% block content %}
<div style="margin:-32px -32px 24px; padding:22px 32px; border-radius:12px 12px 0 0; background:#49556A; color:#fff;">
  <div style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; opacity:0.8;">{{ org_name }}</div>
  <div style="font-size:18px; font-weight:700; margin-top:2px;">{{ app_name }}</div>
</div>
<h1>{{ heading }}</h1>
{{ body_html | safe }}
{% if button_url and button_label %}
<p style="margin-top:20px;"><a href="{{ button_url }}" class="btn" style="background:#49556A;">{{ button_label }}</a></p>
<p style="font-size:12px; color:#888;">Or paste this link into your browser: {{ button_url }}</p>
{% endif %}
{% endblock %}
